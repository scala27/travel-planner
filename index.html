<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2B4C7E" />
  <title>沖繩旅圖｜個人卡片式旅遊規劃 PWA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS (流暢支援手機觸控與電腦拖曳) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <!-- Leaflet CSS & JS (互動地圖與路徑繪製) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 日式極簡「清透韌性」配色
            'washi-bg': '#F6F7F9',
            'washi-card': '#FFFFFF',
            'ai-indigo': '#2B4C7E',
            'ai-slate': '#567EBB',
            'moss-green': '#4A7C59',
            'sand-ochre': '#D98A3C',
            'ink-dark': '#1E293B',
            'ink-muted': '#64748B'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: #F6F7F9;
      color: #1E293B;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    
    .sortable-ghost { opacity: 0.4; background: #E2E8F0 !important; border: 2px dashed #567EBB !important; }
    .sortable-drag { transform: rotate(2deg); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shrink-0 z-20 shadow-xs">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-ai-indigo text-white flex items-center justify-center shadow-xs">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 id="header-trip-title" class="font-bold text-base sm:text-lg text-ink-dark leading-tight">2027 沖繩冬日自駕與散策之旅</h1>
        <p id="header-trip-dates" class="text-xs text-ink-muted">2027-02-17 ~ 2027-02-22 (6天5夜)</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span id="sync-status-badge" class="hidden sm:inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
        <span class="w-2 h-2 rounded-full bg-amber-500" id="sync-dot"></span>
        <span id="sync-text">本機模式</span>
      </span>
      <button onclick="openModal('modal-settings')" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition" title="系統與後端設定">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
      <button onclick="syncFromCloud()" class="flex items-center gap-1.5 bg-ai-indigo hover:bg-slate-800 text-white text-xs sm:text-sm font-medium px-3 py-2 rounded-lg transition shadow-xs">
        <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i>
        <span class="hidden sm:inline">同步資料</span>
      </button>
    </div>
  </header>

  <!-- 手機版分頁切換器 (小螢幕顯示) -->
  <div class="flex lg:hidden bg-white border-b border-slate-200 text-sm font-medium shrink-0">
    <button onclick="switchMobileTab('pocket')" id="tab-pocket" class="flex-1 py-2.5 text-center border-b-2 border-ai-indigo text-ai-indigo">
      口袋名單 (<span id="mobile-pocket-count">0</span>)
    </button>
    <button onclick="switchMobileTab('itinerary')" id="tab-itinerary" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500">
      每日行程看板
    </button>
    <button onclick="switchMobileTab('map')" id="tab-map" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500">
      互動地圖
    </button>
  </div>

  <!-- 主工作區：三欄式佈局 (左：口袋名單 / 中：每日行程看板 / 右：地圖) -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- ==================== 左欄：口袋名單與混合式智慧收件匣 ==================== -->
    <section id="panel-pocket" class="w-full lg:w-[370px] xl:w-[400px] bg-white border-r border-slate-200 flex flex-col shrink-0 h-full">
      <!-- 混合式智慧收件匣 -->
      <div class="p-3 bg-slate-50 border-b border-slate-200 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-ai-indigo flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> 混合式智慧收件匣
          </span>
          <div class="flex items-center gap-2">
            <span id="ai-mode-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-100 text-ai-indigo font-medium">
              🔍 搜尋查證模式
            </span>
            <button onclick="openNewCardModal()" class="text-xs text-slate-500 hover:text-ai-indigo font-medium flex items-center gap-0.5">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 手動
            </button>
          </div>
        </div>

        <!-- 多行輸入區（支援貼上貼文文案、店名、Google Maps 或 YouTube 連結） -->
        <div class="relative">
          <textarea id="ai-url-input" rows="2" oninput="detectInputMode()"
            placeholder="貼上影片截圖(Ctrl+V)、YouTube連結、Google Maps連結、店名或貼文文字..." 
            class="w-full text-xs bg-white border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-ai-indigo resize-none leading-relaxed"></textarea>
        </div>

        <!-- 截圖預覽區（當使用者選取或貼上圖片時顯示） -->
        <div id="inbox-image-preview-wrap" class="hidden items-center justify-between bg-white border border-indigo-200 rounded-lg p-1.5">
          <div class="flex items-center gap-2 overflow-hidden">
            <img id="inbox-image-preview" src="" alt="截圖預覽" class="w-10 h-10 object-cover rounded border border-slate-200 shrink-0" />
            <div class="text-[11px] truncate">
              <p class="font-bold text-ai-indigo truncate" id="inbox-image-name">已載入影片截圖</p>
              <p class="text-slate-400">將自動辨識畫面並存入雲端硬碟</p>
            </div>
          </div>
          <button type="button" onclick="clearInboxImage()" class="p-1 text-slate-400 hover:text-red-500 rounded" title="移除圖片">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 工具列與執行按鈕 -->
        <div class="flex items-center justify-between gap-2">
          <label class="cursor-pointer inline-flex items-center gap-1.5 text-xs bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-2.5 py-1.5 rounded-lg transition font-medium">
            <i data-lucide="image-plus" class="w-3.5 h-3.5 text-ai-indigo"></i>
            <span>上傳截圖</span>
            <input type="file" id="inbox-file-input" accept="image/*" class="hidden" onchange="handleInboxFileSelect(event)" />
          </label>

          <button onclick="handleAiExtract()" id="btn-ai-extract"
            class="flex-1 bg-ai-indigo hover:bg-slate-800 text-white text-xs font-medium px-3 py-1.5 rounded-lg flex items-center justify-center gap-1.5 transition shadow-2xs">
            <i data-lucide="wand-2" class="w-3.5 h-3.5"></i>
            <span>AI 智慧建立卡片</span>
          </button>
        </div>
      </div>

      <!-- 篩選列 -->
      <div class="px-3.5 py-2.5 border-b border-slate-100 space-y-2 shrink-0">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
          <input type="text" id="search-input" oninput="renderAll()" placeholder="搜尋景點、必買商品、區域..." 
            class="w-full text-xs bg-slate-100 rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:bg-white focus:ring-1 focus:ring-ai-indigo" />
        </div>
        <div class="flex gap-1.5 overflow-x-auto pb-0.5" id="category-filters">
          <button onclick="setFilterCategory('全部')" class="cat-btn active px-2.5 py-1 rounded-full text-xs font-medium bg-ai-indigo text-white">全部</button>
          <button onclick="setFilterCategory('景點')" class="cat-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">🏞️ 景點</button>
          <button onclick="setFilterCategory('美食')" class="cat-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">🍜 美食</button>
          <button onclick="setFilterCategory('購物')" class="cat-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">🛍️ 購物</button>
          <button onclick="setFilterCategory('住宿')" class="cat-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">🏨 住宿</button>
        </div>
        <div class="flex gap-1 overflow-x-auto text-[11px]" id="area-filters">
          <button onclick="setFilterArea('全部')" class="area-btn px-2 py-0.5 rounded bg-slate-200 text-slate-800 font-medium">全沖繩</button>
          <button onclick="setFilterArea('那霸市區')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100">那霸市區</button>
          <button onclick="setFilterArea('中部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100">中部(浦添/北谷)</button>
          <button onclick="setFilterArea('北部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100">北部(本部/名護)</button>
          <button onclick="setFilterArea('南部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100">南部(糸滿/南城)</button>
        </div>
      </div>

      <!-- 口袋名單卡片拖曳區 -->
      <div class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-slate-50/50" id="pocket-dropzone" data-day="pocket">
        <!-- 卡片動態渲染於此 -->
      </div>
    </section>

    <!-- ==================== 中欄：每日行程看板 (Kanban) ==================== -->
    <section id="panel-itinerary" class="hidden lg:flex flex-1 flex-col bg-washi-bg overflow-hidden h-full">
      <div class="px-4 py-2.5 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 text-xs text-ink-muted">
          <i data-lucide="grip-vertical" class="w-4 h-4 text-ai-slate"></i>
          <span>直接將左側口袋卡片<strong>拖曳</strong>至各日行程中，或上下調整順序</span>
        </div>
        <button onclick="saveBoardOrderToCloud()" class="text-xs bg-moss-green hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition shadow-xs">
          <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> 儲存排程順序
        </button>
      </div>

      <!-- 橫向捲動的多日看板容器 -->
      <div id="days-kanban-container" class="flex-1 flex gap-3.5 p-4 overflow-x-auto overflow-y-hidden items-start">
        <!-- 每日欄位動態生成 -->
      </div>
    </section>

    <!-- ==================== 右欄：地理空間互動地圖 ==================== -->
    <section id="panel-map" class="hidden lg:flex w-full lg:w-[340px] xl:w-[400px] bg-white border-l border-slate-200 flex-col shrink-0 h-full">
      <div class="p-3 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
        <span class="text-xs font-bold text-ink-dark flex items-center gap-1.5">
          <i data-lucide="map-pin" class="w-4 h-4 text-ai-indigo"></i> 行程空間動線檢視
        </span>
        <select id="map-day-selector" onchange="updateMapMarkers()" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 focus:outline-none">
          <option value="all">顯示全部景點</option>
          <option value="pocket">僅顯示口袋名單</option>
        </select>
      </div>
      <div id="okinawa-map" class="flex-1 w-full z-10"></div>
    </section>

  </main>

  <!-- ==================== 視窗 1：卡片詳細資訊與編輯 Modal ==================== -->
  <div id="modal-card-detail" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-base text-ink-dark" id="modal-card-title">景點卡片詳情</h3>
        <button onclick="closeModal('modal-card-detail')" class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="card-form" onsubmit="handleSaveCard(event)" class="p-5 overflow-y-auto space-y-3.5 text-sm">
        <input type="hidden" id="field-id" />
        
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-xs font-medium text-slate-600 mb-1">景點 / 店家名稱 *</label>
            <input type="text" id="field-name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:border-ai-indigo focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">分類</label>
            <select id="field-category" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="景點">🏞️ 景點</option>
              <option value="美食">🍜 美食</option>
              <option value="購物">🛍️ 購物</option>
              <option value="住宿">🏨 住宿</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">沖繩區域</label>
            <select id="field-area" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="那霸市區">那霸市區</option>
              <option value="中部">中部(浦添/北谷)</option>
              <option value="北部">北部(本部/名護)</option>
              <option value="南部">南部(糸滿/南城)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">預計停留(分)</label>
            <input type="number" id="field-duration" value="60" min="10" step="10" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">排入日期</label>
            <select id="field-day" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="pocket">📌 口袋名單</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">必訪說明與特色亮點</label>
          <textarea id="field-description" rows="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:border-ai-indigo focus:outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">🛍️ 必買商品 / 必吃招牌</label>
          <input type="text" id="field-must-buy" placeholder="以逗號分隔，例如：檸檬塔, 限定伴手禮" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">⏰ 營業時間與公休日</label>
            <input type="text" id="field-hours" placeholder="例如：11:00-19:00 (週三休)" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">🚗 停車與 MapCode 資訊</label>
            <input type="text" id="field-parking" placeholder="免費停車場 / MapCode" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">🔗 原始參考連結</label>
            <input type="url" id="field-source-url" placeholder="https://..." class="w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">🖼️ 照片連結 (雲端硬碟或圖床)</label>
            <input type="url" id="field-photo-url" placeholder="https://..." class="w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-1 border-t border-slate-100">
          <div>
            <label class="block text-[11px] text-slate-400">緯度 (留空自動抓取)</label>
            <input type="text" id="field-lat" placeholder="自動地理編碼" class="w-full text-xs border border-slate-200 rounded px-2.5 py-1.5 bg-slate-50" />
          </div>
          <div>
            <label class="block text-[11px] text-slate-400">經度 (留空自動抓取)</label>
            <input type="text" id="field-lng" placeholder="自動地理編碼" class="w-full text-xs border border-slate-200 rounded px-2.5 py-1.5 bg-slate-50" />
          </div>
        </div>

        <div class="pt-3 flex items-center justify-between border-t border-slate-200">
          <button type="button" id="btn-delete-card" onclick="handleDeleteCard()" class="text-xs text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg font-medium">
            刪除卡片
          </button>
          <div class="flex gap-2">
            <a id="btn-google-nav" href="#" target="_blank" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium flex items-center gap-1">
              <i data-lucide="navigation" class="w-3.5 h-3.5"></i> Google 導航
            </a>
            <button type="submit" class="bg-ai-indigo hover:bg-slate-800 text-white text-xs font-medium px-4 py-2 rounded-lg">
              儲存卡片
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== 視窗 2：系統與 Google Sheets API 設定 Modal ==================== -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h3 class="font-bold text-base text-ink-dark">系統與 Google 試算表後端設定</h3>
        <button onclick="closeModal('modal-settings')" class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Google Apps Script 網頁應用程式網址 (Web App URL)</label>
          <input type="url" id="setting-gas-url" placeholder="https://script.google.com/macros/s/.../exec" 
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:border-ai-indigo focus:outline-none" />
          <p class="text-[11px] text-slate-500 mt-1">填入後即可與您的 Google 試算表雙向同步，並啟用截圖 Vision、YouTube 原生影音與 Google 搜尋建卡。</p>
        </div>

        <div class="pt-2 border-t border-slate-100">
          <label class="block text-xs font-bold text-slate-700 mb-1">行程標題</label>
          <input type="text" id="setting-trip-title" value="2027 沖繩冬日自駕與散策之旅" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">出發日期</label>
            <input type="date" id="setting-start-date" value="2027-02-17" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">回程日期</label>
            <input type="date" id="setting-end-date" value="2027-02-22" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs" />
          </div>
        </div>
      </div>

      <div class="pt-3 flex justify-end gap-2 border-t border-slate-200">
        <button onclick="closeModal('modal-settings')" class="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>

    const DEFAULT_SPOTS = [

        status: 'pocket',

      {

    ];

    let spots = [];
    let currentCategoryFilter = '全部';
    let currentAreaFilter = '全部';
    let mapInstance = null;
    let mapLayerGroup = null;

    // ==================== 初始化啟動 ====================
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      initMap();
      renderAll();
      lucide.createIcons();
      registerInlinePWA();
      setupClipboardPasteListener();

      if (appConfig.gasUrl) {
        syncFromCloud();

    function loadLocalState() {
      const savedCfg = localStorage.getItem(STORAGE_KEY_CONFIG);
      if (savedCfg) appConfig = { ...appConfig, ...JSON.parse(savedCfg) };

      const savedSpots = localStorage.getItem(STORAGE_KEY_SPOTS);
      spots = savedSpots ? JSON.parse(savedSpots) : [...DEFAULT_SPOTS];

      updateHeaderUI();
      updateSyncBadge();
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY_SPOTS, JSON.stringify(spots));
      localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(appConfig));
    }

    function updateHeaderUI() {
      document.getElementById('header-trip-title').textContent = appConfig.tripTitle;
      const daysList = getDateRangeArray(appConfig.startDate, appConfig.endDate);
      document.getElementById('header-trip-dates').textContent = 
        `${appConfig.startDate} ~ ${appConfig.endDate} (${daysList.length}天${Math.max(0, daysList.length - 1)}夜)`;

      document.getElementById('setting-gas-url').value = appConfig.gasUrl || '';
      document.getElementById('setting-trip-title').value = appConfig.tripTitle;
      document.getElementById('setting-start-date').value = appConfig.startDate;
      document.getElementById('setting-end-date').value = appConfig.endDate;
    }

    function updateSyncBadge() {
      const dot = document.getElementById('sync-dot');
      const text = document.getElementById('sync-text');
      if (appConfig.gasUrl) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        text.textContent = 'Google 試算表已連線';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
        text.textContent = '本機離線模式';
      }
    }

    // ==================== 混合式智慧收件匣：圖片處理與模式偵測 ====================
    function setupClipboardPasteListener() {
      document.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
          if (item.type.indexOf('image') === 0) {
            const file = item.getAsFile();
            if (file) {
              processAndCompressImage(file, '剪貼簿截圖.jpg');
              showToast('已偵測到剪貼簿截圖！');
            }
          }
        }
      });
    }

    function handleInboxFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      processAndCompressImage(file, file.name);
      event.target.value = '';
    }

    // 前端 Canvas 自動壓縮圖片（最大寬度 1024px），確保上傳 GAS 快速且不超時
    function processAndCompressImage(file, displayName) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1024;
          let width = img.width;
          let height = img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          inboxPendingImage.base64 = dataUrl.split(',')[1];
          inboxPendingImage.mimeType = 'image/jpeg';
          inboxPendingImage.name = displayName;

          document.getElementById('inbox-image-preview').src = dataUrl;
          document.getElementById('inbox-image-name').textContent = displayName;
          const wrap = document.getElementById('inbox-image-preview-wrap');
          wrap.classList.remove('hidden');
          wrap.classList.add('flex');
          detectInputMode();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearInboxImage() {
      inboxPendingImage = { base64: '', mimeType: 'image/jpeg', name: '' };
      const wrap = document.getElementById('inbox-image-preview-wrap');
      wrap.classList.add('hidden');
      wrap.classList.remove('flex');
      detectInputMode();
    }

    function detectInputMode() {
      const badge = document.getElementById('ai-mode-badge');
      const text = document.getElementById('ai-url-input').value.trim();

      if (inboxPendingImage.base64) {
        badge.textContent = '🖼️ 截圖視覺辨識';
        badge.className = 'text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-medium';
      } else if (/(youtube\.com|youtu\.be)/i.test(text)) {
        badge.textContent = '🎬 YouTube 原生影音';
        badge.className = 'text-[10px] px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-medium';
      } else {
        badge.textContent = '🔍 搜尋查證建卡';
        badge.className = 'text-[10px] px-2 py-0.5 rounded-full bg-indigo-100 text-ai-indigo font-medium';
      }
    }

    async function handleAiExtract() {
      const inputEl = document.getElementById('ai-url-input');
      const rawText = inputEl.value.trim();

      if (!rawText && !inboxPendingImage.base64) {
        showToast('請貼上截圖、YouTube 連結、Google Maps 連結或輸入店名！');
        return;
      }

      if (!appConfig.gasUrl) {
        showToast('尚未設定 GAS 網址，已為您開啟手動建立視窗');
        openNewCardModal(rawText);
        return;
      }

      const btn = document.getElementById('btn-ai-extract');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span>AI 解析中...</span>`;
      lucide.createIcons();

      try {
        const res = await fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'ai_extract',
            input: rawText,
            imageBase64: inboxPendingImage.base64,
            mimeType: inboxPendingImage.mimeType
          })
        });
        const data = await res.json();
        if (data.status === 'success' && data.spots && data.spots.length > 0) {
          // 支援單張或影片介紹的多張卡片批次匯入
          data.spots.reverse().forEach(s => spots.unshift(s));
          saveLocalState();
          renderAll();
          inputEl.value = '';
          clearInboxImage();

          const names = data.spots.map(s => s.name).join('、');
          showToast(`✨ 成功建立 ${data.spots.length} 張卡片：${names}`);
        } else {
          throw new Error(data.message || 'AI 解析未回傳卡片資料');
        }
      } catch (err) {
        alert('解析發生錯誤：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="wand-2" class="w-3.5 h-3.5"></i> <span>AI 智慧建立卡片</span>`;
        lucide.createIcons();
      }
    }

    // ==================== 日期計算工具 ====================
    function getDateRangeArray(startStr, endStr) {
      const list = [];
      let curr = new Date(startStr);
      const end = new Date(endStr);
      const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
      let idx = 1;
      while (curr <= end && idx <= 14) {
        const yyyy = curr.getFullYear();
        const mm = String(curr.getMonth() + 1).padStart(2, '0');
        const dd = String(curr.getDate()).padStart(2, '0');
        list.push({
          dateStr: `${yyyy}-${mm}-${dd}`,
          label: `Day ${idx}`,
          shortDate: `${mm}/${dd} (週${weekNames[curr.getDay()]})`
        });
        curr.setDate(curr.getDate() + 1);
        idx++;
      }
      return list;
    }

    // ==================== 畫面渲染核心 ====================
    function renderAll() {
      const daysList = getDateRangeArray(appConfig.startDate, appConfig.endDate);
      renderPocketList();
      renderKanbanDays(daysList);
      populateDaySelectors(daysList);
      initSortableDragAndDrop();
      updateMapMarkers();
      lucide.createIcons();
    }

    function renderPocketList() {
      const container = document.getElementById('pocket-dropzone');
      const keyword = document.getElementById('search-input').value.trim().toLowerCase();

      const pocketSpots = spots
        .filter(s => s.assigned_day === 'pocket')
        .filter(s => currentCategoryFilter === '全部' || s.category === currentCategoryFilter)
        .filter(s => currentAreaFilter === '全部' || s.area === currentAreaFilter)
        .filter(s => !keyword || 
          (s.name && s.name.toLowerCase().includes(keyword)) ||
          (s.must_buy && s.must_buy.toLowerCase().includes(keyword)) ||
          (s.description && s.description.toLowerCase().includes(keyword))
        )
        .sort((a, b) => (a.sort_order || 99) - (b.sort_order || 99));

      document.getElementById('mobile-pocket-count').textContent = pocketSpots.length;

      if (pocketSpots.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 px-4 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-xs">
            <p class="mb-1 font-medium">目前沒有符合條件的口袋卡片</p>
            <p>上方可上傳截圖、貼上 YouTube 連結或輸入店名建卡！</p>
          </div>`;
        return;
      }

      container.innerHTML = pocketSpots.map(spot => buildCardHTML(spot, false)).join('');
    }

    function renderKanbanDays(daysList) {
      const container = document.getElementById('days-kanban-container');
      container.innerHTML = daysList.map(day => {
        const daySpots = spots
          .filter(s => s.assigned_day === day.dateStr)
          .sort((a, b) => (a.sort_order || 99) - (b.sort_order || 99));

        const totalMins = daySpots.reduce((sum, s) => sum + (Number(s.estimated_duration) || 60), 0);
        const hoursText = (totalMins / 60).toFixed(1).replace('.0', '');

        return `
          <div class="w-[290px] sm:w-[310px] bg-slate-100/90 rounded-2xl border border-slate-200/80 flex flex-col max-h-full shrink-0">
            <div class="px-3.5 py-2.5 border-b border-slate-200 bg-white rounded-t-2xl flex items-center justify-between">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-sm text-ai-indigo">${day.label}</span>
                  <span class="text-xs font-medium text-slate-600">${day.shortDate}</span>
                </div>
                <p class="text-[11px] text-slate-400 mt-0.5">共 ${daySpots.length} 個點 · 預計停留 ${hoursText} 小時</p>
              </div>
              <button onclick="focusMapOnDay('${day.dateStr}')" class="p-1.5 text-slate-400 hover:text-ai-indigo hover:bg-slate-100 rounded-lg" title="在地圖上檢視此日路線">
                <i data-lucide="map" class="w-4 h-4"></i>
              </button>
            </div>
            
            <div class="p-2.5 flex-1 overflow-y-auto space-y-2.5 min-h-[180px] day-dropzone" data-day="${day.dateStr}">
              ${daySpots.length > 0 
                ? daySpots.map((s, idx) => buildCardHTML(s, true, idx + 1)).join('') 
                : `<div class="h-28 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-center text-xs text-slate-400 pointer-events-none">拖曳口袋卡片至此排程</div>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function buildCardHTML(spot, isScheduled, orderNum) {
      const badgeColors = {
        '景點': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        '美食': 'bg-amber-50 text-amber-700 border-amber-200',
        '購物': 'bg-indigo-50 text-indigo-700 border-indigo-200',
        '住宿': 'bg-purple-50 text-purple-700 border-purple-200'
      };
      const badgeClass = badgeColors[spot.category] || 'bg-slate-100 text-slate-700';

      return `
        <div class="spot-card bg-white rounded-xl border border-slate-200/90 shadow-2xs hover:shadow-md transition cursor-grab active:cursor-grabbing overflow-hidden group"
             data-id="${spot.id}" onclick="openEditCardModal('${spot.id}')">
          ${spot.photo_url ? `
            <div class="h-24 w-full bg-slate-200 overflow-hidden relative">
              <img src="${spot.photo_url}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.parentElement.style.display='none'"/>
              <span class="absolute top-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/90 text-slate-700 shadow-2xs">${spot.area}</span>
            </div>
          ` : ''}
          <div class="p-3">
            <div class="flex items-start justify-between gap-2 mb-1">
              <div class="flex items-center gap-1.5">
                ${isScheduled ? `<span class="w-5 h-5 rounded-full bg-ai-indigo text-white text-[11px] font-bold flex items-center justify-center shrink-0">${orderNum}</span>` : ''}
                <h4 class="font-bold text-sm text-ink-dark leading-snug">${spot.name}</h4>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded-md border font-medium shrink-0 ${badgeClass}">${spot.category}</span>
            </div>

            ${spot.description ? `<p class="text-xs text-slate-500 line-clamp-2 mb-2">${spot.description}</p>` : ''}

            ${spot.must_buy ? `
              <div class="bg-amber-50/70 border border-amber-100 rounded-lg px-2 py-1 mb-2 text-[11px] text-amber-900">
                <span class="font-bold">🛍️ 必買/必吃：</span>${spot.must_buy}
              </div>
            ` : ''}

            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1.5 border-t border-slate-100">
              <span class="flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i> ${spot.estimated_duration || 60}分
                ${!spot.photo_url ? `· ${spot.area}` : ''}
              </span>
              <div class="flex items-center gap-2">
                ${spot.business_hours ? `<span title="${spot.business_hours}" class="text-slate-500 truncate max-w-[110px]">⏰ ${spot.business_hours}</span>` : ''}
                <button type="button" onclick="event.stopPropagation(); focusMapOnSpot('${spot.id}')" class="text-ai-slate hover:text-ai-indigo" title="在地圖定位">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== 拖曳排序互動 (SortableJS) ====================
    function initSortableDragAndDrop() {
      const pocketEl = document.getElementById('pocket-dropzone');
      if (pocketEl) {
        new Sortable(pocketEl, {
          group: 'okinawa-cards',
          animation: 180,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag',
          onEnd: handleDragEnd
        });
      }

      document.querySelectorAll('.day-dropzone').forEach(zone => {
        new Sortable(zone, {
          group: 'okinawa-cards',
          animation: 180,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag',
          onEnd: handleDragEnd
        });
      });
    }

    function handleDragEnd() {
      const updates = [];
      document.querySelectorAll('#pocket-dropzone .spot-card').forEach((card, idx) => {
        const id = card.dataset.id;
        const spot = spots.find(s => s.id === id);
        if (spot) {
          spot.assigned_day = 'pocket';
          spot.status = 'pocket';
          spot.sort_order = idx + 1;
          updates.push({ id, assigned_day: 'pocket', sort_order: idx + 1 });
        }
      });

      document.querySelectorAll('.day-dropzone').forEach(zone => {
        const dayStr = zone.dataset.day;
        zone.querySelectorAll('.spot-card').forEach((card, idx) => {
          const id = card.dataset.id;
          const spot = spots.find(s => s.id === id);
          if (spot) {
            spot.assigned_day = dayStr;
            spot.status = 'scheduled';
            spot.sort_order = idx + 1;
            updates.push({ id, assigned_day: dayStr, sort_order: idx + 1 });
          }
        });
      });

      saveLocalState();
      renderAll();
      showToast('行程已更新！');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'sync_board', updates })
        }).catch(err => console.error('背景同步失敗', err));
      }
    }

    // ==================== 地圖模組 (Leaflet.js) ====================
    function initMap() {
      mapInstance = L.map('okinawa-map').setView([26.35, 127.78], 10);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 18
      }).addTo(mapInstance);
      mapLayerGroup = L.layerGroup().addTo(mapInstance);
    }

    function populateDaySelectors(daysList) {
      const mapSel = document.getElementById('map-day-selector');
      const currentVal = mapSel.value;
      mapSel.innerHTML = `
        <option value="all">顯示全部景點</option>
        <option value="pocket">僅顯示口袋名單</option>
        ${daysList.map(d => `<option value="${d.dateStr}">${d.label} (${d.shortDate}) 路線</option>`).join('')}
      `;
      if ([...mapSel.options].some(o => o.value === currentVal)) {
        mapSel.value = currentVal;
      }

      const formDaySel = document.getElementById('field-day');
      formDaySel.innerHTML = `
        <option value="pocket">📌 口袋名單</option>
        ${daysList.map(d => `<option value="${d.dateStr}">${d.label} (${d.shortDate})</option>`).join('')}
      `;
    }

    function updateMapMarkers() {
      if (!mapInstance || !mapLayerGroup) return;
      mapLayerGroup.clearLayers();

      const filterDay = document.getElementById('map-day-selector').value;
      let filtered = spots.filter(s => s.lat && s.lng);

      if (filterDay === 'pocket') {
        filtered = filtered.filter(s => s.assigned_day === 'pocket');
      } else if (filterDay !== 'all') {
        filtered = filtered
          .filter(s => s.assigned_day === filterDay)
          .sort((a, b) => (a.sort_order || 99) - (b.sort_order || 99));
      }

      const latLngs = [];
      filtered.forEach((spot, index) => {
        const lat = parseFloat(spot.lat);
        const lng = parseFloat(spot.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        latLngs.push([lat, lng]);
        const isDayRoute = filterDay !== 'all' && filterDay !== 'pocket';

        const markerHtml = isDayRoute
          ? `<div style="background:#2B4C7E;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);">${index + 1}</div>`
          : `<div style="background:${spot.assigned_day === 'pocket' ? '#D98A3C' : '#4A7C59'};width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>`;

        const customIcon = L.divIcon({ html: markerHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12] });
        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(mapLayerGroup);
        marker.bindPopup(`
          <div class="text-xs">
            <strong class="text-sm text-slate-800">${spot.name}</strong><br/>
            <span class="text-slate-500">${spot.category} · ${spot.area}</span><br/>
            ${spot.must_buy ? `<span class="text-amber-700">必買：${spot.must_buy}</span>` : ''}
          </div>
        `);
      });

      if (filterDay !== 'all' && filterDay !== 'pocket' && latLngs.length > 1) {
        L.polyline(latLngs, { color: '#2B4C7E', weight: 3, dashArray: '6, 8', opacity: 0.8 }).addTo(mapLayerGroup);
      }

      if (latLngs.length > 0) {
        mapInstance.fitBounds(L.latLngBounds(latLngs), { padding: [40, 40], maxZoom: 14 });
      }
    }

    function focusMapOnSpot(id) {
      const spot = spots.find(s => s.id === id);
      if (!spot || !spot.lat || !spot.lng) return;
      switchMobileTab('map');
      setTimeout(() => {
        mapInstance.invalidateSize();
        mapInstance.setView([spot.lat, spot.lng], 15);
      }, 150);
    }

    function focusMapOnDay(dateStr) {
      document.getElementById('map-day-selector').value = dateStr;
      updateMapMarkers();
      switchMobileTab('map');
    }

    // ==================== Modal 表單與 CRUD 操作 ====================
    function openNewCardModal(prefillText = '') {
      document.getElementById('modal-card-title').textContent = '新增沖繩景點卡片';
      document.getElementById('card-form').reset();
      document.getElementById('field-id').value = '';
      document.getElementById('field-name').value = prefillText.startsWith('http') ? '' : prefillText;
      document.getElementById('field-source-url').value = prefillText.startsWith('http') ? prefillText : '';
      document.getElementById('btn-delete-card').classList.add('hidden');
      document.getElementById('btn-google-nav').classList.add('hidden');
      openModal('modal-card-detail');
    }

    function openEditCardModal(id) {
      const spot = spots.find(s => s.id === id);
      if (!spot) return;

      document.getElementById('modal-card-title').textContent = '編輯景點卡片';
      document.getElementById('field-id').value = spot.id;
      document.getElementById('field-name').value = spot.name || '';
      document.getElementById('field-category').value = spot.category || '景點';
      document.getElementById('field-area').value = spot.area || '那霸市區';
      document.getElementById('field-duration').value = spot.estimated_duration || 60;
      document.getElementById('field-day').value = spot.assigned_day || 'pocket';
      document.getElementById('field-description').value = spot.description || '';
      document.getElementById('field-must-buy').value = spot.must_buy || '';
      document.getElementById('field-hours').value = spot.business_hours || '';
      document.getElementById('field-parking').value = spot.parking_info || '';
      document.getElementById('field-source-url').value = spot.source_url || '';
      document.getElementById('field-photo-url').value = spot.photo_url || '';
      document.getElementById('field-lat').value = spot.lat || '';
      document.getElementById('field-lng').value = spot.lng || '';

      document.getElementById('btn-delete-card').classList.remove('hidden');
      const navBtn = document.getElementById('btn-google-nav');
      navBtn.classList.remove('hidden');
      navBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('沖繩 ' + spot.name)}`;

      openModal('modal-card-detail');
    }

    async function handleSaveCard(e) {
      e.preventDefault();
      const id = document.getElementById('field-id').value;
      const assignedDay = document.getElementById('field-day').value;

      const cardObj = {
        id: id || ('spot_' + Date.now()),
        name: document.getElementById('field-name').value.trim(),
        category: document.getElementById('field-category').value,
        area: document.getElementById('field-area').value,
        estimated_duration: Number(document.getElementById('field-duration').value) || 60,
        assigned_day: assignedDay,
        status: assignedDay === 'pocket' ? 'pocket' : 'scheduled',
        description: document.getElementById('field-description').value.trim(),
        must_buy: document.getElementById('field-must-buy').value.trim(),
        business_hours: document.getElementById('field-hours').value.trim(),
        parking_info: document.getElementById('field-parking').value.trim(),
        source_url: document.getElementById('field-source-url').value.trim(),
        photo_url: document.getElementById('field-photo-url').value.trim(),
        lat: document.getElementById('field-lat').value.trim(),
        lng: document.getElementById('field-lng').value.trim()
      };

      if (id) {
        const idx = spots.findIndex(s => s.id === id);
        if (idx > -1) spots[idx] = { ...spots[idx], ...cardObj };
      } else {
        cardObj.sort_order = 99;
        spots.unshift(cardObj);
      }

      saveLocalState();
      renderAll();
      closeModal('modal-card-detail');
      showToast('卡片已儲存！');

      if (appConfig.gasUrl) {
        try {
          const res = await fetch(appConfig.gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: id ? 'update_spot' : 'add_spot', spot: cardObj })
          });
          const data = await res.json();
          if (data.status === 'success' && data.spot) {
            const idx = spots.findIndex(s => s.id === data.spot.id);
            if (idx > -1) spots[idx] = data.spot;
            saveLocalState();
            renderAll();
          }
        } catch (err) {
          console.error('同步失敗', err);
        }
      }
    }

    async function handleDeleteCard() {
      const id = document.getElementById('field-id').value;
      if (!id || !confirm('確定要刪除這張景點卡片嗎？')) return;

      spots = spots.filter(s => s.id !== id);
      saveLocalState();
      renderAll();
      closeModal('modal-card-detail');
      showToast('卡片已刪除');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete_spot', id })
        });
      }
    }

    // ==================== 雲端雙向同步 ====================
    async function syncFromCloud() {
      if (!appConfig.gasUrl) {
        openModal('modal-settings');
        showToast('請先設定 Google Apps Script 網址');
        return;
      }

      const icon = document.getElementById('refresh-icon');
      icon.classList.add('animate-spin');

      try {
        const res = await fetch(appConfig.gasUrl);
        const data = await res.json();
        if (data.status === 'success') {
          spots = data.spots || [];
          if (data.config) {
            if (data.config.trip_title) appConfig.tripTitle = data.config.trip_title;
            if (data.config.start_date) appConfig.startDate = String(data.config.start_date).slice(0, 10);
            if (data.config.end_date) appConfig.endDate = String(data.config.end_date).slice(0, 10);
          }
          saveLocalState();
          updateHeaderUI();
          renderAll();
          showToast('已與 Google 試算表完成同步！');
        }
      } catch (err) {
        showToast('同步失敗，請檢查 GAS 網址或網路狀態');
      } finally {
        icon.classList.remove('animate-spin');
      }
    }

    function saveBoardOrderToCloud() {
      handleDragEnd();
      if (!appConfig.gasUrl) {
        showToast('已儲存於本機瀏覽器');
      } else {
        showToast('已將最新排程順序同步至雲端試算表！');
      }
    }

    // ==================== 篩選、設定與響應式切換 ====================
    function setFilterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = btn.textContent.includes(cat)
          ? 'cat-btn active px-2.5 py-1 rounded-full text-xs font-medium bg-ai-indigo text-white'
          : 'cat-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200';
      });
      renderPocketList();
    }

    function setFilterArea(area) {
      currentAreaFilter = area;
      document.querySelectorAll('.area-btn').forEach(btn => {
        const match = (area === '全部' && btn.textContent === '全沖繩') || btn.textContent.includes(area);
        btn.className = match
          ? 'area-btn px-2 py-0.5 rounded bg-slate-200 text-slate-800 font-medium'
          : 'area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100';
      });
      renderPocketList();
    }

    function saveSettings() {
      appConfig.gasUrl = document.getElementById('setting-gas-url').value.trim();
      appConfig.tripTitle = document.getElementById('setting-trip-title').value.trim() || '我的沖繩旅遊規劃';
      appConfig.startDate = document.getElementById('setting-start-date').value;
      appConfig.endDate = document.getElementById('setting-end-date').value;

      saveLocalState();
      updateHeaderUI();
      updateSyncBadge();
      renderAll();
      closeModal('modal-settings');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'update_config',
            config: {
              trip_title: appConfig.tripTitle,
              start_date: appConfig.startDate,
              end_date: appConfig.endDate
            }
          })
        });
        syncFromCloud();
      } else {
        showToast('設定已儲存！');
      }
    }

    function switchMobileTab(tab) {
      if (window.innerWidth >= 1024) return;
      const panels = {
        pocket: document.getElementById('panel-pocket'),
        itinerary: document.getElementById('panel-itinerary'),
        map: document.getElementById('panel-map')
      };
      Object.keys(panels).forEach(k => {
        if (k === tab) {
          panels[k].classList.remove('hidden');
          panels[k].classList.add('flex');
        } else {
          panels[k].classList.add('hidden');
          panels[k].classList.remove('flex');
        }
        const btn = document.getElementById(`tab-${k}`);
        btn.className = k === tab
          ? 'flex-1 py-2.5 text-center border-b-2 border-ai-indigo text-ai-indigo'
          : 'flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500';
      });
      if (tab === 'map' && mapInstance) {
        setTimeout(() => mapInstance.invalidateSize(), 150);
      }
    }

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);
    }

    function registerInlinePWA() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => {
            if (e.request.method !== 'GET') return;
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      }
    }
  </script>
