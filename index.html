<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2B4C7E" />
  <title>沖繩旅圖｜個人卡片式旅遊規劃 PWA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS (流暢支援手機觸控與電腦拖曳) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <!-- Leaflet CSS & JS (互動地圖與實際路網繪製) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 日式極簡「清透韌性」配色
            'washi-bg': '#F6F7F9',
            'washi-card': '#FFFFFF',
            'ai-indigo': '#2B4C7E',
            'ai-slate': '#567EBB',
            'moss-green': '#4A7C59',
            'sand-ochre': '#D98A3C',
            'ink-dark': '#1E293B',
            'ink-muted': '#64748B'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: #F6F7F9;
      color: #1E293B;
    }
    ::-webkit-scrollbar { width: 7px; height: 9px; }
    ::-webkit-scrollbar-track { background: #E2E8F0; border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748B; }
    
    .sortable-ghost { opacity: 0.4; background: #E2E8F0 !important; border: 2px dashed #567EBB !important; }
    .sortable-drag { transform: rotate(2deg); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .resizer-active { background-color: #2B4C7E !important; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none sm:select-auto">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2 flex items-center justify-between shrink-0 z-20 shadow-xs gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-ai-indigo text-white flex items-center justify-center shadow-xs shrink-0">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <div class="min-w-0">
        <h1 id="header-trip-title" class="font-bold text-sm sm:text-base text-ink-dark leading-tight truncate">2027沖繩首發自由行</h1>
        <p id="header-trip-dates" class="text-[11px] text-ink-muted truncate">2027-02-17 ~ 2027-02-22 (6天5夜)</p>
      </div>
    </div>

    <!-- 版面檢視控制列 -->
    <div class="hidden lg:flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200/80">
      <button onclick="toggleLeftPanel()" id="btn-toggle-left"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-ai-indigo shadow-2xs transition"
        title="顯示或隱藏左側口袋名單">
        <i data-lucide="panel-left-close" class="w-3.5 h-3.5"></i>
        <span>隱藏口袋</span>
      </button>
      <button onclick="toggleRightPanel()" id="btn-toggle-right"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-ai-indigo shadow-2xs transition"
        title="顯示或隱藏右側地圖">
        <i data-lucide="panel-right-close" class="w-3.5 h-3.5"></i>
        <span>隱藏地圖</span>
      </button>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <span id="sync-status-badge" class="hidden xl:inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
        <span class="w-2 h-2 rounded-full bg-amber-500" id="sync-dot"></span>
        <span id="sync-text">本機模式</span>
      </span>
      <button onclick="openModal('modal-settings')" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition" title="系統與後端設定">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
      <button onclick="syncFromCloud()" id="btn-sync-cloud" class="flex items-center gap-1.5 bg-ai-indigo hover:bg-slate-800 text-white text-xs sm:text-sm font-medium px-3 py-2 rounded-lg transition shadow-xs">
        <span id="sync-icon-wrap" class="inline-flex items-center">
          <i data-lucide="cloud" class="w-4 h-4"></i>
        </span>
        <span class="hidden sm:inline" id="sync-btn-label">同步資料</span>
      </button>
    </div>
  </header>

  <!-- 手機版分頁切換器 (小螢幕顯示) -->
  <div class="flex lg:hidden bg-white border-b border-slate-200 text-sm font-medium shrink-0">
    <button onclick="switchMobileTab('pocket')" id="tab-pocket" class="flex-1 py-2.5 text-center border-b-2 border-ai-indigo text-ai-indigo">
      口袋名單 (<span id="mobile-pocket-count">0</span>)
    </button>
    <button onclick="switchMobileTab('itinerary')" id="tab-itinerary" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500">
      每日行程看板
    </button>
    <button onclick="switchMobileTab('map')" id="tab-map" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500">
      互動地圖
    </button>
  </div>

  <!-- 主工作區：三欄式可調整佈局 -->
  <main class="flex-1 flex overflow-hidden relative" id="main-workspace">

    <!-- ==================== 左欄：口袋名單與免金鑰快速建卡區 ==================== -->
    <section id="panel-pocket" class="w-full lg:w-[340px] xl:w-[360px] bg-white border-r border-slate-200 flex flex-col shrink-0 h-full transition-all duration-200">
      <!-- 免金鑰快速建卡收件匣 -->
      <div class="p-3 bg-slate-50 border-b border-slate-200 space-y-2 shrink-0">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-ai-indigo flex items-center gap-1">
            <i data-lucide="zap" class="w-3.5 h-3.5"></i> 快速建卡收件匣
          </span>
          <div class="flex items-center gap-1.5">
            <button onclick="openNewCardModal()" class="text-xs bg-white border border-slate-300 text-slate-700 hover:border-ai-indigo hover:text-ai-indigo font-medium flex items-center gap-0.5 px-2 py-0.5 rounded-md shadow-2xs">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 詳細新增
            </button>
            <button onclick="toggleInboxDrawer()" id="btn-toggle-inbox" class="text-slate-400 hover:text-slate-700 p-0.5 rounded" title="收合/展開輸入框">
              <i data-lucide="chevron-up" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div id="inbox-collapsible-body" class="space-y-2">
          <!-- 快速分類與區域預設選單 -->
          <div class="grid grid-cols-2 gap-1.5">
            <select id="quick-category" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 text-slate-700">
              <option value="景點">🏞️ 類別：景點</option>
              <option value="美食">🍜 類別：美食</option>
              <option value="購物">🛍️ 類別：購物</option>
              <option value="住宿">🏨 類別：住宿</option>
              <option value="交通">🚉 類別：交通</option>
            </select>
            <select id="quick-area" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 text-slate-700">
              <option value="那霸市區">📍 區域：那霸市區</option>
              <option value="中部">📍 區域：中部</option>
              <option value="北部">📍 區域：北部</option>
              <option value="南部">📍 區域：南部</option>
            </select>
          </div>

          <!-- 支援 Google Maps 連結或「一行一店」批次輸入 -->
          <textarea id="quick-batch-input" rows="2"
            placeholder="貼上 Google Maps 連結，或一次輸入多行地點（一行一筆，自動抓座標建卡）..." 
            class="w-full text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-ai-indigo resize-none leading-relaxed"></textarea>

          <button onclick="handleQuickBatchAdd()" id="btn-quick-add"
            class="w-full bg-ai-indigo hover:bg-slate-800 text-white text-xs font-medium px-3 py-1.5 rounded-lg flex items-center justify-center gap-1.5 transition shadow-2xs">
            <i data-lucide="map-pin-plus" class="w-3.5 h-3.5"></i>
            <span>批次自動定位並建立卡片</span>
          </button>
        </div>
      </div>

      <!-- 篩選列 -->
      <div class="px-3 py-2 border-b border-slate-100 space-y-1.5 shrink-0">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5"></i>
          <input type="text" id="search-input" oninput="renderAll()" placeholder="搜尋景點、飯店、交通、必買..." 
            class="w-full text-xs bg-slate-100 rounded-lg pl-8 pr-3 py-1.5 focus:outline-none focus:bg-white focus:ring-1 focus:ring-ai-indigo" />
        </div>
        <div class="flex gap-1 overflow-x-auto pb-0.5" id="category-filters">
          <button onclick="setFilterCategory('全部')" class="cat-btn active px-2 py-0.5 rounded-full text-[11px] font-medium bg-ai-indigo text-white shrink-0">全部</button>
          <button onclick="setFilterCategory('景點')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🏞️ 景點</button>
          <button onclick="setFilterCategory('美食')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🍜 美食</button>
          <button onclick="setFilterCategory('購物')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🛍️ 購物</button>
          <button onclick="setFilterCategory('住宿')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🏨 住宿</button>
          <button onclick="setFilterCategory('交通')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🚉 交通</button>
        </div>
        <div class="flex gap-1 overflow-x-auto text-[11px]" id="area-filters">
          <button onclick="setFilterArea('全部')" class="area-btn px-2 py-0.5 rounded bg-slate-200 text-slate-800 font-medium shrink-0">全沖繩</button>
          <button onclick="setFilterArea('那霸市區')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">那霸市區</button>
          <button onclick="setFilterArea('中部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">中部</button>
          <button onclick="setFilterArea('北部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">北部</button>
          <button onclick="setFilterArea('南部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">南部</button>
        </div>
      </div>

      <!-- 口袋名單卡片拖曳區 -->
      <div class="flex-1 overflow-y-auto p-2.5 space-y-2.5 bg-slate-50/50" id="pocket-dropzone" data-day="pocket">
        <!-- 卡片動態渲染於此 -->
      </div>
    </section>

    <!-- ==================== 中欄：每日行程看板 (Kanban) ==================== -->
    <section id="panel-itinerary" class="hidden lg:flex flex-1 min-w-[320px] flex-col bg-washi-bg overflow-hidden h-full">
      <!-- 看板頂部導覽與多日快速切換工具列 -->
      <div class="px-3 py-2 bg-white border-b border-slate-200 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-1 overflow-x-auto py-0.5" id="kanban-day-nav-bar">
          <!-- 動態產生 Day 1 ~ Day N 快速跳轉按鈕 -->
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <!-- 看板卡片密度切換 -->
          <button onclick="toggleBoardCompactMode()" id="btn-board-density"
            class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium flex items-center gap-1 transition"
            title="切換行程卡片為精簡列表或完整圖文模式">
            <i data-lucide="list" class="w-3.5 h-3.5 text-ai-indigo"></i>
            <span>精簡檢視</span>
          </button>

          <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
            <button onclick="scrollKanbanBy(-300)" class="p-1.5 text-slate-600 hover:bg-slate-200 transition" title="向左捲動檢視前幾天">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button onclick="scrollKanbanBy(300)" class="p-1.5 text-slate-600 hover:bg-slate-200 border-l border-slate-200 transition" title="向右捲動檢視後面幾天">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <button onclick="saveBoardOrderToCloud()" class="text-xs bg-moss-green hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg font-medium flex items-center gap-1 transition shadow-xs">
            <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">儲存排程</span>
          </button>
        </div>
      </div>

      <!-- 橫向捲動的多日看板容器 -->
      <div id="days-kanban-container" class="flex-1 flex gap-3 p-3.5 overflow-x-auto overflow-y-hidden items-start scroll-smooth">
        <!-- 每日欄位動態生成 -->
      </div>
    </section>

    <!-- ==================== 可拖曳寬度調整分隔線 (中欄 <-> 右欄) ==================== -->
    <div id="mid-right-resizer"
      class="hidden lg:flex w-2 bg-slate-200/80 hover:bg-ai-slate cursor-col-resize items-center justify-center shrink-0 transition-colors z-20 group"
      title="左右拖曳調整行程看板與地圖寬度比例">
      <div class="w-0.5 h-8 bg-slate-400 group-hover:bg-white rounded-full"></div>
    </div>

    <!-- ==================== 右欄：地理空間互動地圖（含真實路網規劃） ==================== -->
    <section id="panel-map" style="width: 380px;" class="hidden lg:flex w-full bg-white flex-col shrink-0 h-full">
      <!-- 日期選擇與交通方式切換列 -->
      <div class="p-2.5 border-b border-slate-200 bg-slate-50 shrink-0 space-y-2">
        <div class="flex items-center justify-between gap-1.5">
          <select id="map-day-selector" onchange="updateMapMarkers()" class="flex-1 text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5 font-medium text-ink-dark focus:outline-none">
            <option value="all">顯示全部地點總覽</option>
            <option value="pocket">僅顯示口袋名單</option>
          </select>

          <select id="map-travel-mode" onchange="updateMapMarkers()" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5 font-medium text-ai-indigo focus:outline-none" title="選擇路徑規劃交通方式">
            <option value="driving">🚗 自駕路線</option>
            <option value="transit">🚝 大眾運輸</option>
            <option value="walking">🚶 步行路線</option>
          </select>
        </div>

        <!-- 實際路徑距離、預估時間與 Google Maps 導航按鈕 -->
        <div id="map-route-summary" class="hidden items-center justify-between bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[11px]">
          <span id="map-route-metrics" class="text-slate-700 font-medium truncate">計算實際路網中...</span>
          <a id="map-gmaps-dir-link" href="#" target="_blank" class="text-ai-indigo hover:underline font-bold flex items-center gap-0.5 shrink-0 ml-2">
            <span>Google 導航</span>
            <i data-lucide="external-link" class="w-3 h-3"></i>
          </a>
        </div>
      </div>

      <!-- 地圖圖例列 -->
      <div class="px-3 py-1.5 bg-white border-b border-slate-100 flex items-center justify-between text-[11px] text-slate-600 shrink-0">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#10B981;"></span>景點</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#F59E0B;"></span>美食</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#6366F1;"></span>購物</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#7E22CE;"></span>住宿</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#0284C7;"></span>交通</span>
      </div>

      <div id="okinawa-map" class="flex-1 w-full z-10"></div>
    </section>

  </main>

  <!-- ==================== 視窗 1：卡片詳細資訊與編輯 Modal ==================== -->
  <div id="modal-card-detail" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-base text-ink-dark" id="modal-card-title">卡片詳情設定</h3>
        <button onclick="closeModal('modal-card-detail')" class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="card-form" onsubmit="handleSaveCard(event)" class="p-5 overflow-y-auto space-y-3.5 text-sm">
        <input type="hidden" id="field-id" />
        
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-xs font-medium text-slate-600 mb-1">地點 / 店家 / 飯店 / 車站名稱 *</label>
            <input type="text" id="field-name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:border-ai-indigo focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">分類</label>
            <select id="field-category" onchange="toggleMultiDayStayUI()" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="景點">🏞️ 景點</option>
              <option value="美食">🍜 美食</option>
              <option value="購物">🛍️ 購物</option>
              <option value="住宿">🏨 住宿</option>
              <option value="交通">🚉 交通</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">沖繩區域</label>
            <select id="field-area" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="那霸市區">那霸市區</option>
              <option value="中部">中部(浦添/北谷)</option>
              <option value="北部">北部(本部/名護)</option>
              <option value="南部">南部(糸滿/南城)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">預計停留(分)</label>
            <input type="number" id="field-duration" value="60" min="0" step="10" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <div id="single-day-select-wrap">
            <label class="block text-xs font-medium text-slate-600 mb-1">排入日期</label>
            <select id="field-day" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="pocket">📌 口袋名單</option>
            </select>
          </div>
        </div>

        <!-- 住宿連住多日勾選區塊 -->
        <div id="multi-day-stay-box" class="hidden bg-purple-50/70 border border-purple-200 rounded-xl p-3">
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-bold text-purple-900 flex items-center gap-1">
              <i data-lucide="bed-double" class="w-3.5 h-3.5"></i> 住宿入住日期安排（可複選連住多晚）
            </label>
            <button type="button" onclick="selectAllStayDays()" class="text-[11px] text-purple-700 hover:underline font-medium">全選所有天數</button>
          </div>
          <div id="multi-day-checkboxes" class="flex flex-wrap gap-1.5"></div>
          <p class="text-[11px] text-purple-700/80 mt-1.5">未勾選任何日期時，卡片將保留在左側「口袋名單」中。</p>
        </div>

        <div>

    const DEFAULT_SPOTS = [

      {

        category: '美食',
        area: '中部',
        description: '位於港川外人住宅區內的鄉村風水果塔名店，塔皮酥脆、水果新鮮。',
        must_buy: '季節限定水果塔, 招牌檸檬塔, 鐵盒手工餅乾',
        business_hours: '11:30-19:00 (週二公休)',

        parking_info: '店門口有2格停車位，客滿可停外人住宅投幣停車場',
        source_url: '',
        photo_url: 'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=600&q=80',
        status: 'pocket',

    let spots = [];
    let currentCategoryFilter = '全部';
    let currentAreaFilter = '全部';

    // ==================== 初始化啟動 ====================
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();

      lucide.createIcons();

        syncFromCloud();

    function loadLocalState() {
      const savedCfg = localStorage.getItem(STORAGE_KEY_CONFIG);
      if (savedCfg) appConfig = { ...appConfig, ...JSON.parse(savedCfg) };

      const savedSpots = localStorage.getItem(STORAGE_KEY_SPOTS);
      spots = savedSpots ? JSON.parse(savedSpots) : [...DEFAULT_SPOTS];

      updateHeaderUI();
      updateSyncBadge();
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY_SPOTS, JSON.stringify(spots));
      localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(appConfig));
    }

    function updateHeaderUI() {
      document.getElementById('header-trip-title').textContent = appConfig.tripTitle;
      const daysList = getDateRangeArray(appConfig.startDate, appConfig.endDate);
      document.getElementById('header-trip-dates').textContent = 
        `${appConfig.startDate} ~ ${appConfig.endDate} (${daysList.length}天${Math.max(0, daysList.length - 1)}夜)`;

      document.getElementById('setting-gas-url').value = appConfig.gasUrl || '';
      document.getElementById('setting-trip-title').value = appConfig.tripTitle;
      document.getElementById('setting-start-date').value = appConfig.startDate;
      document.getElementById('setting-end-date').value = appConfig.endDate;
    }

    function updateSyncBadge(customText, colorClass) {
      const dot = document.getElementById('sync-dot');
      const text = document.getElementById('sync-text');
      if (customText) {
        dot.className = `w-2 h-2 rounded-full ${colorClass || 'bg-amber-500'}`;
        text.textContent = customText;
        return;
      }
      if (appConfig.gasUrl) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        text.textContent = 'Google 試算表已連線';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
        text.textContent = '本機離線模式';
      }
    }

    function setSyncButtonState(state) {
      const iconWrap = document.getElementById('sync-icon-wrap');
      const label = document.getElementById('sync-btn-label');
      if (!iconWrap) return;

      if (state === 'syncing') {
        iconWrap.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>`;
        if (label) label.textContent = '同步中...';
      } else if (state === 'synced') {
        iconWrap.innerHTML = `<i data-lucide="cloud-check" class="w-4 h-4 text-emerald-300"></i>`;
        if (label) label.textContent = '已同步';
      } else if (state === 'error') {
        iconWrap.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 text-amber-300"></i>`;
        if (label) label.textContent = '重試同步';
      } else {
        iconWrap.innerHTML = `<i data-lucide="cloud" class="w-4 h-4"></i>`;
        if (label) label.textContent = '同步資料';
      }
      lucide.createIcons();
    }

    // ==================== 版面空間調整：收合側欄、拖曳寬度、看板密度切換 ====================
    function toggleLeftPanel() {
      uiState.leftVisible = !uiState.leftVisible;
      const panel = document.getElementById('panel-pocket');
      const btn = document.getElementById('btn-toggle-left');
      if (uiState.leftVisible) {
        panel.classList.remove('lg:hidden');
        panel.classList.add('lg:flex');
        btn.innerHTML = `<i data-lucide="panel-left-close" class="w-3.5 h-3.5"></i><span>隱藏口袋</span>`;
        btn.className = 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-ai-indigo shadow-2xs transition';
      } else {
        panel.classList.remove('lg:flex');
        panel.classList.add('lg:hidden');
        btn.innerHTML = `<i data-lucide="panel-left-open" class="w-3.5 h-3.5"></i><span>展開口袋</span>`;
        btn.className = 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-ai-indigo text-white shadow-2xs transition';
      }
      lucide.createIcons();
      if (mapInstance) setTimeout(() => mapInstance.invalidateSize(), 220);
    }

    function toggleRightPanel() {
      uiState.rightVisible = !uiState.rightVisible;
      const panel = document.getElementById('panel-map');
      const resizer = document.getElementById('mid-right-resizer');
      const btn = document.getElementById('btn-toggle-right');
      if (uiState.rightVisible) {
        panel.classList.remove('lg:hidden');
        panel.classList.add('lg:flex');
        resizer.classList.remove('lg:hidden');
        resizer.classList.add('lg:flex');
        btn.innerHTML = `<i data-lucide="panel-right-close" class="w-3.5 h-3.5"></i><span>隱藏地圖</span>`;
        btn.className = 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-ai-indigo shadow-2xs transition';
        if (mapInstance) setTimeout(() => mapInstance.invalidateSize(), 200);
      } else {
        panel.classList.remove('lg:flex');
        panel.classList.add('lg:hidden');
        resizer.classList.remove('lg:flex');
        resizer.classList.add('lg:hidden');
        btn.innerHTML = `<i data-lucide="panel-right-open" class="w-3.5 h-3.5"></i><span>顯示地圖</span>`;
        btn.className = 'flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-ai-indigo text-white shadow-2xs transition';
      }

    function toggleInboxDrawer() {
      uiState.inboxExpanded = !uiState.inboxExpanded;
      const body = document.getElementById('inbox-collapsible-body');
      const btn = document.getElementById('btn-toggle-inbox');
      if (uiState.inboxExpanded) {
        body.classList.remove('hidden');

      } else {
        body.classList.add('hidden');

    function toggleBoardCompactMode() {
      uiState.boardCompact = !uiState.boardCompact;
      const btn = document.getElementById('btn-board-density');

      }
      renderAll();

    function initResizer() {
      const resizer = document.getElementById('mid-right-resizer');
      const mapPanel = document.getElementById('panel-map');
      const workspace = document.getElementById('main-workspace');
      if (!resizer || !mapPanel) return;

      let isResizing = false;

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('resizer-active');
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const rect = workspace.getBoundingClientRect();
        const newMapWidth = rect.right - e.clientX;
        const minMapWidth = 240;
        const maxMapWidth = rect.width * 0.65;

        if (newMapWidth >= minMapWidth && newMapWidth <= maxMapWidth) {
          uiState.mapWidthPx = newMapWidth;
          mapPanel.style.width = `${newMapWidth}px`;
          if (mapInstance) mapInstance.invalidateSize();
        }
      });

      window.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('resizer-active');
          document.body.style.cursor = '';
          if (mapInstance) mapInstance.invalidateSize();
        }
      });
    }

    function scrollKanbanBy(offsetX) {
      const container = document.getElementById('days-kanban-container');
      if (container) container.scrollBy({ left: offsetX, behavior: 'smooth' });

    function scrollToDayColumn(dateStr) {
      const col = document.getElementById(`day-col-${dateStr}`);
      if (col) {
        col.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });

        setTimeout(() => col.classList.remove('ring-2', 'ring-ai-indigo'), 1200);
      }
    }

    // ==================== 免 AI 金鑰快速批次建卡 ====================
    async function handleQuickBatchAdd() {
      const inputEl = document.getElementById('quick-batch-input');
      const rawText = inputEl.value.trim();
      const category = document.getElementById('quick-category').value;
      const area = document.getElementById('quick-area').value;

      if (!rawText) {
        showToast('請輸入地點名稱（可一次輸入多行）或貼上 Google Maps 連結！');
        return;
      }

      if (!appConfig.gasUrl) {
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        lines.reverse().forEach((line, idx) => {
          const isTransport = /空港|機場|車站|單軌|港口|碼頭|租車/i.test(line);
          const resolvedCat = isTransport ? '交通' : category;
          spots.unshift({
            id: 'spot_' + Date.now() + '_' + idx,
            name: line,
            category: resolvedCat,
            area: area,
            description: '',
            must_buy: '',
            business_hours: resolvedCat === '住宿' ? '15:00入住 / 11:00退房' : '',
            estimated_duration: resolvedCat === '購物' ? 120 : (resolvedCat === '住宿' ? 0 : (resolvedCat === '交通' ? 30 : 60)),
            parking_info: '',
            source_url: line.startsWith('http') ? line : '',
            photo_url: '',
            status: 'pocket',
            assigned_day: 'pocket',
            sort_order: 1,
            lat: /^那霸(空港|機場)/.test(line) ? 26.2064 : 26.2124,
            lng: /^那霸(空港|機場)/.test(line) ? 127.6522 : 127.6809
          });
        });
        saveLocalState();
        renderAll();
        inputEl.value = '';
        showToast(`✅ 已於本機建立 ${lines.length} 張卡片！`);
        return;
      }

      const btn = document.getElementById('btn-quick-add');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span>自動定位建卡中...</span>`;
      lucide.createIcons();

      try {
        const res = await fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'quick_batch_add',
            input: rawText,
            category: category,
            area: area
          })
        });
        const data = await res.json();
        if (data.status === 'success' && data.spots && data.spots.length > 0) {
          data.spots.reverse().forEach(s => spots.unshift(s));
          saveLocalState();
          renderAll();
          inputEl.value = '';
          const names = data.spots.map(s => s.name).join('、');
          showToast(`✅ 已自動定位並建立 ${data.spots.length} 張卡片：${names}`);
        } else {
          throw new Error(data.message || '建卡失敗');
        }
      } catch (err) {
        showToast('⚠️ 建卡失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="map-pin-plus" class="w-3.5 h-3.5"></i> <span>批次自動定位並建立卡片</span>`;
        lucide.createIcons();
      }
    }

    // ==================== 日期計算與多日住宿解析工具 ====================
    function getDateRangeArray(startStr, endStr) {
      const list = [];
      let curr = new Date(startStr + 'T00:00:00');
      const end = new Date(endStr + 'T00:00:00');
      const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
      let idx = 1;
      while (curr <= end && idx <= 14) {
        const yyyy = curr.getFullYear();
        const mm = String(curr.getMonth() + 1).padStart(2, '0');
        const dd = String(curr.getDate()).padStart(2, '0');
        list.push({
          dateStr: `${yyyy}-${mm}-${dd}`,
          label: `Day ${idx}`,
          shortDate: `${mm}/${dd} (週${weekNames[curr.getDay()]})`
        });
        curr.setDate(curr.getDate() + 1);
        idx++;
      }
      return list;
    }

    function getSpotAssignedDays(spot) {
      const raw = String(spot.assigned_day || 'pocket').trim();
      if (!raw || raw === 'pocket') return [];
      return raw.split(',').map(d => d.trim()).filter(Boolean);
    }

    // ==================== 畫面渲染核心 ====================
    function renderAll() {
      const daysList = getDateRangeArray(appConfig.startDate, appConfig.endDate);
      renderPocketList();
      renderKanbanDayNavBar(daysList);
      renderKanbanDays(daysList);
      populateDaySelectors(daysList);
      initSortableDragAndDrop();
      updateMapMarkers();
      lucide.createIcons();
    }

    function renderKanbanDayNavBar(daysList) {
      const navBar = document.getElementById('kanban-day-nav-bar');
      if (!navBar) return;
      navBar.innerHTML = daysList.map(d => {
        const count = spots.filter(s => getSpotAssignedDays(s).includes(d.dateStr)).length;
        return `
          <button onclick="scrollToDayColumn('${d.dateStr}')"
            class="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 hover:bg-ai-indigo hover:text-white text-slate-700 transition shrink-0 flex items-center gap-1">
            <span>${d.label}</span>
            <span class="text-[10px] opacity-75">${d.shortDate.split(' ')[0]}</span>
            ${count > 0 ? `<span class="w-4 h-4 rounded-full bg-ai-indigo/15 text-ai-indigo text-[10px] font-bold flex items-center justify-center">${count}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function renderPocketList() {
      const container = document.getElementById('pocket-dropzone');
      const keyword = document.getElementById('search-input').value.trim().toLowerCase();

      const pocketSpots = spots
        .filter(s => getSpotAssignedDays(s).length === 0)
        .filter(s => currentCategoryFilter === '全部' || s.category === currentCategoryFilter)
        .filter(s => currentAreaFilter === '全部' || s.area === currentAreaFilter)
        .filter(s => !keyword || 
          (s.name && s.name.toLowerCase().includes(keyword)) ||
          (s.must_buy && s.must_buy.toLowerCase().includes(keyword)) ||
          (s.description && s.description.toLowerCase().includes(keyword))
        )
        .sort((a, b) => (a.sort_order || 99) - (b.sort_order || 99));

      document.getElementById('mobile-pocket-count').textContent = pocketSpots.length;

      if (pocketSpots.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 px-4 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-xs">
            <p class="mb-1 font-medium">目前沒有符合條件的口袋卡片</p>
            <p>上方輸入地點或 Google Maps 連結即可自動建卡！</p>
          </div>`;
        return;
      }

      container.innerHTML = pocketSpots.map(spot => buildCardHTML(spot, false, null, null)).join('');
    }

    function renderKanbanDays(daysList) {
      const container = document.getElementById('days-kanban-container');
      container.innerHTML = daysList.map((day, dayIdx) => {
        const daySpots = spots
          .filter(s => getSpotAssignedDays(s).includes(day.dateStr))
          .sort((a, b) => (a.sort_order || 99) - (b.sort_order || 99));

        // 僅加總遊玩/用餐/購物活動時間（排除住宿與純交通過境時間）
        const totalMins = daySpots
          .filter(s => s.category !== '住宿' && s.category !== '交通')
          .reduce((sum, s) => sum + (Number(s.estimated_duration) || 60), 0);
        const hoursText = (totalMins / 60).toFixed(1).replace('.0', '');
        const nextDayObj = daysList[dayIdx + 1] || null;

        return `
          <div id="day-col-${day.dateStr}" class="w-[265px] sm:w-[280px] bg-slate-100/90 rounded-2xl border border-slate-200/80 flex flex-col max-h-full shrink-0 transition-shadow">
            <div class="px-3 py-2 border-b border-slate-200 bg-white rounded-t-2xl flex items-center justify-between">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-sm text-ai-indigo">${day.label}</span>
                  <span class="text-xs font-medium text-slate-600">${day.shortDate}</span>
                </div>
                <p class="text-[11px] text-slate-400 mt-0.5">共 ${daySpots.length} 項 · 活動約 ${hoursText} 小時</p>
              </div>
              <button onclick="focusMapOnDay('${day.dateStr}')" class="p-1.5 text-slate-400 hover:text-ai-indigo hover:bg-slate-100 rounded-lg" title="在地圖上檢視此日實際路線">
                <i data-lucide="map" class="w-4 h-4"></i>
              </button>
            </div>
            
            <div class="p-2 flex-1 overflow-y-auto space-y-2 min-h-[180px] day-dropzone" data-day="${day.dateStr}">
              ${daySpots.length > 0 
                ? daySpots.map((s, idx) => buildCardHTML(s, true, idx + 1, { currentDay: day.dateStr, nextDay: nextDayObj })).join('') 
                : `<div class="h-28 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-center text-xs text-slate-400 pointer-events-none">拖曳卡片或飯店至此排程</div>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function buildCardHTML(spot, isScheduled, orderNum, dayContext) {
      const isHotel = spot.category === '住宿';
      const isTransport = spot.category === '交通';
      const theme = CATEGORY_THEME[spot.category] || { hex: '#64748B', badge: 'bg-slate-100 text-slate-700', borderLeft: 'border-l-slate-400' };

      const canExtendNextNight = isHotel && isScheduled && dayContext && dayContext.nextDay &&
        !getSpotAssignedDays(spot).includes(dayContext.nextDay.dateStr);

      // ==================== 中間看板「精簡模式」卡片 ====================
      if (isScheduled && uiState.boardCompact) {
        return `
          <div class="spot-card bg-white rounded-xl border border-slate-200/95 border-l-4 ${theme.borderLeft} shadow-2xs hover:shadow-md transition cursor-grab active:cursor-grabbing px-2.5 py-2 group"
               data-id="${spot.id}" onclick="openEditCardModal('${spot.id}')">

              <div class="flex items-center gap-1.5 min-w-0">
                <span style="background-color: ${theme.hex};"
                  class="w-5 h-5 rounded-full text-white text-[11px] font-bold flex items-center justify-center shrink-0 shadow-2xs">
                  ${isHotel ? '宿' : (isTransport ? '行' : orderNum)}
                </span>
                <h4 class="font-bold text-xs text-ink-dark truncate" title="${spot.name}">${spot.name}</h4>
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded border font-medium shrink-0 ${theme.badge}">${spot.category}</span>
            </div>

            <div class="flex items-center justify-between text-[11px] text-slate-400 mt-1.5 pl-6">
              <span class="truncate">
                ${isHotel 
                  ? `<span class="text-purple-700 font-medium">連住 ${getSpotAssignedDays(spot).length} 晚</span> · ${spot.area}`
                  : (isTransport 
                      ? `<span class="text-sky-700 font-medium">交通節點</span> · ${spot.area}`
                      : `${spot.area} · ${spot.estimated_duration || 60}分`)
                }
                ${spot.must_buy ? ` · <span class="text-slate-600">${spot.must_buy.split(',')[0]}</span>` : ''}

              <button type="button" onclick="event.stopPropagation(); focusMapOnSpot('${spot.id}')" class="text-slate-400 hover:text-ai-indigo shrink-0 ml-1" title="在地圖定位">

              <div class="mt-1.5 pl-6">

                  class="w-full py-0.5 px-2 rounded bg-purple-50 hover:bg-purple-600 text-purple-700 hover:text-white border border-purple-200 text-[10px] font-medium flex items-center justify-center gap-1 transition">
                  <i data-lucide="calendar-plus" class="w-3 h-3"></i> 延續至 ${dayContext.nextDay.label}
                </button>

          </div>

      // ==================== 左側口袋名單 或 看板「完整圖文模式」卡片 ====================
      const cardBorder = isHotel && isScheduled
        ? 'border-purple-300 bg-purple-50/30'
        : 'border-slate-200/90 bg-white';

      return `
        <div class="spot-card ${cardBorder} rounded-xl border shadow-2xs hover:shadow-md transition cursor-grab active:cursor-grabbing overflow-hidden group"
             data-id="${spot.id}" onclick="openEditCardModal('${spot.id}')">
          ${spot.photo_url ? `
            <div class="w-full bg-slate-200 overflow-hidden relative" style="height: 84px;">
              <img src="${spot.photo_url}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.parentElement.style.display='none'"/>
              <span class="absolute top-1.5 left-1.5 text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/90 text-slate-700 shadow-2xs">${spot.area}</span>
              ${isHotel ? `<span class="absolute top-1.5 right-1.5 text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-700 text-white shadow-2xs">🏨 住宿</span>` : ''}
            </div>
          ` : ''}
          <div class="p-2.5">
            <div class="flex items-start justify-between gap-1.5 mb-1">
              <div class="flex items-center gap-1.5">
                ${isScheduled ? `<span style="background-color: ${theme.hex};" class="w-5 h-5 rounded-full text-white text-[11px] font-bold flex items-center justify-center shrink-0">${isHotel ? '宿' : (isTransport ? '行' : orderNum)}</span>` : ''}
                <h4 class="font-bold text-xs sm:text-sm text-ink-dark leading-snug">${spot.name}</h4>
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded-md border font-medium shrink-0 ${theme.badge}">${spot.category}</span>

            ${spot.must_buy ? `
              <div class="${isHotel ? 'bg-purple-100/60 border-purple-200 text-purple-950' : (isTransport ? 'bg-sky-50 border-sky-200 text-sky-900' : 'bg-amber-50/70 border-amber-100 text-amber-900')} border rounded-lg px-2 py-1 mb-1.5 text-[11px]">

                <button type="button" onclick="event.stopPropagation(); extendHotelToDay('${spot.id}', '${dayContext.nextDay.dateStr}', '${dayContext.nextDay.label}')"

                  <i data-lucide="calendar-plus" class="w-3 h-3"></i> 連住延續至 ${dayContext.nextDay.label}

              <span class="flex items-center gap-1">
                ${isHotel 
                  ? `<i data-lucide="bed-double" class="w-3 h-3 text-purple-600"></i> <span class="text-purple-700 font-medium">已排 ${getSpotAssignedDays(spot).length} 晚</span>` 
                  : (isTransport
                      ? `<i data-lucide="train" class="w-3 h-3 text-sky-600"></i> <span class="text-sky-700 font-medium">交通節點</span>`
                      : `<i data-lucide="clock" class="w-3 h-3"></i> ${spot.estimated_duration || 60}分`)
                }
                ${!spot.photo_url ? `· ${spot.area}` : ''}
              </span>
              <div class="flex items-center gap-1.5">
                ${spot.business_hours ? `<span title="${spot.business_hours}" class="text-slate-500 truncate max-w-[105px]">⏰ ${spot.business_hours}</span>` : ''}
                <button type="button" onclick="event.stopPropagation(); focusMapOnSpot('${spot.id}')" class="text-ai-slate hover:text-ai-indigo" title="在地圖定位">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function extendHotelToDay(spotId, nextDateStr, nextDayLabel) {
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;
      const days = getSpotAssignedDays(spot);
      if (!days.includes(nextDateStr)) {
        days.push(nextDateStr);
        days.sort();
        spot.assigned_day = days.join(',');
        spot.status = 'scheduled';
        saveLocalState();
        renderAll();
        scrollToDayColumn(nextDateStr);
        showToast(`🏨 已將「${spot.name}」連住排入 ${nextDayLabel}！`);

        if (appConfig.gasUrl) {
          fetch(appConfig.gasUrl, {
            method: 'POST',
            body: JSON.stringify({
              action: 'sync_board',
              updates: [{ id: spot.id, assigned_day: spot.assigned_day, sort_order: spot.sort_order || 99 }]
            })
          }).catch(err => console.error('背景同步失敗', err));
        }
      }
    }

    // ==================== 拖曳排序互動 (SortableJS) ====================
    function initSortableDragAndDrop() {
      const pocketEl = document.getElementById('pocket-dropzone');
      if (pocketEl) {
        new Sortable(pocketEl, {
          group: 'okinawa-cards',
          animation: 180,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag',
          onEnd: handleDragEnd
        });
      }

      document.querySelectorAll('.day-dropzone').forEach(zone => {
        new Sortable(zone, {
          group: 'okinawa-cards',
          animation: 180,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag',
          onEnd: handleDragEnd
        });
      });
    }

    function handleDragEnd() {
      const cardDaysMap = {};
      const cardOrderMap = {};
      spots.forEach(s => { cardDaysMap[s.id] = []; });

      document.querySelectorAll('#pocket-dropzone .spot-card').forEach((card, idx) => {
        const id = card.dataset.id;
        cardOrderMap[id] = idx + 1;
      });

      document.querySelectorAll('.day-dropzone').forEach(zone => {
        const dayStr = zone.dataset.day;
        zone.querySelectorAll('.spot-card').forEach((card, idx) => {
          const id = card.dataset.id;
          if (!cardDaysMap[id]) cardDaysMap[id] = [];
          if (!cardDaysMap[id].includes(dayStr)) {
            cardDaysMap[id].push(dayStr);
          }
          cardOrderMap[id] = idx + 1;
        });
      });

      const updates = [];
      spots.forEach(spot => {
        const days = cardDaysMap[spot.id] || [];
        const newAssigned = days.length > 0 ? days.sort().join(',') : 'pocket';
        const newOrder = cardOrderMap[spot.id] || spot.sort_order || 99;
        spot.assigned_day = newAssigned;
        spot.status = newAssigned === 'pocket' ? 'pocket' : 'scheduled';
        spot.sort_order = newOrder;
        updates.push({ id: spot.id, assigned_day: newAssigned, sort_order: newOrder });
      });

      saveLocalState();
      renderAll();
      showToast('行程已更新！');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'sync_board', updates })
        }).catch(err => console.error('背景同步失敗', err));
      }
    }

    // ==================== 地圖模組（OSRM 真實路網規劃 + Google Maps 多點轉乘連動） ====================
    function initMap() {
      mapInstance = L.map('okinawa-map').setView([26.35, 127.78], 10);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(mapInstance);
      mapLayerGroup = L.layerGroup().addTo(mapInstance);
    }

    function populateDaySelectors(daysList) {
      const mapSel = document.getElementById('map-day-selector');
      const currentVal = mapSel.value;
      mapSel.innerHTML = `
        <option value="all">顯示全部地點總覽</option>
        <option value="pocket">僅顯示口袋名單</option>
        ${daysList.map(d => `<option value="${d.dateStr}">${d.label} (${d.shortDate}) 路線</option>`).join('')}
      `;
      if ([...mapSel.options].some(o => o.value === currentVal)) {
        mapSel.value = currentVal;
      }

      const formDaySel = document.getElementById('field-day');
      formDaySel.innerHTML = `
        <option value="pocket">📌 口袋名單</option>
        ${daysList.map(d => `<option value="${d.dateStr}">${d.label} (${d.shortDate})</option>`).join('')}
      `;

      const multiBox = document.getElementById('multi-day-checkboxes');
      multiBox.innerHTML = daysList.map(d => `
        <label class="cursor-pointer inline-flex items-center gap-1.5 bg-white border border-purple-200 hover:border-purple-400 px-2.5 py-1 rounded-lg text-xs text-slate-700 select-none">
          <input type="checkbox" name="stay_days" value="${d.dateStr}" class="accent-purple-700 rounded" />
          <span>${d.label} (${d.shortDate.split(' ')[0]})</span>
        </label>
      `).join('');
    }

    async function updateMapMarkers() {
      if (!mapInstance || !mapLayerGroup) return;
      mapLayerGroup.clearLayers();

      const filterDay = document.getElementById('map-day-selector').value;
      const travelMode = document.getElementById('map-travel-mode').value;
      const summaryBox = document.getElementById('map-route-summary');
      const metricsEl = document.getElementById('map-route-metrics');
      const gmapsLinkEl = document.getElementById('map-gmaps-dir-link');

      let filtered = spots.filter(s => s.lat && s.lng);

      if (filterDay === 'pocket') {
        filtered = filtered.filter(s => getSpotAssignedDays(s).length === 0);
      } else if (filterDay !== 'all') {
        filtered = filtered
          .filter(s => getSpotAssignedDays(s).includes(filterDay))
          .sort((a, b) => (a.sort_order || 99) - (b.sort_order || 99));
      }

      const latLngs = [];
      filtered.forEach((spot, index) => {
        const lat = parseFloat(spot.lat);
        const lng = parseFloat(spot.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        latLngs.push([lat, lng]);
        const isDayRoute = filterDay !== 'all' && filterDay !== 'pocket';
        const isHotel = spot.category === '住宿';
        const isTransport = spot.category === '交通';
        const theme = CATEGORY_THEME[spot.category] || { hex: '#2B4C7E' };

        let markerHtml = '';
        if (isHotel) {
          markerHtml = `<div style="background:${theme.hex};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);">宿</div>`;
        } else if (isTransport) {
          markerHtml = `<div style="background:${theme.hex};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);">行</div>`;
        } else if (isDayRoute) {
          markerHtml = `<div style="background:${theme.hex};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);">${index + 1}</div>`;
        } else {
          markerHtml = `<div style="background:${theme.hex};width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>`;
        }

        const customIcon = L.divIcon({ html: markerHtml, className: '', iconSize: [26, 26], iconAnchor: [13, 13] });
        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(mapLayerGroup);
        marker.bindPopup(`
          <div class="text-xs">
            <strong class="text-sm text-slate-800">${spot.name}</strong><br/>
            <span style="color:${theme.hex};font-weight:bold;">● ${spot.category}</span> · <span class="text-slate-500">${spot.area}</span><br/>
            ${spot.must_buy ? `<span class="text-slate-700">${isHotel ? '備註' : '重點'}：${spot.must_buy}</span>` : ''}
          </div>
        `);
      });

      // 若選取單日行程且有 2 個以上地點，呼叫 OSRM 計算實際道路/步行路線並產生 Google Maps 導航網址
      if (filterDay !== 'all' && filterDay !== 'pocket' && latLngs.length > 1) {
        summaryBox.classList.remove('hidden');
        summaryBox.classList.add('flex');
        metricsEl.textContent = '正在計算實際道路路線...';

        // 組合 Google Maps 外部多點路線網址（支援 driving / transit / walking）
        const originCoord = `${latLngs[0][0]},${latLngs[0][1]}`;
        const destCoord = `${latLngs[latLngs.length - 1][0]},${latLngs[latLngs.length - 1][1]}`;
        const waypointCoords = latLngs.slice(1, -1).map(p => `${p[0]},${p[1]}`).join('|');
        const gmapsParams = new URLSearchParams({
          api: '1',
          origin: originCoord,
          destination: destCoord,
          travelmode: travelMode
        });
        if (waypointCoords) gmapsParams.set('waypoints', waypointCoords);
        gmapsLinkEl.href = `https://www.google.com/maps/dir/?${gmapsParams.toString()}`;

        const currentToken = ++routeRequestToken;
        const osrmProfile = travelMode === 'walking' ? 'foot' : 'driving';
        const coordString = latLngs.map(p => `${p[1]},${p[0]}`).join(';');
        const osrmUrl = `https://router.project-osrm.org/route/v1/${osrmProfile}/${coordString}?overview=full&geometries=geojson`;

        try {
          const resp = await fetch(osrmUrl);
          if (currentToken !== routeRequestToken) return;
          const routeData = await resp.json();

          if (routeData.code === 'Ok' && routeData.routes && routeData.routes.length > 0) {
            const bestRoute = routeData.routes[0];
            const routeCoords = bestRoute.geometry.coordinates.map(c => [c[1], c[0]]);
            const distKm = (bestRoute.distance / 1000).toFixed(1);
            const durMins = Math.max(1, Math.round(bestRoute.duration / 60));

            const lineColor = travelMode === 'walking' ? '#059669' : (travelMode === 'transit' ? '#0284C7' : '#2B4C7E');
            const dashPattern = travelMode === 'walking' ? '4, 6' : (travelMode === 'transit' ? '8, 6' : null);

            const routePolyline = L.polyline(routeCoords, {
              color: lineColor,
              weight: 4.5,
              opacity: 0.85,
              dashArray: dashPattern
            }).addTo(mapLayerGroup);

            if (travelMode === 'transit') {
              metricsEl.textContent = `🚝 沿線距離 ${distKm} km（點擊右側查單軌/公車轉乘）`;
            } else if (travelMode === 'walking') {
              metricsEl.textContent = `🚶 步行路網：約 ${distKm} km · 約 ${durMins} 分`;
            } else {
              metricsEl.textContent = `🚗 實際車程：約 ${distKm} km · 預估 ${durMins} 分`;
            }

            mapInstance.fitBounds(routePolyline.getBounds(), { padding: [40, 40], maxZoom: 15 });
            return;
          }
        } catch (err) {
          console.warn('OSRM 路網計算失敗，改以示意連線顯示:', err);
        }

        // 備援示意線
        L.polyline(latLngs, { color: '#64748B', weight: 3, dashArray: '6, 8', opacity: 0.75 }).addTo(mapLayerGroup);
        metricsEl.textContent = '已顯示景點位置（點擊右側開啟 Google 路線）';
      } else {
        summaryBox.classList.add('hidden');
        summaryBox.classList.remove('flex');
      }

      if (latLngs.length > 0) {
        mapInstance.fitBounds(L.latLngBounds(latLngs), { padding: [40, 40], maxZoom: 14 });
      }
    }

    function focusMapOnSpot(id) {
      const spot = spots.find(s => s.id === id);
      if (!spot || !spot.lat || !spot.lng) return;
      if (window.innerWidth >= 1024 && !uiState.rightVisible) {
        toggleRightPanel();
      }
      switchMobileTab('map');
      setTimeout(() => {
        mapInstance.invalidateSize();
        mapInstance.setView([spot.lat, spot.lng], 15);
      }, 180);
    }

    function focusMapOnDay(dateStr) {
      if (window.innerWidth >= 1024 && !uiState.rightVisible) {
        toggleRightPanel();
      }
      document.getElementById('map-day-selector').value = dateStr;
      updateMapMarkers();
      switchMobileTab('map');
    }

    // ==================== Modal 表單與 CRUD 操作 ====================
    function toggleMultiDayStayUI() {
      const cat = document.getElementById('field-category').value;
      const multiBox = document.getElementById('multi-day-stay-box');
      const singleWrap = document.getElementById('single-day-select-wrap');
      if (cat === '住宿') {
        multiBox.classList.remove('hidden');
        singleWrap.classList.add('opacity-40', 'pointer-events-none');
      } else {
        multiBox.classList.add('hidden');
        singleWrap.classList.remove('opacity-40', 'pointer-events-none');
      }
    }

    function selectAllStayDays() {
      document.querySelectorAll('input[name="stay_days"]').forEach(cb => { cb.checked = true; });
    }

    function openNewCardModal(prefillText = '') {
      document.getElementById('modal-card-title').textContent = '新增沖繩地點 / 飯店 / 交通卡片';
      document.getElementById('card-form').reset();
      document.getElementById('field-id').value = '';
      document.getElementById('field-name').value = prefillText.startsWith('http') ? '' : prefillText;
      document.getElementById('field-source-url').value = prefillText.startsWith('http') ? prefillText : '';
      document.querySelectorAll('input[name="stay_days"]').forEach(cb => { cb.checked = false; });
      toggleMultiDayStayUI();
      document.getElementById('btn-delete-card').classList.add('hidden');
      document.getElementById('btn-google-nav').classList.add('hidden');
      openModal('modal-card-detail');
    }

    function openEditCardModal(id) {
      const spot = spots.find(s => s.id === id);
      if (!spot) return;

      document.getElementById('modal-card-title').textContent = '編輯卡片詳情';
      document.getElementById('field-id').value = spot.id;
      document.getElementById('field-name').value = spot.name || '';
      document.getElementById('field-category').value = spot.category || '景點';
      document.getElementById('field-area').value = spot.area || '那霸市區';
      document.getElementById('field-duration').value = spot.estimated_duration !== undefined ? spot.estimated_duration : 60;

      const assignedDays = getSpotAssignedDays(spot);
      document.getElementById('field-day').value = assignedDays.length > 0 ? assignedDays[0] : 'pocket';
      document.querySelectorAll('input[name="stay_days"]').forEach(cb => {
        cb.checked = assignedDays.includes(cb.value);
      });
      toggleMultiDayStayUI();

      document.getElementById('field-description').value = spot.description || '';
      document.getElementById('field-must-buy').value = spot.must_buy || '';
      document.getElementById('field-hours').value = spot.business_hours || '';
      document.getElementById('field-parking').value = spot.parking_info || '';
      document.getElementById('field-source-url').value = spot.source_url || '';
      document.getElementById('field-photo-url').value = spot.photo_url || '';
      document.getElementById('field-lat').value = spot.lat || '';
      document.getElementById('field-lng').value = spot.lng || '';

      document.getElementById('btn-delete-card').classList.remove('hidden');
      const navBtn = document.getElementById('btn-google-nav');
      navBtn.classList.remove('hidden');
      navBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('沖繩 ' + spot.name)}`;

      openModal('modal-card-detail');
    }

    async function handleSaveCard(e) {
      e.preventDefault();
      const id = document.getElementById('field-id').value;
      const category = document.getElementById('field-category').value;

      let assignedDay = 'pocket';
      if (category === '住宿') {
        const checkedDays = [...document.querySelectorAll('input[name="stay_days"]:checked')].map(cb => cb.value);
        assignedDay = checkedDays.length > 0 ? checkedDays.sort().join(',') : 'pocket';
      } else {
        assignedDay = document.getElementById('field-day').value;
      }

      const cardObj = {
        id: id || ('spot_' + Date.now()),
        name: document.getElementById('field-name').value.trim(),
        category: category,
        area: document.getElementById('field-area').value,
        estimated_duration: Number(document.getElementById('field-duration').value) || 0,
        assigned_day: assignedDay,
        status: assignedDay === 'pocket' ? 'pocket' : 'scheduled',
        description: document.getElementById('field-description').value.trim(),
        must_buy: document.getElementById('field-must-buy').value.trim(),
        business_hours: document.getElementById('field-hours').value.trim(),
        parking_info: document.getElementById('field-parking').value.trim(),
        source_url: document.getElementById('field-source-url').value.trim(),
        photo_url: document.getElementById('field-photo-url').value.trim(),
        lat: document.getElementById('field-lat').value.trim(),
        lng: document.getElementById('field-lng').value.trim()
      };

      if (id) {
        const idx = spots.findIndex(s => s.id === id);
        if (idx > -1) spots[idx] = { ...spots[idx], ...cardObj };
      } else {
        cardObj.sort_order = 99;
        spots.unshift(cardObj);
      }

      saveLocalState();
      renderAll();
      closeModal('modal-card-detail');
      showToast('卡片已儲存！');

      if (appConfig.gasUrl) {
        try {
          const res = await fetch(appConfig.gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: id ? 'update_spot' : 'add_spot', spot: cardObj })
          });
          const data = await res.json();
          if (data.status === 'success' && data.spot) {
            const idx = spots.findIndex(s => s.id === data.spot.id);
            if (idx > -1) spots[idx] = data.spot;
            saveLocalState();
            renderAll();
          }
        } catch (err) {
          console.error('同步失敗', err);
        }
      }
    }

    async function handleDeleteCard() {
      const id = document.getElementById('field-id').value;
      if (!id || !confirm('確定要刪除這張卡片嗎？')) return;

      spots = spots.filter(s => s.id !== id);
      saveLocalState();
      renderAll();
      closeModal('modal-card-detail');
      showToast('卡片已刪除');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete_spot', id })
        });
      }
    }

    // ==================== 雲端雙向同步 ====================
    async function syncFromCloud() {
      if (!appConfig.gasUrl) {
        openModal('modal-settings');
        showToast('請先設定 Google Apps Script 網址');
        return;
      }

      const btn = document.getElementById('btn-sync-cloud');
      btn.disabled = true;
      setSyncButtonState('syncing');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const res = await fetch(appConfig.gasUrl, {
          method: 'GET',
          redirect: 'follow',
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const contentType = res.headers.get('content-type') || '';
        const rawText = await res.text();

        if (!contentType.includes('application/json') && rawText.trim().startsWith('<')) {
          throw new Error('GAS 回傳了網頁而非 JSON，請確認部署權限「誰可以存取」已設為「所有人 (Anyone)」。');
        }

        const data = JSON.parse(rawText);
        if (data.status === 'success') {
          spots = data.spots || [];
          if (data.config) {
            if (data.config.trip_title) appConfig.tripTitle = data.config.trip_title;
            if (data.config.start_date) appConfig.startDate = String(data.config.start_date).slice(0, 10);
            if (data.config.end_date) appConfig.endDate = String(data.config.end_date).slice(0, 10);
          }
          saveLocalState();
          updateHeaderUI();
          updateSyncBadge('Google 試算表已連線', 'bg-emerald-500');
          renderAll();
          setSyncButtonState('synced');
          showToast(`✅ 同步完成！共載入 ${spots.length} 張卡片`);
        } else {
          throw new Error(data.message || '後端回傳錯誤');
        }
      } catch (err) {
        clearTimeout(timeoutId);
        updateSyncBadge('連線異常 (點擊重試)', 'bg-red-500');
        setSyncButtonState('error');
        const errMsg = err.name === 'AbortError'
          ? '連線逾時（超過15秒），請檢查網路或 GAS 部署狀態。'
          : err.message;
        showToast('⚠️ ' + errMsg);
        console.error('Sync Error:', err);
      } finally {
        btn.disabled = false;
      }
    }

    function saveBoardOrderToCloud() {
      handleDragEnd();
      if (!appConfig.gasUrl) {
        showToast('已儲存於本機瀏覽器');
      } else {
        setSyncButtonState('synced');
        showToast('已將最新排程順序同步至雲端試算表！');
      }
    }

    // ==================== 篩選、設定與響應式切換 ====================
    function setFilterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = btn.textContent.includes(cat)
          ? 'cat-btn active px-2 py-0.5 rounded-full text-[11px] font-medium bg-ai-indigo text-white shrink-0'
          : 'cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0';
      });
      renderPocketList();
    }

    function setFilterArea(area) {
      currentAreaFilter = area;
      document.querySelectorAll('.area-btn').forEach(btn => {
        const match = (area === '全部' && btn.textContent === '全沖繩') || btn.textContent.includes(area);
        btn.className = match
          ? 'area-btn px-2 py-0.5 rounded bg-slate-200 text-slate-800 font-medium shrink-0'
          : 'area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0';
      });
      renderPocketList();
    }

    function saveSettings() {
      appConfig.gasUrl = document.getElementById('setting-gas-url').value.trim();
      appConfig.tripTitle = document.getElementById('setting-trip-title').value.trim() || '2027沖繩首發自由行';
      appConfig.startDate = document.getElementById('setting-start-date').value;
      appConfig.endDate = document.getElementById('setting-end-date').value;

      saveLocalState();
      updateHeaderUI();
      updateSyncBadge();
      renderAll();
      closeModal('modal-settings');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'update_config',
            config: {
              trip_title: appConfig.tripTitle,
              start_date: appConfig.startDate,
              end_date: appConfig.endDate
            }
          })
        });
        syncFromCloud();
      } else {
        showToast('設定已儲存！');
      }
    }

    function switchMobileTab(tab) {
      if (window.innerWidth >= 1024) return;
      const panels = {
        pocket: document.getElementById('panel-pocket'),
        itinerary: document.getElementById('panel-itinerary'),
        map: document.getElementById('panel-map')
      };
      Object.keys(panels).forEach(k => {
        if (k === tab) {
          panels[k].classList.remove('hidden');
          panels[k].classList.add('flex');
        } else {
          panels[k].classList.add('hidden');
          panels[k].classList.remove('flex');
        }
        const btn = document.getElementById(`tab-${k}`);
        btn.className = k === tab
          ? 'flex-1 py-2.5 text-center border-b-2 border-ai-indigo text-ai-indigo'
          : 'flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500';
      });
      if (tab === 'map' && mapInstance) {
        setTimeout(() => mapInstance.invalidateSize(), 150);
      }
    }

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 4000);
    }

    function registerInlinePWA() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => {
            if (e.request.method !== 'GET') return;
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      }
    }
  </script>
