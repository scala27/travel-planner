<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沖繩卡片式旅遊規劃系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f3f6fa;
      color: #1e293b;
      overflow: hidden;
    }
    /* 自訂捲軸 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* 新增卡片高亮動畫 */
    @keyframes pulseBorder {
      0%, 100% { box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.55), 0 8px 20px -4px rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25), 0 8px 20px -4px rgba(245, 158, 11, 0.15); }
    }
    .card-is-new {
      border-color: #f59e0b !important;
      animation: pulseBorder 2.5s infinite;
    }
    .card-is-highlighted {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35) !important;
      transform: translateY(-2px);
    }
    .dragging {
      opacity: 0.45;
      transform: scale(0.98);
    }
    .drop-zone-active {
      background-color: #eff6ff !important;
      border: 2px dashed #3b82f6 !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 2px;
    }
  </style>
</head>
<body class="h-screen flex flex-col select-none">

  <!-- ==================== 頂部導覽列 ==================== -->
  <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between shrink-0 z-30 shadow-xs">
    <!-- 左側：標題與行程日期 -->
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-xs">
        <i class="fa-solid fa-globe text-base"></i>
      </div>
      <div class="truncate">
        <div class="flex items-center gap-2">
          <h1 id="tripTitleDisplay" class="font-bold text-base text-slate-800 truncate">2027沖繩首發自由行</h1>
        </div>
        <p id="tripDateDisplay" class="text-[11px] text-slate-500">2027-02-17 ~ 2027-02-22 (6天5夜)</p>
      </div>
    </div>

    <!-- 中央：雙模式切換頁籤 -->
    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
      <button id="tabModeCollect" onclick="switchWorkspaceMode('collect')"
        class="px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all bg-blue-600 text-white shadow-xs">
        <i class="fa-solid fa-layer-group"></i>
        <span>景點蒐集與資料庫</span>
        <span id="badgeTotalCount" class="ml-0.5 px-1.5 py-0.2 rounded-full text-[10px] bg-white/20 text-white">0</span>
      </button>
      <button id="tabModePlan" onclick="switchWorkspaceMode('plan')"
        class="px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900">
        <i class="fa-solid fa-calendar-days"></i>
        <span>旅遊行程規劃</span>
        <span id="badgeScheduledCount" class="ml-0.5 px-1.5 py-0.2 rounded-full text-[10px] bg-slate-200 text-slate-700">0</span>
      </button>
    </div>

    <!-- 右側：連線狀態、設定、同步 -->
    <div class="flex items-center gap-2 shrink-0">
      <div id="syncStatusPill" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="syncStatusText">Google 試算表已連線</span>
      </div>
      <button onclick="openSettingsModal()" title="系統與試算表設定"
        class="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center transition">
        <i class="fa-solid fa-gear text-sm"></i>
      </button>
      <button id="btnManualSync" onclick="syncWithGoogleSheets()"
        class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-xs">
        <i id="syncIcon" class="fa-solid fa-rotate"></i>
        <span>已同步</span>
      </button>
    </div>
  </header>

  <!-- ==================== 主工作區容器 ==================== -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- ==================== 區塊 A：全球口袋資料庫（模式1為65%多欄網格；模式2為可收合側邊欄） ==================== -->
    <section id="databasePanel" class="w-[65%] bg-white border-r border-slate-200 flex flex-col transition-all duration-200 shrink-0 z-20">
      <!-- 資料庫頂部工具列 -->
      <div class="p-3 border-b border-slate-100 space-y-2.5 bg-slate-50/70 shrink-0">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-database text-blue-600"></i>
              全球口袋資料庫
            </span>
            <button onclick="openCardModal()"
              class="px-2.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1 shadow-xs transition">
              <i class="fa-solid fa-plus"></i> 新增卡片
            </button>
            <button id="btnToggleBatchBox" onclick="toggleBatchImportBox()"
              class="px-2.5 py-1 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-medium flex items-center gap-1 transition">
              <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
              <span>批次匯入</span>
            </button>
          </div>

          <!-- 模式2專用的收合資料庫按鈕 -->
          <div class="flex items-center gap-2">
            <span id="collectModeHint" class="text-[11px] text-slate-500 hidden lg:inline">
              <i class="fa-solid fa-circle-info text-blue-500"></i> 點擊卡片可於右側地圖檢核座標
            </span>
            <button id="btnCollapsePocket" onclick="togglePocketCollapse()"
              class="hidden px-2 py-1 rounded-md text-xs text-slate-500 hover:bg-slate-200/70 items-center gap-1">
              <i class="fa-solid fa-angles-left"></i> 收合口袋
            </button>
          </div>
        </div>

        <!-- 批次自動定位並分類入庫面板（可收合，模式1預設展開） -->
        <div id="batchImportBox" class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-2xs space-y-2">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-2">
              <select id="batchDefaultCategory" class="text-xs font-semibold bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-700 focus:outline-none focus:border-blue-500">
                <option value="美食">🍜 預設類別：美食</option>
                <option value="景點">🏞️ 預設類別：景點</option>
                <option value="購物">🛍️ 預設類別：購物</option>
                <option value="住宿">🏨 預設類別：住宿</option>
                <option value="交通">🚆 預設類別：交通</option>
              </select>
              <label class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 cursor-pointer">
                <input type="checkbox" id="batchAutoGeocode" checked class="accent-emerald-600 rounded" />
                <span>✨ 自動抓座標與行政區</span>
              </label>
            </div>
            <button onclick="batchUpdateAllDistricts()"
              class="text-[11px] font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-2.5 py-1 rounded-lg flex items-center gap-1 transition">
              <i class="fa-solid fa-compass"></i> 依座標補齊空白行政區
            </button>
          </div>

          <div class="flex flex-col sm:flex-row gap-2">
            <textarea id="batchInputText" rows="2"
              placeholder="貼上 Google Maps 網址，或輸入地點名稱（一行一筆，例如：泊港漁市場、PARCO CITY，自動置頂並標示 NEW）..."
              class="flex-1 text-xs p-2 rounded-lg border border-slate-200 focus:outline-none focus:border-blue-500 resize-none bg-slate-50/50"></textarea>
            <button id="btnBatchImport" onclick="handleBatchImport()"
              class="sm:w-44 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 transition shadow-xs">
              <i class="fa-solid fa-magnifying-glass-location"></i>
              <span>批次定位並置頂入庫</span>
            </button>
          </div>
        </div>

        <!-- 關鍵字搜尋 ＋ 明確排序切換器 -->
        <div class="flex flex-wrap items-center gap-2">
          <div class="relative flex-1 min-w-[200px]">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="searchInput" oninput="renderDatabaseCards()"
              placeholder="搜尋地點、備註、食物、行政區..."
              class="w-full pl-8 pr-7 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500" />
            <button onclick="clearSearch()" title="清除搜尋"
              class="text-slate-400 hover:text-slate-600 text-xs absolute right-2.5 top-1/2 -translate-y-1/2">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- 明確排序選單 -->
          <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg px-2 py-1">
            <i class="fa-solid fa-arrow-down-wide-short text-blue-600 text-xs"></i>
            <select id="sortSelect" onchange="renderDatabaseCards()"
              class="text-xs font-semibold text-slate-700 bg-transparent focus:outline-none cursor-pointer">
              <option value="newest">排序：最新加入優先</option>
              <option value="unscheduled">排序：未排入行程優先</option>
              <option value="district">排序：依行政區／城市</option>
              <option value="original">排序：試算表原始順序</option>
            </select>
          </div>
        </div>

        <!-- 多層級篩選膠囊 -->
        <div class="space-y-1.5">
          <!-- 第一排：國內外範圍 + 地區下拉 -->
          <div class="flex flex-wrap items-center gap-1.5">
            <button onclick="setFilter('scope', 'all')" data-filter-scope="all"
              class="scope-btn px-2.5 py-1 rounded-md text-[11px] font-bold bg-slate-800 text-white">全部 (0)</button>
            <button onclick="setFilter('scope', 'domestic')" data-filter-scope="domestic"
              class="scope-btn px-2.5 py-1 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">TW 國內 (0)</button>
            <button onclick="setFilter('scope', 'international')" data-filter-scope="international"
              class="scope-btn px-2.5 py-1 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">✈️ 國外 (0)</button>

            <select id="countryFilter" onchange="onCountryFilterChange()"
              class="text-[11px] bg-white border border-slate-200 rounded-md px-2 py-1 text-slate-700 focus:outline-none">
              <option value="all">全部國家 / 地區</option>
            </select>
            <select id="cityFilter" onchange="renderDatabaseCards()"
              class="text-[11px] bg-white border border-slate-200 rounded-md px-2 py-1 text-slate-700 focus:outline-none">
              <option value="all">全部城市 / 町村</option>
            </select>
          </div>

          <!-- 第二排：類別 + 排程狀態 -->
          <div class="flex flex-wrap items-center justify-between gap-1.5">
            <div class="flex flex-wrap items-center gap-1">
              <button onclick="setFilter('category', 'all')" data-filter-cat="all"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-bold bg-blue-600 text-white">全部</button>
              <button onclick="setFilter('category', '景點')" data-filter-cat="景點"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🏞️ 景點</button>
              <button onclick="setFilter('category', '美食')" data-filter-cat="美食"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🍜 美食</button>
              <button onclick="setFilter('category', '購物')" data-filter-cat="購物"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🛍️ 購物</button>
              <button onclick="setFilter('category', '住宿')" data-filter-cat="住宿"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🏨 住宿</button>
              <button onclick="setFilter('category', '交通')" data-filter-cat="交通"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🚆 交通</button>
            </div>

            <div class="flex items-center gap-1">
              <button onclick="setFilter('status', 'all')" data-filter-status="all"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-bold bg-slate-700 text-white">全部</button>
              <button onclick="setFilter('status', 'unscheduled')" data-filter-status="unscheduled"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">未排入</button>
              <button onclick="setFilter('status', 'scheduled')" data-filter-status="scheduled"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">✅ 已納入</button>
              <button onclick="setFilter('status', 'starred')" data-filter-status="starred"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">⭐ 二訪</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 卡片列表網格容器（模式1為多欄網格 grid-cols-1 md:grid-cols-2 xl:grid-cols-3；模式2為單欄列表） -->
      <div id="databaseCardsContainer" class="flex-1 overflow-y-auto p-3 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 content-start bg-slate-50/40">
        <!-- 動態渲染卡片 -->
      </div>
    </section>

    <!-- 模式2收合口袋後的展開浮動按鈕 -->
    <button id="btnExpandPocket" onclick="togglePocketCollapse()"
      class="hidden absolute left-2 top-3 z-30 bg-white border border-slate-300 shadow-md rounded-lg px-2.5 py-2 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-700 items-center gap-1.5">
      <i class="fa-solid fa-angles-right text-blue-600"></i>
      <span>展開口袋</span>
    </button>

    <!-- ==================== 區塊 B：多日行程規劃看板（僅模式2顯示） ==================== -->
    <section id="itineraryBoardSection" class="hidden flex-1 flex-col bg-slate-100/70 overflow-hidden min-w-0">
      <!-- 看板頂部天數快速導航與儲存按鈕 -->
      <div class="px-3 py-2 bg-white border-b border-slate-200 flex items-center justify-between gap-2 shrink-0 flex-wrap">
        <div id="dayNavPills" class="flex items-center gap-1.5 overflow-x-auto py-0.5">
          <!-- 動態渲染 Day 1 ~ Day N 膠囊 -->
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btnCompactView" onclick="toggleCompactView()"
            class="px-2.5 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-xs font-medium text-slate-700 flex items-center gap-1">
            <i class="fa-solid fa-list"></i> <span>精簡檢視</span>
          </button>
          <button onclick="scrollBoard(-340)" class="w-7 h-7 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs flex items-center justify-center">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button onclick="scrollBoard(340)" class="w-7 h-7 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs flex items-center justify-center">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
          <button onclick="saveAndSyncAll()"
            class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs transition">
            <i class="fa-solid fa-floppy-disk"></i> 儲存排程
          </button>
        </div>
      </div>

      <!-- 多日橫向捲動看板區 -->
      <div id="kanbanColumnsContainer" class="flex-1 overflow-x-auto overflow-y-hidden p-3 flex gap-3 items-stretch">
        <!-- 動態渲染每日行程欄位 -->
      </div>
    </section>

    <!-- ==================== 區塊 C：地圖與當日交通路線面板（模式1佔35%檢核座標；模式2佔320px顯示當日路線） ==================== -->
    <aside id="mapPanel" class="w-[35%] bg-white border-l border-slate-200 flex flex-col shrink-0 transition-all duration-200 z-10">
      <!-- 模式 1 專用頂部列：座標檢核提示 -->
      <div id="mapHeaderCollectMode" class="p-2.5 border-b border-slate-200 bg-slate-50 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
          <span class="text-xs font-bold text-slate-800">景點座標檢核地圖</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="fitMapToFilteredCards()"
            class="px-2.5 py-1 rounded-md bg-white border border-slate-200 hover:bg-blue-50 text-[11px] font-semibold text-slate-700 flex items-center gap-1">
            <i class="fa-solid fa-expand text-blue-600"></i> 顯示全部篩選圖釘
          </button>
        </div>
      </div>

      <!-- 模式 2 專用頂部列：當日交通總計、智慧混搭、周邊口袋雷達 -->
      <div id="mapHeaderPlanMode" class="hidden p-2.5 border-b border-slate-200 bg-slate-50 space-y-2 shrink-0">
        <div class="flex items-center gap-1.5">
          <select id="mapDaySelect" onchange="onMapDayChange()"
            class="flex-1 text-xs font-bold bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-800 focus:outline-none">
          </select>
          <select id="transitProfileSelect" onchange="recalculateAllDayTimes()"
            class="text-xs font-semibold bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-700 focus:outline-none">
            <option value="smart">🔀 智慧混搭</option>
            <option value="transit">🚆 大眾運輸</option>
            <option value="drive">🚗 自駕開車</option>
            <option value="walk">🚶 步行優先</option>
          </select>
        </div>

        <!-- 周邊口袋雷達開關 -->
        <button id="btnRadarToggle" onclick="toggleRadarMode()"
          class="w-full py-1.5 px-2.5 rounded-lg border border-amber-200 bg-amber-50/80 hover:bg-amber-100/80 text-amber-800 text-[11px] font-semibold flex items-center justify-between transition">
          <span>🎯 周邊口袋雷達：<strong id="radarStatusText">關閉</strong>（點擊地圖搜尋半徑1.5km口袋）</span>
          <i class="fa-solid fa-satellite-dish"></i>
        </button>

        <!-- 當日移動總計與段次明細 -->
        <div class="bg-white rounded-xl border border-slate-200 p-2 space-y-1.5 max-h-36 overflow-y-auto">
          <div class="flex items-center justify-between text-xs font-bold text-slate-700 border-b border-slate-100 pb-1">
            <span><i class="fa-solid fa-route text-blue-600 mr-1"></i>當日移動總計：</span>
            <span id="dailyTransitSummary" class="text-blue-700">約 0 分 (0.0 km)</span>
          </div>
          <div id="dailyTransitLegsList" class="space-y-1 text-[11px] text-slate-600">
            <!-- 動態渲染各段移動 -->
          </div>
        </div>
      </div>

      <!-- 圖例列 -->
      <div class="px-3 py-1.5 bg-white border-b border-slate-100 flex items-center justify-between text-[11px] text-slate-600 shrink-0">
        <div class="flex items-center gap-2.5 flex-wrap">
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></i>景點</span>
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></i>美食</span>
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block"></i>購物</span>
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full bg-purple-600 inline-block"></i>住宿</span>
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full bg-slate-600 inline-block"></i>交通</span>
        </div>

      { id: 'c10', title: 'San-A 浦添西海岸 PARCO CITY', category: '購物', country: '日本', district: '沖繩縣・浦添市', duration: 150, lat: 26.2633, lng: 127.6987, notes: '大型海景購物中心、免稅退稅一站購足', starred: true, createdAt: 1700000010, isNew: false }
    ];

    const SEED_ITINERARY = {
      1: {
        startTime: '15:00',
        items: [
          { uid: 'i1', cardId: 'c1', customNote: '15:00 報到 ~ 17:00 起飛', transitMode: 'flight', transitMin: 90 },
          { uid: 'i2', cardId: 'c2', customNote: '19:30 ~ 20:00 入境轉乘', transitMode: 'transit', transitMin: 30 },
          { uid: 'i3', cardId: 'c3', customNote: '連住 2 晚入住', transitMode: 'walk', transitMin: 0 }
        ]
      },
      2: {
        startTime: '09:00',
        items: [
          { uid: 'i4', cardId: 'c3', customNote: '連住第 2 晚出發', transitMode: 'transit', transitMin: 27 },
          { uid: 'i5', cardId: 'c4', customNote: '', transitMode: 'walk', transitMin: 9 },
          { uid: 'i6', cardId: 'c5', customNote: '季節限定水果塔', transitMode: 'transit', transitMin: 32 },
          { uid: 'i7', cardId: 'c6', customNote: '', transitMode: 'transit', transitMin: 35 }
        ]
      },
      3: {
        startTime: '09:00',
        items: [
          { uid: 'i8', cardId: 'c3', customNote: '前晚住宿退房出發（共連住 2 晚）', isCheckout: true, transitMode: 'transit', transitMin: 28 },
          { uid: 'i9', cardId: 'c7', customNote: '連住 3 晚先寄放行李', transitMode: 'transit', transitMin: 29 },
          { uid: 'i10', cardId: 'c8', customNote: '', transitMode: 'walk', transitMin: 5 },
          { uid: 'i11', cardId: 'c9', customNote: '', transitMode: 'walk', transitMin: 0 }
        ]
      },
      4: { startTime: '09:30', items: [{ uid: 'i12', cardId: 'c7', customNote: '連住第 2 晚', transitMode: 'transit', transitMin: 0 }] },
      5: { startTime: '09:30', items: [{ uid: 'i13', cardId: 'c7', customNote: '連住第 3 晚', transitMode: 'transit', transitMin: 0 }] },
      6: { startTime: '09:00', items: [{ uid: 'i14', cardId: 'c7', customNote: '退房前往機場', isCheckout: true, transitMode: 'transit', transitMin: 0 }] }
    };

    let state = {
      mode: 'collect', // 'collect' (模式1: 景點蒐集+地圖) | 'plan' (模式2: 行程規劃+地圖)
      pocketCollapsed: false,
      compactView: false,
      radarActive: false,
      selectedMapDay: 1,
      highlightedCardId: null,
      filters: {
        scope: 'all',
        category: 'all',
        status: 'all'
      },
      settings: { ...DEFAULT_SETTINGS },
      cards: [],
      itinerary: {}
    };

    let mapInstance = null;
    let mapMarkersLayer = null;
    let mapRouteLayer = null;
    let radarCircleLayer = null;
    let markerLookup = {};

    // 2. 初始化載入
    function initApp() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.settings = { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) };
          state.cards = Array.isArray(parsed.cards) ? parsed.cards : SEED_CARDS;
          state.itinerary = parsed.itinerary || SEED_ITINERARY;
        } catch (e) {
          state.cards = SEED_CARDS;
          state.itinerary = SEED_ITINERARY;
        }
      } else {
        state.cards = SEED_CARDS;
        state.itinerary = SEED_ITINERARY;
        persistState();
      }

      ensureItineraryDays();
      initLeafletMap();
      updateTripHeaderDisplay();
      populateRegionDropdowns();
      populateDaySelectors();
      switchWorkspaceMode('collect'); // 預設進入模式1方便檢查卡片，隨時一鍵切模式2
    }

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        settings: state.settings,
        cards: state.cards,
        itinerary: state.itinerary
      }));
    }

    function ensureItineraryDays() {
      const total = Number(state.settings.totalDays) || 6;
      for (let d = 1; d <= total; d++) {
        if (!state.itinerary[d]) {
          state.itinerary[d] = { startTime: '09:00', items: [] };
        }
      }
    }

    // 3. 雙模式切換核心控制
    function switchWorkspaceMode(targetMode) {
      state.mode = targetMode;
      const tabCollect = document.getElementById('tabModeCollect');
      const tabPlan = document.getElementById('tabModePlan');
      const dbPanel = document.getElementById('databasePanel');
      const boardSection = document.getElementById('itineraryBoardSection');
      const mapPanel = document.getElementById('mapPanel');
      const cardsGrid = document.getElementById('databaseCardsContainer');
      const btnCollapsePocket = document.getElementById('btnCollapsePocket');
      const btnExpandPocket = document.getElementById('btnExpandPocket');
      const collectHint = document.getElementById('collectModeHint');
      const mapHeaderCollect = document.getElementById('mapHeaderCollectMode');
      const mapHeaderPlan = document.getElementById('mapHeaderPlanMode');
      const batchBox = document.getElementById('batchImportBox');

      if (targetMode === 'collect') {
        // 頁籤樣式
        tabCollect.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all bg-blue-600 text-white shadow-xs';
        tabPlan.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900';

        // 佈局：左側 65% 資料庫多欄網格 + 右側 35% 檢核地圖
        dbPanel.classList.remove('hidden', 'w-[300px]');
        dbPanel.classList.add('w-[65%]');
        cardsGrid.className = 'flex-1 overflow-y-auto p-3 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 content-start bg-slate-50/40';
        boardSection.classList.add('hidden');
        boardSection.classList.remove('flex');

        mapPanel.classList.remove('w-[320px]');
        mapPanel.classList.add('w-[35%]');
        mapHeaderCollect.classList.remove('hidden');
        mapHeaderPlan.classList.add('hidden');

        btnCollapsePocket.classList.add('hidden');
        btnCollapsePocket.classList.remove('flex');
        btnExpandPocket.classList.add('hidden');
        collectHint.classList.remove('hidden');
        batchBox.classList.remove('hidden');

        // 切回蒐集模式時預設顯示全部狀態，方便檢核所有卡片
        setFilter('status', 'all', false);
      } else {
        // 頁籤樣式
        tabPlan.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all bg-blue-600 text-white shadow-xs';
        tabCollect.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900';

        // 佈局：左側 300px 精簡口袋 + 中間多日看板 + 右側 320px 地圖與交通
        dbPanel.classList.remove('w-[65%]');
        if (state.pocketCollapsed) {
          dbPanel.classList.add('hidden');
          btnExpandPocket.classList.remove('hidden');
          btnExpandPocket.classList.add('flex');
        } else {
          dbPanel.classList.remove('hidden');
          dbPanel.classList.add('w-[300px]');
          btnExpandPocket.classList.add('hidden');
        }
        cardsGrid.className = 'flex-1 overflow-y-auto p-2.5 grid grid-cols-1 gap-2.5 content-start bg-slate-50/40';

        boardSection.classList.remove('hidden');
        boardSection.classList.add('flex');

        mapPanel.classList.remove('w-[35%]');
        mapPanel.classList.add('w-[320px]');
        mapHeaderCollect.classList.add('hidden');
        mapHeaderPlan.classList.remove('hidden');

        btnCollapsePocket.classList.remove('hidden');
        btnCollapsePocket.classList.add('flex');
        collectHint.classList.add('hidden');
        batchBox.classList.add('hidden'); // 規劃模式預設收合批次框，留空間給口袋卡片
      }

      renderAll();
      setTimeout(() => {
        if (mapInstance) mapInstance.invalidateSize();
      }, 220);
    }

    function togglePocketCollapse() {
      state.pocketCollapsed = !state.pocketCollapsed;
      switchWorkspaceMode('plan');
    }

    function toggleBatchImportBox() {
      document.getElementById('batchImportBox').classList.toggle('hidden');
    }

    function toggleCompactView() {
      state.compactView = !state.compactView;
      const btn = document.getElementById('btnCompactView');
      btn.classList.toggle('bg-blue-50', state.compactView);
      btn.classList.toggle('text-blue-700', state.compactView);
      btn.classList.toggle('border-blue-300', state.compactView);
      renderKanbanBoard();
    }

    // 4. 篩選與排序邏輯
    function setFilter(type, value, shouldRender = true) {
      state.filters[type] = value;

      if (type === 'scope') {
        document.querySelectorAll('.scope-btn').forEach(btn => {
          const active = btn.dataset.filterScope === value;
          btn.className = active
            ? 'scope-btn px-2.5 py-1 rounded-md text-[11px] font-bold bg-slate-800 text-white'
            : 'scope-btn px-2.5 py-1 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50';
        });
      } else if (type === 'category') {
        document.querySelectorAll('.cat-btn').forEach(btn => {
          const active = btn.dataset.filterCat === value;
          btn.className = active
            ? 'cat-btn px-2 py-0.5 rounded-md text-[11px] font-bold bg-blue-600 text-white'
            : 'cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600';
        });

        document.querySelectorAll('.status-btn').forEach(btn => {

            ? 'status-btn px-2 py-0.5 rounded-md text-[11px] font-bold bg-slate-700 text-white'

      if (shouldRender) {
        renderDatabaseCards();
        if (state.mode === 'collect') renderMapMarkers();
      }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      renderDatabaseCards();
      if (state.mode === 'collect') renderMapMarkers();
    }

    function getCardScheduledDays(cardId) {
      const days = [];
      const total = Number(state.settings.totalDays) || 6;
      for (let d = 1; d <= total; d++) {
        const items = state.itinerary[d]?.items || [];
        if (items.some(it => it.cardId === cardId)) {
          days.push(d);
        }
      }
      return days;
    }

    function getFilteredAndSortedCards() {
      const kw = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const countryVal = document.getElementById('countryFilter')?.value || 'all';
      const cityVal = document.getElementById('cityFilter')?.value || 'all';
      const sortBy = document.getElementById('sortSelect')?.value || 'newest';

      let list = state.cards.filter(card => {
        const isDomestic = (card.country || '').includes('台') || (card.country || '').includes('臺');
        if (state.filters.scope === 'domestic' && !isDomestic) return false;
        if (state.filters.scope === 'international' && isDomestic) return false;

        if (countryVal !== 'all' && (card.country || '未分類') !== countryVal) return false;
        if (cityVal !== 'all' && (card.district || '未分類') !== cityVal) return false;
        if (state.filters.category !== 'all' && card.category !== state.filters.category) return false;

        const scheduledDays = getCardScheduledDays(card.id);
        if (state.filters.status === 'unscheduled' && scheduledDays.length > 0) return false;
        if (state.filters.status === 'scheduled' && scheduledDays.length === 0) return false;
        if (state.filters.status === 'starred' && !card.starred) return false;

        if (kw) {
          const hay = `${card.title} ${card.district} ${card.country} ${card.notes} ${card.category}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      // 排序邏輯
      list = [...list];
      if (sortBy === 'newest') {
        list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else if (sortBy === 'unscheduled') {
        list.sort((a, b) => {
          const sa = getCardScheduledDays(a.id).length;
          const sb = getCardScheduledDays(b.id).length;
          if (sa !== sb) return sa - sb;
          return (b.createdAt || 0) - (a.createdAt || 0);
        });
      } else if (sortBy === 'district') {
        list.sort((a, b) => (a.district || 'zzz').localeCompare(b.district || 'zzz', 'zh-Hant'));
      }
      // 'original' 維持試算表寫入順序

      return list;
    }

    function updateCountersAndDropdowns() {
      const total = state.cards.length;
      const domestic = state.cards.filter(c => (c.country || '').includes('台') || (c.country || '').includes('臺')).length;
      const intl = total - domestic;

      document.getElementById('badgeTotalCount').textContent = total;
      const scheduledUnique = new Set();
      Object.values(state.itinerary).forEach(day => (day.items || []).forEach(it => scheduledUnique.add(it.cardId)));
      document.getElementById('badgeScheduledCount').textContent = scheduledUnique.size;

      document.querySelector('[data-filter-scope="all"]').textContent = `全部 (${total})`;
      document.querySelector('[data-filter-scope="domestic"]').textContent = `TW 國內 (${domestic})`;
      document.querySelector('[data-filter-scope="international"]').textContent = `✈️ 國外 (${intl})`;
    }

    function populateRegionDropdowns() {
      const countrySel = document.getElementById('countryFilter');
      const citySel = document.getElementById('cityFilter');
      const prevCountry = countrySel.value;
      const prevCity = citySel.value;

      const countries = [...new Set(state.cards.map(c => c.country || '未分類'))];
      countrySel.innerHTML = `<option value="all">全部國家 / 地區</option>` +
        countries.map(c => `<option value="${c}">${c}</option>`).join('');
      if (countries.includes(prevCountry)) countrySel.value = prevCountry;

      const filteredForCities = countrySel.value === 'all'
        ? state.cards
        : state.cards.filter(c => (c.country || '未分類') === countrySel.value);
      const cities = [...new Set(filteredForCities.map(c => c.district || '未分類'))];
      citySel.innerHTML = `<option value="all">全部城市 / 町村</option>` +
        cities.map(d => `<option value="${d}">${d}</option>`).join('');
      if (cities.includes(prevCity)) citySel.value = prevCity;
    }

    // 6. 新增、批次匯入與自動定位（含自動置頂 + NEW 標示）
    async function geocodePlaceName(query) {
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=${encodeURIComponent(query)}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW,ja,en' } });
        const data = await res.json();
        if (data && data.length > 0) {
          const item = data[0];
          const addr = item.address || {};
          const country = addr.country || '日本';
          const pref = addr.state || addr.province || addr.county || '';
          const city = addr.city || addr.town || addr.village || addr.suburb || '';
          const district = [pref, city].filter(Boolean).join('・') || country;
          return {
            lat: parseFloat(item.lat),
            lng: parseFloat(item.lon),
            country,
            district
          };
        }
      } catch (e) {
        console.warn('Geocode error:', e);
      }
      return null;
    }

    function extractTitleFromInputLine(line) {
      let clean = line.trim();
      if (!clean) return '';
      // 若貼上 Google Maps 網址，嘗試解析 /place/名稱/ 或 query 參數
      if (clean.startsWith('http')) {
        try {
          const u = new URL(clean);
          const q = u.searchParams.get('q') || u.searchParams.get('query');
          if (q) return decodeURIComponent(q).replace(/\+/g, ' ');
          const placeMatch = u.pathname.match(/\/place\/([^/]+)/);
          if (placeMatch && placeMatch[1]) {
            return decodeURIComponent(placeMatch[1]).replace(/\+/g, ' ');
          }
        } catch (e) {}
      }
      return clean;
    }

    async function handleBatchImport() {
      const raw = document.getElementById('batchInputText').value;
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) {
        showToast('請先輸入地點名稱或貼上 Google Maps 網址（一行一筆）', 'amber');
        return;
      }

      const btn = document.getElementById('btnBatchImport');
      const defaultCat = document.getElementById('batchDefaultCategory').value;
      const autoGeo = document.getElementById('batchAutoGeocode').checked;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>定位入庫中 (${lines.length})...</span>`;

      let addedCount = 0;
      const nowBase = Date.now();

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const isUrl = line.startsWith('http');
        const title = extractTitleFromInputLine(line);
        let geo = null;

        if (autoGeo && title && !title.startsWith('http')) {
          geo = await geocodePlaceName(title);
        }

        const newCard = {
          id: 'card_' + nowBase + '_' + i,
          title: title,
          category: defaultCat,
          country: geo ? geo.country : '日本',
          district: geo ? geo.district : '沖繩縣・待確認行政區',
          duration: defaultCat === '購物' ? 90 : 60,
          lat: geo ? geo.lat : null,
          lng: geo ? geo.lng : null,
          mapUrl: isUrl ? line : '',
          notes: '',
          starred: false,
          createdAt: nowBase + (lines.length - i), // 確保第一筆在最上方
          isNew: true
        };

        state.cards.unshift(newCard);
        addedCount++;
      }

      document.getElementById('batchInputText').value = '';
      document.getElementById('sortSelect').value = 'newest'; // 自動切回最新加入優先
      persistState();
      populateRegionDropdowns();
      renderAll();

      // 捲動資料庫頂部讓使用者立刻看到剛新增的 NEW 卡片
      document.getElementById('databaseCardsContainer').scrollTop = 0;

      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-magnifying-glass-location"></i> <span>批次定位並置頂入庫</span>`;
      showToast(`已成功新增 ${addedCount} 筆卡片並自動置頂標示 NEW！`, 'emerald');
    }

    async function batchUpdateAllDistricts() {
      const targets = state.cards.filter(c => (!c.district || c.district.includes('待確認')) && c.title);
      if (targets.length === 0) {
        showToast('所有卡片皆已有行政區資訊！', 'blue');
        return;
      }
      showToast(`正在為 ${targets.length} 筆卡片補齊行政區與座標...`, 'blue');
      for (const card of targets) {
        const geo = await geocodePlaceName(card.title);
        if (geo) {
          card.lat = card.lat || geo.lat;
          card.lng = card.lng || geo.lng;
          card.country = geo.country;
          card.district = geo.district;
        }
      }
      persistState();
      populateRegionDropdowns();
      renderAll();
      showToast('行政區與座標補齊完成！', 'emerald');
    }

    async function saveCardFromModal() {
      const id = document.getElementById('editCardId').value;
      const title = document.getElementById('fieldTitle').value.trim();
      if (!title) {
        showToast('地點名稱為必填項目', 'amber');
        return;
      }

      let lat = parseFloat(document.getElementById('fieldLat').value);
      let lng = parseFloat(document.getElementById('fieldLng').value);
      let country = document.getElementById('fieldCountry').value.trim() || '日本';
      let district = document.getElementById('fieldDistrict').value.trim();

      // 若未填座標，儲存時自動嘗試抓取一次
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        const geo = await geocodePlaceName(title);
        if (geo) {
          lat = geo.lat;
          lng = geo.lng;
          if (!district) district = geo.district;
        }
      }

      const payload = {
        title,
        category: document.getElementById('fieldCategory').value,
        country,
        district: district || '沖繩縣',
        duration: parseInt(document.getElementById('fieldDuration').value, 10) || 60,
        lat: Number.isFinite(lat) ? lat : null,
        lng: Number.isFinite(lng) ? lng : null,
        mapUrl: document.getElementById('fieldMapUrl').value.trim(),
        image: document.getElementById('fieldImage').value.trim(),
        notes: document.getElementById('fieldNotes').value.trim(),
        starred: document.getElementById('fieldStarred').checked
      };

      if (id) {
        const idx = state.cards.findIndex(c => c.id === id);
        if (idx !== -1) {
          state.cards[idx] = { ...state.cards[idx], ...payload };
        }
        showToast('卡片資料已更新', 'emerald');
      } else {
        const newCard = {
          id: 'card_' + Date.now(),
          ...payload,
          createdAt: Date.now(),
          isNew: true
        };
        state.cards.unshift(newCard);
        document.getElementById('sortSelect').value = 'newest';

        const assignDay = parseInt(document.getElementById('fieldAssignDay').value, 10);
        if (assignDay) {
          addCardToDay(newCard.id, assignDay);
        }
        showToast('已新增卡片並自動置頂！', 'emerald');
      }

      closeCardModal();
      persistState();
      populateRegionDropdowns();
      renderAll();
      if (!id) {
        document.getElementById('databaseCardsContainer').scrollTop = 0;
        focusCardOnMap(state.cards[0].id);
      }
    }

    function deleteCard(cardId) {
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      if (!confirm(`確定要刪除「${card.title}」嗎？（若已排入行程也會一併移除）`)) return;

      state.cards = state.cards.filter(c => c.id !== cardId);
      Object.values(state.itinerary).forEach(day => {
        day.items = (day.items || []).filter(it => it.cardId !== cardId);
      });

      persistState();
      populateRegionDropdowns();
      renderAll();
      showToast('已刪除卡片', 'slate');
    }

    function toggleStarCard(cardId) {
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      card.starred = !card.starred;
      persistState();
      renderDatabaseCards();
    }

    // 8. 多日行程看板與時間自動推算
    function getFormattedDateInfo(dayNum) {
      const start = new Date(state.settings.startDate + 'T00:00:00');
      if (isNaN(start.getTime())) return { md: `Day ${dayNum}`, week: '' };
      const target = new Date(start.getTime() + (dayNum - 1) * 86400000);
      const mm = String(target.getMonth() + 1).padStart(2, '0');
      const dd = String(target.getDate()).padStart(2, '0');
      const weeks = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      return { md: `${mm}/${dd}`, week: weeks[target.getDay()] };
    }

    function timeToMinutes(hhmm) {
      const [h, m] = (hhmm || '09:00').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function minutesToTime(totalMins) {
      const mins = ((totalMins % 1440) + 1440) % 1440;
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function haversineKm(lat1, lng1, lat2, lng2) {
      if (![lat1, lng1, lat2, lng2].every(v => Number.isFinite(Number(v)) && Number(v) !== 0)) return 0;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function estimateTransit(cardA, cardB) {
      if (!cardA || !cardB) return { mode: 'transit', min: 20, km: 0 };
      const km = haversineKm(cardA.lat, cardA.lng, cardB.lat, cardB.lng);
      const profile = document.getElementById('transitProfileSelect')?.value || 'smart';
      if (km === 0) return { mode: 'transit', min: 20, km: 0 };

      if (profile === 'walk' || (profile === 'smart' && km <= 1.1)) {
        return { mode: 'walk', min: Math.max(5, Math.round(km * 14)), km };
      }
      if (profile === 'drive') {
        return { mode: 'drive', min: Math.max(8, Math.round(km * 2.2 + 5)), km };
      }
      return { mode: 'transit', min: Math.max(10, Math.round(km * 3.5 + 10)), km };
    }

    function renderKanbanBoard() {
      const totalDays = Number(state.settings.totalDays) || 6;
      const navPills = document.getElementById('dayNavPills');
      const board = document.getElementById('kanbanColumnsContainer');

      // 頂部天數膠囊
      navPills.innerHTML = Array.from({ length: totalDays }, (_, i) => {
        const d = i + 1;
        const info = getFormattedDateInfo(d);
        const count = (state.itinerary[d]?.items || []).length;
        const active = state.selectedMapDay === d;
        return `
          <button onclick="selectDayFocus(${d})"
            class="px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 shrink-0 transition ${active ? 'bg-blue-600 text-white shadow-2xs' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
            <span>Day ${d}</span>
            <span class="font-normal opacity-80">${info.md}</span>
            <span class="px-1.5 rounded-full text-[10px] ${active ? 'bg-white/25 text-white' : 'bg-white text-slate-600'}">${count}</span>
          </button>`;
      }).join('');

      // 每日欄位
      board.innerHTML = Array.from({ length: totalDays }, (_, i) => {
        const d = i + 1;
        const info = getFormattedDateInfo(d);
        const dayData = state.itinerary[d] || { startTime: '09:00', items: [] };
        const items = dayData.items || [];

        let cursorMin = timeToMinutes(dayData.startTime);
        let totalActMin = 0;
        let totalTransitMin = 0;
        let pinCounter = 0;

        const cardsHtml = items.map((item, idx) => {
          const card = state.cards.find(c => c.id === item.cardId);
          if (!card) return '';
          const meta = CATEGORY_META[card.category] || CATEGORY_META['景點'];
          const dur = Number(card.duration) || 60;
          const startStr = minutesToTime(cursorMin);
          const endStr = minutesToTime(cursorMin + dur);
          cursorMin += dur;
          if (card.category !== '住宿' && card.category !== '交通') totalActMin += dur;

          const nextItem = items[idx + 1];
          const nextCard = nextItem ? state.cards.find(c => c.id === nextItem.cardId) : null;
          let transitMin = Number(item.transitMin) || 0;
          if (nextCard && transitMin === 0) {
            transitMin = estimateTransit(card, nextCard).min;
          }
          if (nextCard) {
            totalTransitMin += transitMin;
            cursorMin += transitMin;
          }

          if (card.category !== '住宿' && card.category !== '交通') pinCounter++;
          const badgeNum = card.category === '住宿' ? (item.isCheckout ? '退' : '宿') : (card.category === '交通' ? '行' : pinCounter);

          const transitLabelMap = {
            walk: '🚶 慢活步行',
            transit: '🚆 單軌+步行 / 客運',
            drive: '🚗 自駕移動',
            flight: '✈️ 航空飛航'
          };

          return `
            <div draggable="true"
              ondragstart="onDragStartItineraryItem(event, ${d}, ${idx})"
              class="bg-white rounded-xl border border-slate-200 hover:border-blue-400 p-2.5 shadow-2xs transition group">
              <div class="flex items-center justify-between gap-1 mb-1">
                <span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-blue-50 text-blue-700">
                  ${item.customNote && item.customNote.includes('~') ? item.customNote : `${startStr} ~ ${endStr}`}
                </span>
                <div class="flex items-center gap-1">
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${meta.badgeBg}">${card.category}</span>
                  <button onclick="removeItineraryItem(${d}, ${idx})" class="text-slate-300 hover:text-rose-600 text-xs px-1">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
              </div>

              <div class="flex items-start gap-2 cursor-pointer" onclick="focusCardOnMap('${card.id}')">
                <span class="w-5 h-5 rounded-full text-white text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5"
                  style="background-color:${meta.color}">${badgeNum}</span>
                <div class="min-w-0 flex-1">
                  <h5 class="font-bold text-xs text-slate-800 truncate">${card.title}</h5>
                  ${!state.compactView ? `
                    <p class="text-[11px] text-slate-500 truncate mt-0.5">
                      ${card.district || ''}・停留${dur}分${card.notes ? '・' + card.notes : ''}
                    </p>
                  ` : ''}
                </div>
              </div>

              ${!state.compactView ? `
                <div class="mt-2 pt-1.5 border-t border-slate-100 flex items-center gap-1.5 flex-wrap">
                  <button onclick="addReturnToHotel(${d})"
                    class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-medium">
                    ↩ 加入當日回程
                  </button>
                  ${card.category === '住宿' && d < totalDays ? `
                    <button onclick="extendHotelToNextDay(${d}, '${card.id}')"
                      class="px-2 py-0.5 rounded bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 text-[10px] font-bold">
                      🏨 延續至 Day ${d + 1}
                    </button>
                  ` : ''}
                </div>
              ` : ''}
            </div>

            ${nextCard ? `
              <div class="my-1.5 flex justify-center">
                <button onclick="cycleTransitMode(${d}, ${idx})"
                  class="px-2.5 py-0.5 rounded-full bg-white border border-slate-200 hover:border-blue-400 text-[10px] font-semibold text-slate-600 shadow-2xs flex items-center gap-1">
                  <span>↓ ${transitLabelMap[item.transitMode] || '🚆 大眾運輸'} 約 ${transitMin} 分</span>
                </button>
              </div>
            ` : ''}
          `;
        }).join('');

        const endTimeStr = items.length > 0 ? minutesToTime(cursorMin) : dayData.startTime;

        return `
          <div id="day-col-${d}"
            ondragover="onDragOverColumn(event)"
            ondragleave="onDragLeaveColumn(event)"
            ondrop="onDropOnDay(event, ${d})"
            class="w-[310px] shrink-0 bg-slate-50/90 rounded-2xl border border-slate-200 flex flex-col max-h-full overflow-hidden">
            
            <!-- 欄位標頭 -->
            <div class="p-3 bg-white border-b border-slate-200 space-y-1.5 shrink-0">
              <div class="flex items-center justify-between">
                <div class="flex items-baseline gap-1.5">
                  <span class="font-extrabold text-sm text-blue-700">Day ${d}</span>
                  <span class="text-xs font-semibold text-slate-500">${info.md} (${info.week})</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <label class="text-[11px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md flex items-center gap-1">
                    <span>出發</span>
                    <input type="time" value="${dayData.startTime}" onchange="updateDayStartTime(${d}, this.value)"
                      class="bg-transparent font-bold text-slate-700 focus:outline-none w-14" />
                  </label>
                  <button onclick="selectDayFocus(${d})" title="在地圖檢視當日路線"
                    class="w-6 h-6 rounded bg-blue-50 text-blue-600 hover:bg-blue-100 text-xs flex items-center justify-center">
                    <i class="fa-regular fa-map"></i>
                  </button>
                </div>
              </div>
              <div class="flex items-center justify-between text-[11px] text-slate-500">
                <span>共 ${items.length} 項・活動 ${(totalActMin / 60).toFixed(1).replace('.0', '')}h</span>
                <span class="text-blue-600 font-semibold">移動${totalTransitMin}分・約${endTimeStr}結束</span>
              </div>
            </div>

            <!-- 行程卡片清單 -->
            <div class="flex-1 overflow-y-auto p-2.5 space-y-1">
              ${items.length > 0 ? cardsHtml : `
                <div class="h-32 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center text-slate-400 text-xs p-4 text-center">
                  <i class="fa-solid fa-hand-pointer mb-1 text-base"></i>
                  <span>從左側口袋拖曳卡片至此，或點擊卡片「+ 排入 Day ${d}」</span>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    // 9. 看板互動與拖曳操作
    let dragPayload = null;

    function onDragStartCard(e, cardId) {
      dragPayload = { type: 'pocket', cardId };
      e.dataTransfer.effectAllowed = 'copyMove';
    }

    function onDragStartItineraryItem(e, fromDay, fromIndex) {
      dragPayload = { type: 'itinerary', fromDay, fromIndex };
      e.dataTransfer.effectAllowed = 'move';
    }

    function onDragOverColumn(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drop-zone-active');
    }

    function onDragLeaveColumn(e) {
      e.currentTarget.classList.remove('drop-zone-active');
    }

    function onDropOnDay(e, targetDay) {
      e.preventDefault();
      e.currentTarget.classList.remove('drop-zone-active');
      if (!dragPayload) return;

      if (dragPayload.type === 'pocket') {
        addCardToDay(dragPayload.cardId, targetDay);
      } else if (dragPayload.type === 'itinerary') {
        const { fromDay, fromIndex } = dragPayload;
        const [moved] = state.itinerary[fromDay].items.splice(fromIndex, 1);
        if (moved) {
          state.itinerary[targetDay].items.push(moved);
        }
        persistState();
        renderAll();
      }
      dragPayload = null;
    }

    function quickAssignCardToDay(cardId, dayStr) {
      const day = parseInt(dayStr, 10);
      if (!day) return;
      addCardToDay(cardId, day);
    }

    function addCardToDay(cardId, dayNum) {
      ensureItineraryDays();
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      state.itinerary[dayNum].items.push({
        uid: 'it_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        cardId,
        customNote: '',
        transitMode: 'transit',
        transitMin: 0
      });
      state.selectedMapDay = dayNum;
      persistState();
      renderAll();
      showToast(`已將「${card.title}」排入 Day ${dayNum}`, 'emerald');
    }

    function removeItineraryItem(dayNum, idx) {
      state.itinerary[dayNum].items.splice(idx, 1);
      persistState();
      renderAll();
    }

    function updateDayStartTime(dayNum, val) {
      state.itinerary[dayNum].startTime = val || '09:00';
      persistState();
      renderKanbanBoard();
    }

    function cycleTransitMode(dayNum, idx) {
      const item = state.itinerary[dayNum]?.items[idx];
      if (!item) return;
      const modes = ['transit', 'walk', 'drive'];
      const next = modes[(modes.indexOf(item.transitMode) + 1) % modes.length];
      item.transitMode = next;
      const cardA = state.cards.find(c => c.id === item.cardId);
      const nextItem = state.itinerary[dayNum].items[idx + 1];
      const cardB = nextItem ? state.cards.find(c => c.id === nextItem.cardId) : null;
      const km = cardA && cardB ? haversineKm(cardA.lat, cardA.lng, cardB.lat, cardB.lng) : 2;
      item.transitMin = next === 'walk' ? Math.max(5, Math.round(km * 14)) : (next === 'drive' ? Math.max(8, Math.round(km * 2.2 + 5)) : Math.max(10, Math.round(km * 3.5 + 10)));
      persistState();
      renderAll();
    }

    function extendHotelToNextDay(dayNum, cardId) {
      const nextDay = dayNum + 1;
      const totalDays = Number(state.settings.totalDays) || 6;
      if (nextDay > totalDays) return;
      ensureItineraryDays();
      const exists = state.itinerary[nextDay].items.some(it => it.cardId === cardId);
      if (exists) {
        showToast(`Day ${nextDay} 已有此住宿紀錄`, 'amber');
        return;
      }
      state.itinerary[nextDay].items.unshift({
        uid: 'hotel_' + Date.now(),
        cardId,
        customNote: '連住出發 / 退房',
        isCheckout: true,
        transitMode: 'transit',
        transitMin: 0
      });
      persistState();
      renderAll();
      showToast(`已將住宿延續至 Day ${nextDay}`, 'emerald');
    }

    function addReturnToHotel(dayNum) {
      const items = state.itinerary[dayNum]?.items || [];
      const hotelItem = items.find(it => {
        const c = state.cards.find(card => card.id === it.cardId);
        return c && c.category === '住宿';
      });
      if (!hotelItem) {
        showToast('當日尚未設定住宿卡片，請先排入住宿', 'amber');
        return;
      }
      addCardToDay(hotelItem.cardId, dayNum);
    }

    function scrollBoard(offset) {
      document.getElementById('kanbanColumnsContainer').scrollBy({ left: offset, behavior: 'smooth' });
    }

    function selectDayFocus(dayNum) {
      state.selectedMapDay = dayNum;
      document.getElementById('mapDaySelect').value = dayNum;
      renderKanbanBoard();
      renderMapMarkers();
      const col = document.getElementById(`day-col-${dayNum}`);
      if (col) col.scrollIntoView({ behavior: 'smooth', inline: 'nearest' });
    }

    function onMapDayChange() {
      state.selectedMapDay = parseInt(document.getElementById('mapDaySelect').value, 10) || 1;
      renderKanbanBoard();
      renderMapMarkers();
    }

    function recalculateAllDayTimes() {
      renderKanbanBoard();
      renderMapMarkers();
    }

    // 10. Leaflet 地圖與雙向連動檢核
    function initLeafletMap() {
      mapInstance = L.map('mapContainer', { zoomControl: true }).setView([26.2124, 127.6809], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(mapInstance);

      mapMarkersLayer = L.layerGroup().addTo(mapInstance);
      mapRouteLayer = L.layerGroup().addTo(mapInstance);

      mapInstance.on('click', (e) => {
        if (state.radarActive && state.mode === 'plan') {
          runPocketRadar(e.latlng.lat, e.latlng.lng);
        }
      });
    }

    function createColoredPinIcon(color, labelText) {
      return L.divIcon({
        className: 'custom-map-pin',
        html: `<div style="background:${color};color:#fff;width:26px;height:26px;border-radius:9999px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;">${labelText}</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13],
        popupAnchor: [0, -14]
      });
    }

    function renderMapMarkers() {
      if (!mapInstance) return;
      mapMarkersLayer.clearLayers();
      mapRouteLayer.clearLayers();
      markerLookup = {};

      if (state.mode === 'collect') {
        // 模式 1：顯示所有目前篩選條件下的口袋卡片圖釘，方便檢核座標
        const cards = getFilteredAndSortedCards().filter(c => Number.isFinite(Number(c.lat)) && Number.isFinite(Number(c.lng)) && Number(c.lat) !== 0);
        document.getElementById('mapPinCounter').textContent = `${cards.length} 個已定位圖釘`;

        const bounds = [];
        cards.forEach(card => {
          const meta = CATEGORY_META[card.category] || CATEGORY_META['景點'];
          const gmapsUrl = card.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(card.title)}`;
          const marker = L.marker([card.lat, card.lng], {
            icon: createColoredPinIcon(meta.color, card.category[0])
          });

          marker.bindPopup(`
            <div class="text-xs space-y-1 min-w-[180px]">
              <div class="font-bold text-slate-800">${card.title}</div>
              <div class="text-[11px] text-slate-500">${card.district || ''}・${card.category}</div>
              <div class="text-[10px] font-mono text-slate-400">(${Number(card.lat).toFixed(4)}, ${Number(card.lng).toFixed(4)})</div>
              <div class="pt-1 flex gap-1.5">
                <a href="${gmapsUrl}" target="_blank" class="px-2 py-0.5 rounded bg-blue-600 text-white text-[10px] font-bold">Google Maps 核對</a>
                <button onclick="openCardModal('${card.id}')" class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[10px] font-bold">編輯</button>
              </div>
            </div>
          `);

          marker.on('click', () => {
            highlightDatabaseCard(card.id);
          });

          marker.addTo(mapMarkersLayer);
          markerLookup[card.id] = marker;
          bounds.push([card.lat, card.lng]);
        });

        if (bounds.length > 0 && !state.highlightedCardId) {
          mapInstance.fitBounds(bounds, { padding: [36, 36], maxZoom: 14 });
        }
      } else {
        // 模式 2：顯示當日行程路線、序號圖釘與移動總計
        const d = state.selectedMapDay;
        const items = state.itinerary[d]?.items || [];
        const coords = [];
        const legsHtml = [];
        let totalMin = 0;
        let totalKm = 0;
        let stopIndex = 0;

        items.forEach((item, idx) => {
          const card = state.cards.find(c => c.id === item.cardId);
          if (!card) return;
          const hasCoords = Number.isFinite(Number(card.lat)) && Number.isFinite(Number(card.lng)) && Number(card.lat) !== 0;
          const meta = CATEGORY_META[card.category] || CATEGORY_META['景點'];

          if (card.category !== '住宿' && card.category !== '交通') stopIndex++;
          const label = card.category === '住宿' ? '宿' : (card.category === '交通' ? '行' : stopIndex);

          if (hasCoords) {
            const marker = L.marker([card.lat, card.lng], {
              icon: createColoredPinIcon(meta.color, label)
            }).bindPopup(`<div class="text-xs font-bold">${label}. ${card.title}</div><div class="text-[11px] text-slate-500">${card.district || ''}</div>`);
            marker.addTo(mapMarkersLayer);
            markerLookup[card.id] = marker;
            coords.push([card.lat, card.lng]);
          }

          const nextItem = items[idx + 1];
          const nextCard = nextItem ? state.cards.find(c => c.id === nextItem.cardId) : null;
          if (nextCard) {
            const est = estimateTransit(card, nextCard);
            const legMin = Number(item.transitMin) || est.min;
            totalMin += legMin;
            totalKm += est.km;
            const gdir = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(card.title)}&destination=${encodeURIComponent(nextCard.title)}`;
            legsHtml.push(`
              <div class="flex items-center justify-between bg-slate-50 px-2 py-1 rounded border border-slate-100">
                <span class="truncate flex-1 pr-1">${idx + 1}→${idx + 2} ${nextCard.title}</span>
                <span class="font-bold text-blue-700 shrink-0 mr-1.5">約 ${legMin} 分</span>
                <a href="${gdir}" target="_blank" class="text-blue-600 underline shrink-0">Google</a>
              </div>
            `);
          }
        });

        if (coords.length > 1) {
          L.polyline(coords, { color: '#2563eb', weight: 4, opacity: 0.8, dashArray: '6, 6' }).addTo(mapRouteLayer);
        }
        if (coords.length > 0) {
          mapInstance.fitBounds(coords, { padding: [40, 40], maxZoom: 14 });
        }

        document.getElementById('mapPinCounter').textContent = `Day ${d} 共 ${coords.length} 點`;
        document.getElementById('dailyTransitSummary').textContent = `約 ${totalMin} 分 (${totalKm.toFixed(1)} km)`;
        document.getElementById('dailyTransitLegsList').innerHTML = legsHtml.length > 0
          ? legsHtml.join('')
          : `<div class="text-slate-400 text-center py-1">當日尚無跨點移動段次</div>`;
      }
    }

    function fitMapToFilteredCards() {
      state.highlightedCardId = null;
      renderDatabaseCards();
      renderMapMarkers();
    }

    function focusCardOnMap(cardId) {
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      state.highlightedCardId = cardId;
      if (card.isNew) {
        card.isNew = false; // 點擊檢核後移除 NEW 閃爍
        persistState();
      }
      renderDatabaseCards();

      if (Number.isFinite(Number(card.lat)) && Number.isFinite(Number(card.lng)) && Number(card.lat) !== 0 && mapInstance) {
        mapInstance.setView([card.lat, card.lng], 15, { animate: true });
        const marker = markerLookup[cardId];
        if (marker) marker.openPopup();
      } else {
        showToast('此卡片尚未設定座標，可點擊編輯按鈕自動抓取', 'amber');
      }
    }

    function highlightDatabaseCard(cardId) {
      state.highlightedCardId = cardId;
      renderDatabaseCards();
      const el = document.getElementById(`db-card-${cardId}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function toggleRadarMode() {
      state.radarActive = !state.radarActive;
      document.getElementById('radarStatusText').textContent = state.radarActive ? '開啟中（請點地圖）' : '關閉';
      if (!state.radarActive && radarCircleLayer) {
        mapRouteLayer.removeLayer(radarCircleLayer);
        radarCircleLayer = null;
      }
    }

    function runPocketRadar(lat, lng) {
      if (radarCircleLayer) mapRouteLayer.removeLayer(radarCircleLayer);
      radarCircleLayer = L.circle([lat, lng], { radius: 1500, color: '#f59e0b', fillOpacity: 0.12 }).addTo(mapRouteLayer);

      const nearby = state.cards.filter(c => haversineKm(lat, lng, c.lat, c.lng) > 0 && haversineKm(lat, lng, c.lat, c.lng) <= 1.5);
      showToast(`周邊 1.5km 內找到 ${nearby.length} 個口袋地點`, 'amber');
      nearby.forEach(c => {
        const meta = CATEGORY_META[c.category] || CATEGORY_META['景點'];
        L.marker([c.lat, c.lng], { icon: createColoredPinIcon(meta.color, '★') })
          .bindPopup(`<div class="text-xs font-bold">🎯 ${c.title}</div><div class="text-[11px]">${c.district || ''}</div>`)
          .addTo(mapRouteLayer);
      });
    }

    // 11. Google Apps Script 試算表雙向同步與設定
    function updateTripHeaderDisplay() {
      document.getElementById('tripTitleDisplay').textContent = state.settings.tripTitle;
      const days = Number(state.settings.totalDays) || 6;
      const start = new Date(state.settings.startDate + 'T00:00:00');
      let endStr = '';
      if (!isNaN(start.getTime())) {
        const end = new Date(start.getTime() + (days - 1) * 86400000);
        endStr = `${end.getFullYear()}-${String(end.getMonth() + 1).padStart(2, '0')}-${String(end.getDate()).padStart(2, '0')}`;
      }
      document.getElementById('tripDateDisplay').textContent = `${state.settings.startDate} ~ ${endStr} (${days}天${Math.max(0, days - 1)}夜)`;

      const pill = document.getElementById('syncStatusPill');
      const statusText = document.getElementById('syncStatusText');
      if (state.settings.gasUrl) {
        pill.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';
        statusText.textContent = 'Google 試算表已連線';
      } else {
        pill.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200';
        statusText.textContent = '本機暫存模式（未綁定 GAS）';
      }
    }

    function populateDaySelectors() {
      const totalDays = Number(state.settings.totalDays) || 6;
      const sel = document.getElementById('mapDaySelect');
      sel.innerHTML = Array.from({ length: totalDays }, (_, i) => {
        const d = i + 1;
        const info = getFormattedDateInfo(d);
        return `<option value="${d}">Day ${d} (${info.md} (${info.week}))</option>`;
      }).join('');
      sel.value = state.selectedMapDay;
    }

    function openSettingsModal() {
      document.getElementById('setTripTitle').value = state.settings.tripTitle;
      document.getElementById('setStartDate').value = state.settings.startDate;
      document.getElementById('setTotalDays').value = state.settings.totalDays;
      document.getElementById('setGasUrl').value = state.settings.gasUrl || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      state.settings.tripTitle = document.getElementById('setTripTitle').value.trim() || DEFAULT_SETTINGS.tripTitle;
      state.settings.startDate = document.getElementById('setStartDate').value || DEFAULT_SETTINGS.startDate;
      state.settings.totalDays = Math.max(1, parseInt(document.getElementById('setTotalDays').value, 10) || 6);
      state.settings.gasUrl = document.getElementById('setGasUrl').value.trim();

      ensureItineraryDays();
      persistState();
      updateTripHeaderDisplay();
      populateDaySelectors();
      renderAll();
      closeSettingsModal();
      showToast('設定已儲存並套用', 'emerald');
    }

    async function syncWithGoogleSheets() {
      persistState();
      if (!state.settings.gasUrl) {
        showToast('已儲存至本機；如需雲端同步請點齒輪填入 GAS 網址', 'blue');
        return;
      }
      const icon = document.getElementById('syncIcon');
      icon.classList.add('fa-spin');
      try {
        const res = await fetch(state.settings.gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'sync',
            settings: state.settings,
            cards: state.cards,
            itinerary: state.itinerary
          })
        });
        const data = await res.json();
        if (data && Array.isArray(data.cards)) {
          state.cards = data.cards;
          if (data.itinerary) state.itinerary = data.itinerary;
          persistState();
          renderAll();
        }
        showToast('已與 Google 試算表完成雙向同步！', 'emerald');
      } catch (err) {
        showToast('雲端同步連線失敗，資料已安全保留於本機', 'amber');
      } finally {
        icon.classList.remove('fa-spin');
      }
    }

    function saveAndSyncAll() {
      syncWithGoogleSheets();
    }

    function exportJsonBackup() {
      const blob = new Blob([JSON.stringify({ settings: state.settings, cards: state.cards, itinerary: state.itinerary }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${state.settings.tripTitle}_備份.json`;
      a.click();
    }

    function showToast(msg, color = 'slate') {
      const container = document.getElementById('toastContainer');
      const colorMap = {
        emerald: 'bg-emerald-600 text-white',
        blue: 'bg-blue-600 text-white',
        amber: 'bg-amber-500 text-white',
        slate: 'bg-slate-800 text-white'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center gap-2 transition-all ${colorMap[color] || colorMap.slate}`;
      el.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>${msg}</span>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function renderAll() {
      renderDatabaseCards();
      if (state.mode === 'plan') {
        renderKanbanBoard();
      }
      renderMapMarkers();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
