<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沖繩卡片式旅遊規劃系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f3f6fa;
      color: #1e293b;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes pulseBorder {
      0%, 100% { box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.55), 0 8px 20px -4px rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25), 0 8px 20px -4px rgba(245, 158, 11, 0.15); }
    }
    .card-is-new {
      border-color: #f59e0b !important;
      animation: pulseBorder 2.5s infinite;
    }
    .card-is-highlighted {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35) !important;
    }
    .drop-zone-active {
      background-color: #eff6ff !important;
      border: 2px dashed #3b82f6 !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 2px;
    }
  </style>
</head>
<body class="h-screen flex flex-col select-none">

  <!-- ==================== 頂部導覽列 ==================== -->
  <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between shrink-0 z-30 shadow-xs">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-xs">
        <i class="fa-solid fa-globe text-base"></i>
      </div>
      <div class="truncate">
        <h1 id="tripTitleDisplay" class="font-bold text-base text-slate-800 truncate">2027沖繩首發自由行</h1>
        <p id="tripDateDisplay" class="text-[11px] text-slate-500">2027-02-17 ~ 2027-02-22 (6天5夜)</p>
      </div>
    </div>

    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
      <button id="tabModeCollect" onclick="switchWorkspaceMode('collect')"
        class="px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all bg-blue-600 text-white shadow-xs">
        <i class="fa-solid fa-layer-group"></i>
        <span>景點蒐集與資料庫</span>
        <span id="badgeTotalCount" class="ml-0.5 px-1.5 py-0.2 rounded-full text-[10px] bg-white/20 text-white">0</span>
      </button>
      <button id="tabModePlan" onclick="switchWorkspaceMode('plan')"
        class="px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900">
        <i class="fa-solid fa-calendar-days"></i>
        <span>旅遊行程規劃</span>
        <span id="badgeScheduledCount" class="ml-0.5 px-1.5 py-0.2 rounded-full text-[10px] bg-slate-200 text-slate-700">0</span>
      </button>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <div id="syncStatusPill" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
        <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="syncStatusText">Google 試算表已連線</span>
      </div>
      <button onclick="openSettingsModal()" title="設定 Google Apps Script 試算表網址"
        class="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center transition">
        <i class="fa-solid fa-gear text-sm"></i>
      </button>
      <button id="btnPushSync" onclick="pushAllToGoogleSheets(false)" title="立即將目前所有卡片與排程寫回 Google 試算表"
        class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-xs">
        <i id="pushIcon" class="fa-solid fa-cloud-arrow-up"></i>
        <span>寫入試算表</span>
      </button>
      <button id="btnManualSync" onclick="pullFromGoogleSheets(true)" title="從 Google 試算表重新載入最新資料"
        class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-xs">
        <i id="syncIcon" class="fa-solid fa-rotate"></i>
        <span id="syncBtnLabel">重新載入</span>
      </button>
    </div>
  </header>

  <!-- ==================== 主工作區容器 ==================== -->
  <main class="flex-1 flex overflow-hidden relative min-h-0">

    <!-- ==================== 區塊 A：全球口袋資料庫 ==================== -->
    <section id="databasePanel" class="w-[65%] bg-white border-r border-slate-200 flex flex-col transition-all duration-200 shrink-0 z-20 min-h-0">
      <div id="dbToolbarContainer" class="p-3 border-b border-slate-100 space-y-2 bg-slate-50/70 shrink-0">
        <div class="flex items-center justify-between gap-1.5 flex-wrap">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-database text-blue-600"></i>
              <span id="dbPanelTitleText">全球口袋資料庫</span>
            </span>
            <button onclick="openCardModal()"
              class="px-2.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1 shadow-xs transition">
              <i class="fa-solid fa-plus"></i> 新增卡片
            </button>
            <button id="btnToggleBatchBox" onclick="toggleBatchImportBox()"
              class="px-2 py-1 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-medium flex items-center gap-1 transition">
              <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
              <span>批次匯入</span>
            </button>
          </div>

          <div class="flex items-center gap-1.5">
            <!-- 模式 1 專屬：迷你卡片檢視切換 -->
            <button id="btnMiniCardToggle" onclick="toggleMiniCardMode()"
              class="px-2.5 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold flex items-center gap-1 transition"
              title="切換為超精簡卡片，只顯示地點名稱與分類，方便配合大地圖瀏覽">
              <i class="fa-solid fa-compress text-blue-600"></i>
              <span id="miniCardBtnLabel">迷你卡片</span>
            </button>

            <button id="btnTogglePlanFilters" onclick="togglePlanAdvancedFilters()"
              class="hidden px-2 py-1 rounded-md border border-slate-200 bg-white text-[11px] font-medium text-slate-600 hover:bg-slate-100 items-center gap-1">
              <i class="fa-solid fa-filter text-blue-600"></i> 篩選
            </button>
            <button id="btnCollapsePocket" onclick="togglePocketCollapse()"
              class="hidden px-2 py-1 rounded-md text-[11px] text-slate-500 hover:bg-slate-200/70 items-center gap-1">
              <i class="fa-solid fa-angles-left"></i> 收合
            </button>
          </div>
        </div>

        <!-- 批次自動定位並分類入庫面板 -->
        <div id="batchImportBox" class="hidden bg-white p-2.5 rounded-xl border border-slate-200 shadow-2xs space-y-2">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-2">
              <select id="batchDefaultCategory" class="text-xs font-semibold bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-700 focus:outline-none focus:border-blue-500">
                <option value="景點">🏞️ 預設類別：景點</option>
                <option value="美食">🍜 預設類別：美食</option>
                <option value="購物">🛍️ 預設類別：購物</option>
                <option value="住宿">🏨 預設類別：住宿</option>
                <option value="機場">✈️ 預設類別：機場</option>
                <option value="交通">🚆 預設類別：交通</option>
                <option value="體驗">🎡 預設類別：體驗</option>
              </select>
              <label class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 cursor-pointer">
                <input type="checkbox" id="batchAutoGeocode" checked class="accent-emerald-600 rounded" />
                <span>✨ 自動抓座標與行政區</span>
              </label>
            </div>
            <button onclick="batchUpdateAllDistricts()"
              class="text-[11px] font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-2.5 py-1 rounded-lg flex items-center gap-1 transition">
              <i class="fa-solid fa-compass"></i> 依座標補齊空白行政區
            </button>
          </div>

          <div class="flex flex-col sm:flex-row gap-2">
            <textarea id="batchInputText" rows="2"
              placeholder="貼上 Google Maps 網址，或輸入地點名稱（一行一筆，自動置頂並標示 NEW）..."
              class="flex-1 text-xs p-2 rounded-lg border border-slate-200 focus:outline-none focus:border-blue-500 resize-none bg-slate-50/50"></textarea>
            <button id="btnBatchImport" onclick="handleBatchImport()"
              class="sm:w-44 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 transition shadow-xs">
              <i class="fa-solid fa-magnifying-glass-location"></i>
              <span>批次定位並置頂入庫</span>
            </button>
          </div>
        </div>

        <!-- 關鍵字搜尋 ＋ 排序切換器 -->
        <div class="flex flex-wrap items-center gap-1.5">
          <div class="relative flex-1 min-w-[140px]">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-2.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="searchInput" oninput="renderDatabaseCards()"
              placeholder="搜尋地點、備註、航班、行政區..."
              class="w-full pl-7 pr-6 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500" />
            <button onclick="clearSearch()" title="清除搜尋"
              class="text-slate-400 hover:text-slate-600 text-xs absolute right-2 top-1/2 -translate-y-1/2">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg px-2 py-1">
            <i class="fa-solid fa-arrow-down-wide-short text-blue-600 text-xs"></i>
            <select id="sortSelect" onchange="renderDatabaseCards()"
              class="text-xs font-semibold text-slate-700 bg-transparent focus:outline-none cursor-pointer">
              <option value="newest">最新加入優先</option>
              <option value="unscheduled">未排入優先</option>
              <option value="district">依行政區排列</option>
              <option value="original">試算表順序</option>
            </select>
          </div>
        </div>

        <!-- 多層級篩選膠囊 -->
        <div id="advancedFilterGroup" class="space-y-1.5">
          <div class="flex flex-wrap items-center gap-1.5">
            <button onclick="setFilter('scope', 'all')" data-filter-scope="all"
              class="scope-btn px-2 py-0.5 rounded-md text-[11px] font-bold bg-slate-800 text-white">全部 (0)</button>
            <button onclick="setFilter('scope', 'domestic')" data-filter-scope="domestic"
              class="scope-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">TW 國內 (0)</button>
            <button onclick="setFilter('scope', 'international')" data-filter-scope="international"
              class="scope-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">✈️ 國外 (0)</button>

            <select id="countryFilter" onchange="onCountryFilterChange()"
              class="text-[11px] bg-white border border-slate-200 rounded-md px-1.5 py-0.5 text-slate-700 focus:outline-none">
              <option value="all">全部國家 / 地區</option>
            </select>
            <select id="cityFilter" onchange="renderDatabaseCards()"
              class="text-[11px] bg-white border border-slate-200 rounded-md px-1.5 py-0.5 text-slate-700 focus:outline-none">
              <option value="all">全部城市 / 町村</option>
            </select>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-1">
            <div class="flex flex-wrap items-center gap-1">
              <button onclick="setFilter('category', 'all')" data-filter-cat="all"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-bold bg-blue-600 text-white">全部</button>
              <button onclick="setFilter('category', '景點')" data-filter-cat="景點"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🏞️ 景點</button>
              <button onclick="setFilter('category', '美食')" data-filter-cat="美食"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🍜 美食</button>
              <button onclick="setFilter('category', '購物')" data-filter-cat="購物"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🛍️ 購物</button>
              <button onclick="setFilter('category', '住宿')" data-filter-cat="住宿"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🏨 住宿</button>
              <button onclick="setFilter('category', '機場')" data-filter-cat="機場"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">✈️ 機場</button>
              <button onclick="setFilter('category', '交通')" data-filter-cat="交通"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🚆 交通</button>
              <button onclick="setFilter('category', '體驗')" data-filter-cat="體驗"
                class="cat-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">🎡 體驗</button>
            </div>

            <div class="flex items-center gap-1">
              <button onclick="setFilter('status', 'all')" data-filter-status="all"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-bold bg-slate-700 text-white">全部</button>
              <button onclick="setFilter('status', 'unscheduled')" data-filter-status="unscheduled"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">未排入</button>
              <button onclick="setFilter('status', 'scheduled')" data-filter-status="scheduled"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">✅ 已納入</button>
              <button onclick="setFilter('status', 'starred')" data-filter-status="starred"
                class="status-btn px-2 py-0.5 rounded-md text-[11px] font-medium bg-white border border-slate-200 text-slate-600">⭐ 二訪</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 卡片列表容器 -->
      <div id="databaseCardsContainer" class="flex-1 min-h-0 overflow-y-auto p-3 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 items-stretch content-start bg-slate-50/40"></div>
    </section>

    <!-- 模式2收合口袋後的展開浮動按鈕 -->
    <button id="btnExpandPocket" onclick="togglePocketCollapse()"
      class="hidden absolute left-2 top-3 z-30 bg-white border border-slate-300 shadow-md rounded-lg px-2.5 py-2 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-700 items-center gap-1.5">
      <i class="fa-solid fa-angles-right text-blue-600"></i>
      <span>展開口袋</span>
    </button>

    <!-- ==================== 區塊 B：多日行程規劃看板（僅模式2顯示） ==================== -->
    <section id="itineraryBoardSection" class="hidden flex-1 flex-col bg-slate-100/70 overflow-hidden min-w-0 min-h-0">
      <div class="px-3 py-2 bg-white border-b border-slate-200 flex items-center justify-between gap-2 shrink-0 flex-wrap">
        <div id="dayNavPills" class="flex items-center gap-1.5 overflow-x-auto py-0.5"></div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btnCompactView" onclick="toggleCompactView()"
            class="px-2.5 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-xs font-medium text-slate-700 flex items-center gap-1">
            <i class="fa-solid fa-list"></i> <span>精簡檢視</span>
          </button>
          <button onclick="scrollBoard(-340)" class="w-7 h-7 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs flex items-center justify-center">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button onclick="scrollBoard(340)" class="w-7 h-7 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs flex items-center justify-center">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
          <button onclick="pushAllToGoogleSheets(false)"
            class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs transition">
            <i class="fa-solid fa-floppy-disk"></i> 儲存排程
          </button>
        </div>
      </div>

      <div id="kanbanColumnsContainer" class="flex-1 min-h-0 overflow-x-auto overflow-y-hidden p-3 flex gap-3 items-stretch"></div>
    </section>

    <!-- ==================== 區塊 C：地圖與分類圖層控制面板 ==================== -->
    <aside id="mapPanel" class="w-[35%] bg-white border-l border-slate-200 flex flex-col shrink-0 transition-all duration-200 z-10 min-h-0">
      <!-- 模式 1 頂部標題列 -->
      <div id="mapHeaderCollectMode" class="p-2.5 border-b border-slate-200 bg-slate-50 flex items-center justify-between gap-2 shrink-0 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
          <span class="text-xs font-bold text-slate-800">景點分布檢核地圖</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="toggleMapExpand()" id="btnMapExpandCollect"
            class="px-2.5 py-1 rounded-md bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold flex items-center gap-1 shadow-2xs transition">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
            <span id="mapExpandCollectLabel">放大地圖</span>
          </button>
          <button onclick="fitMapToFilteredCards()"
            class="px-2 py-1 rounded-md bg-white border border-slate-200 hover:bg-blue-50 text-[11px] font-semibold text-slate-700 flex items-center gap-1">
            <i class="fa-solid fa-expand text-blue-600"></i> 全覽
          </button>
        </div>
      </div>

      <!-- 模式 2 頂部控制列 -->
      <div id="mapHeaderPlanMode" class="hidden p-2.5 border-b border-slate-200 bg-slate-50 space-y-2 shrink-0">
        <div class="flex items-center gap-1.5">
          <select id="mapDaySelect" onchange="onMapDayChange()"
            class="flex-1 text-xs font-bold bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-800 focus:outline-none">
          </select>
          <select id="transitProfileSelect" onchange="recalculateAllDayTimes()"
            class="text-xs font-semibold bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-700 focus:outline-none">
            <option value="smart">🔀 智慧混搭</option>
            <option value="transit">🚆 大眾運輸</option>
            <option value="drive">🚗 自駕開車</option>
            <option value="walk">🚶 步行優先</option>
          </select>
          <button onclick="toggleMapExpand()" id="btnMapExpandPlan"
            class="px-2.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold flex items-center gap-1 shrink-0 shadow-2xs transition">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
            <span id="mapExpandPlanLabel">放大地圖</span>
          </button>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="btnOverlayPocket" onclick="toggleOverlayPocketOnPlanMap()"
            class="flex-1 py-1.5 px-2.5 rounded-lg border border-blue-200 bg-blue-50/80 hover:bg-blue-100/80 text-blue-800 text-[11px] font-semibold flex items-center justify-between transition">
            <span>📍 疊加口袋點位：<strong id="overlayPocketStatusText">關閉</strong></span>
            <i class="fa-solid fa-layer-group"></i>
          </button>
          <button id="btnRadarToggle" onclick="toggleRadarMode()"
            class="py-1.5 px-2.5 rounded-lg border border-amber-200 bg-amber-50/80 hover:bg-amber-100/80 text-amber-800 text-[11px] font-semibold flex items-center gap-1 shrink-0 transition"
            title="開啟後點擊地圖可搜尋 1.5km 內口袋點位">
            <span>🎯 雷達：<strong id="radarStatusText">關</strong></span>
          </button>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-2 space-y-1.5 max-h-32 overflow-y-auto">
          <div class="flex items-center justify-between text-xs font-bold text-slate-700 border-b border-slate-100 pb-1">

  <!-- ==================== 核心應用程式邏輯 ==================== -->
  <script>
    const STORAGE_KEY = 'okinawa_card_planner_v2';
    const DEFAULT_SETTINGS = {
      tripTitle: '2027沖繩首發自由行',
      startDate: '2027-02-17',
      totalDays: 6,
      gasUrl: ''
    };

    const PRESET_DISTRICTS = [
      '沖繩縣・那霸市', '沖繩縣・浦添市', '沖繩縣・宜野灣市', '沖繩縣・北谷町',
      '沖繩縣・嘉手納町', '沖繩縣・讀谷村', '沖繩縣・恩納村', '沖繩縣・名護市',
      '沖繩縣・本部町', '沖繩縣・今歸仁村', '沖繩縣・豐見城市', '沖繩縣・糸滿市',
      '沖繩縣・南城市', '沖繩縣・八重瀨町', '沖繩縣・西原町', '沖繩縣・沖繩市',
      '臺中市・清水區', '臺中市・西屯區', '桃園市・大園區', '臺北市・松山區'
    ];

    const CATEGORY_LIST = ['景點', '美食', '購物', '住宿', '機場', '交通', '體驗'];

    const CATEGORY_META = {
      '景點': { color: '#10b981', pinChar: '景', emoji: '🏞️', badgeBg: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      '美食': { color: '#f59e0b', pinChar: '美', emoji: '🍜', badgeBg: 'bg-amber-50 text-amber-700 border-amber-200' },
      '購物': { color: '#2563eb', pinChar: '購', emoji: '🛍️', badgeBg: 'bg-blue-50 text-blue-700 border-blue-200' },
      '住宿': { color: '#9333ea', pinChar: '宿', emoji: '🏨', badgeBg: 'bg-purple-50 text-purple-700 border-purple-200' },
      '機場': { color: '#0284c7', pinChar: '機', emoji: '✈️', badgeBg: 'bg-sky-50 text-sky-700 border-sky-200' },
      '交通': { color: '#475569', pinChar: '交', emoji: '🚆', badgeBg: 'bg-slate-100 text-slate-700 border-slate-300' },
      '體驗': { color: '#e11d48', pinChar: '驗', emoji: '🎡', badgeBg: 'bg-rose-50 text-rose-700 border-rose-200' }
    };

    let state = {
      mode: 'collect',
      pocketCollapsed: false,
      compactView: false,
      miniCardView: false,       // 模式 1 超精簡卡片檢視（配合大地圖）
      mapExpanded: false,        // 兩模式皆可切換放大地圖版面
      overlayPocketOnPlan: false,// 模式 2 地圖是否疊加顯示口袋點位
      planFiltersOpen: false,
      radarActive: false,
      selectedMapDay: 1,
      highlightedCardId: null,
      expandedCards: {},
      deletedIds: [],
      mapVisibleCategories: {
        '景點': true,
        '美食': true,
        '購物': true,
        '住宿': true,
        '機場': true,
        '交通': true,
        '體驗': true
      },
      filters: {
        scope: 'all',
        category: 'all',
        status: 'all'
      },
      settings: { ...DEFAULT_SETTINGS },
      cards: [],
      itinerary: {}
    };

    let mapInstance = null;
    let mapMarkersLayer = null;
    let mapRouteLayer = null;
    let radarCircleLayer = null;
    let markerLookup = {};
    let autoSyncTimer = null;

    function discoverSavedGasUrl() {
      if (state.settings.gasUrl) return state.settings.gasUrl;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        const val = localStorage.getItem(k) || '';
        const match = val.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/);
        if (match) return match[0];
      }
      return '';
    }

    async function initApp() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.settings = { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) };
          state.cards = Array.isArray(parsed.cards) ? parsed.cards : [];
          state.itinerary = parsed.itinerary || {};
          state.deletedIds = Array.isArray(parsed.deletedIds) ? parsed.deletedIds : [];
        } catch (e) {}
      }

      if (!state.settings.gasUrl) {
        const discovered = discoverSavedGasUrl();
        if (discovered) {
          state.settings.gasUrl = discovered;
          persistState(false);
        }
      }

      ensureItineraryDays();
      initLeafletMap();
      renderMapCategoryToggles();
      updateTripHeaderDisplay();
      populateRegionDropdowns();
      populateDaySelectors();
      switchWorkspaceMode('collect');

      if (state.settings.gasUrl) {
        await pullFromGoogleSheets(false);
      }
    }

    function persistState(triggerAutoPush = true) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        settings: state.settings,
        cards: state.cards,
        itinerary: state.itinerary,
        deletedIds: state.deletedIds
      }));

      if (triggerAutoPush && state.settings.gasUrl) {
        setSyncPillStatus('syncing', '正在自動寫入試算表...');
        clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(() => {
          pushAllToGoogleSheets(true);
        }, 500);
      }
    }

    function setSyncPillStatus(type, text) {
      const pill = document.getElementById('syncStatusPill');
      const dot = document.getElementById('syncStatusDot');
      const label = document.getElementById('syncStatusText');
      if (!pill || !dot || !label) return;

      label.textContent = text;
      if (type === 'syncing') {
        pill.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200';
        dot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-ping';
      } else if (type === 'warning') {
        pill.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200';
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
      } else {
        pill.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      }
    }

    function ensureItineraryDays() {
      const total = Number(state.settings.totalDays) || 6;
      for (let d = 1; d <= total; d++) {
        if (!state.itinerary[d]) {
          state.itinerary[d] = { startTime: '09:00', items: [] };
        }
      }
    }

    // 2. Google 試算表雙向轉譯與遞迴陣列擷取
    function extractRowsFromGasPayload(payload) {
      if (!payload) return [];
      if (Array.isArray(payload)) {
        if (payload.length > 0 && Array.isArray(payload[0])) {
          const headers = payload[0].map(h => String(h || '').trim());
          return payload.slice(1).map(arr => {
            const obj = {};
            headers.forEach((h, i) => { if (h) obj[h] = arr[i]; });
            return obj;
          });
        }
        return payload;
      }
      if (typeof payload === 'object') {
        const priorityKeys = ['spots', 'Spots', 'data', 'records', 'cards', 'rows', 'items', 'list'];
        for (const key of priorityKeys) {
          if (Array.isArray(payload[key]) && payload[key].length > 0) {
            return extractRowsFromGasPayload(payload[key]);
          }
        }
        for (const val of Object.values(payload)) {
          if (Array.isArray(val) && val.length > 0) {
            const extracted = extractRowsFromGasPayload(val);
            if (extracted.length > 0 && typeof extracted[0] === 'object') return extracted;
          }
        }
      }
      return [];
    }

    function cleanDistrictString(rawArea, country) {
      let clean = String(rawArea || '').trim();
      if (clean.includes('/')) {
        const parts = clean.split('/').map(s => s.trim()).filter(Boolean);
        clean = parts[parts.length - 1];
      }
      clean = clean
        .replace(/^日本\s*[・\/-]\s*/, '')
        .replace(/^台灣\s*[・\/-]\s*/, '')
        .replace(/^臺灣\s*[・\/-]\s*/, '');
      return clean || country || '未分類';
    }

    function isTransportOrAirport(category) {
      return category === '機場' || category === '交通';
    }

    function normalizeSheetRowToCard(row, index) {
      const id = String(row.id || `spot_${Date.now()}_${index}`);
      const title = String(row.name || row.title || '未命名地點').trim();
      const rawArea = String(row.area || row.district || '').trim();
      let country = String(row.country || '').trim();
      if (!country) {
        if (rawArea.includes('台灣') || rawArea.includes('臺灣') || rawArea.includes('臺中') || rawArea.includes('台北')) {
          country = '台灣';
        } else {
          country = '日本';
        }
      }

      const cleanDistrict = cleanDistrictString(rawArea, country);
      let category = String(row.category || '景點').trim();
      if (!CATEGORY_META[category]) {
        category = '景點';
      }

      const rawHours = String(row.business_hours || row.businessHours || '').trim();
      const rawMustBuy = String(row.must_buy || row.mustBuy || '').trim();
      const rawParking = String(row.parking_info || row.parkingInfo || '').trim();

      let departTime = String(row.departTime || '').trim();
      let arriveTime = String(row.arriveTime || '').trim();
      let flightNo = String(row.flightNo || '').trim();
      if (isTransportOrAirport(category) && !departTime && rawHours) {
        const cleaned = rawHours.replace(/^✈️\s*/, '').replace(/^🚆\s*/, '');
        const parts = cleaned.split(/[-~→>]/).map(s => s.trim());
        if (parts.length >= 2) {
          departTime = parts[0];
          arriveTime = parts[1];
        } else {
          departTime = cleaned;
        }
      }

      const lat = parseFloat(row.lat);
      const lng = parseFloat(row.lng);
      const createdNum = parseInt(id.replace(/\D/g, '').slice(0, 13), 10);

      return {
        id,
        title,
        category,
        country,
        district: cleanDistrict,
        rawArea,
        duration: parseInt(row.estimated_duration || row.duration, 10) || 60,
        lat: Number.isFinite(lat) ? lat : null,
        lng: Number.isFinite(lng) ? lng : null,
        mapUrl: String(row.source_url || row.mapUrl || '').trim(),
        image: String(row.photo_url || row.image || '').trim(),
        notes: String(row.description || row.notes || '').trim(),
        mustBuy: rawMustBuy,
        businessHours: rawHours,
        parkingInfo: rawParking,
        departTime,
        arriveTime,
        flightNo: flightNo || (isTransportOrAirport(category) ? rawMustBuy : ''),
        checkInOut: String(row.checkInOut || (category === '住宿' ? rawHours : '')).trim(),
        bookingRef: String(row.bookingRef || (category === '住宿' ? rawMustBuy : '')).trim(),
        sheetStatus: String(row.status || 'pocket').trim(),
        assignedDayRaw: String(row.assigned_day || '').trim(),
        sortOrder: parseInt(row.sort_order, 10) || (index + 1),
        starred: row.starred === true || String(row.starred).toUpperCase() === 'TRUE',
        createdAt: Number.isFinite(createdNum) && createdNum > 1000000000 ? createdNum : (1700000000 + index),
        isNew: false
      };
    }

    function resolveAssignedDayNumbers(assignedRaw) {
      if (!assignedRaw || assignedRaw === 'pocket' || assignedRaw === 'unscheduled') return [];
      const tokens = String(assignedRaw).split(/[,;、\s]+/).map(s => s.trim()).filter(Boolean);
      const totalDays = Number(state.settings.totalDays) || 6;
      const start = new Date(state.settings.startDate + 'T00:00:00');
      const result = [];

      tokens.forEach(tok => {
        if (/^\d+$/.test(tok)) {
          const d = parseInt(tok, 10);
          if (d >= 1 && d <= totalDays && !result.includes(d)) result.push(d);
        } else {
          const target = new Date(tok + 'T00:00:00');
          if (!isNaN(start.getTime()) && !isNaN(target.getTime())) {
            const diffDays = Math.round((target.getTime() - start.getTime()) / 86400000) + 1;
            if (diffDays >= 1 && diffDays <= totalDays && !result.includes(diffDays)) {
              result.push(diffDays);
            }
          }
        }
      });
      return result;
    }

    function dayNumToIsoDate(dayNum) {
      const start = new Date(state.settings.startDate + 'T00:00:00');
      if (isNaN(start.getTime())) return String(dayNum);
      const target = new Date(start.getTime() + (dayNum - 1) * 86400000);
      const yyyy = target.getFullYear();
      const mm = String(target.getMonth() + 1).padStart(2, '0');
      const dd = String(target.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function serializeCardToSheetRow(card, index) {
      const scheduledDays = getCardScheduledDays(card.id);
      const isScheduled = scheduledDays.length > 0;
      let hoursCol = card.businessHours || '';
      let mustBuyCol = card.mustBuy || '';
      if (isTransportOrAirport(card.category)) {
        const prefix = card.category === '機場' ? '✈️ ' : '🚆 ';
        if (card.departTime || card.arriveTime) {
          hoursCol = `${prefix}${card.departTime || ''}${card.arriveTime ? ' ~ ' + card.arriveTime : ''}`.trim();
        }
        if (card.flightNo) mustBuyCol = card.flightNo;
      } else if (card.category === '住宿') {
        if (card.checkInOut) hoursCol = card.checkInOut;
        if (card.bookingRef) mustBuyCol = card.bookingRef;
      }

      const cleanDist = cleanDistrictString(card.district, card.country);
      const areaFormatted = cleanDist.startsWith(card.country) ? cleanDist : `${card.country}・${cleanDist}`;

      return {
        id: card.id,
        name: card.title,
        category: card.category,
        area: areaFormatted,
        description: card.notes || '',
        must_buy: mustBuyCol,
        business_hours: hoursCol,
        estimated_duration: card.duration || 60,
        parking_info: card.parkingInfo || '',
        source_url: card.mapUrl || '',
        photo_url: card.image || '',
        status: isScheduled ? 'scheduled' : 'pocket',
        assigned_day: isScheduled ? scheduledDays.map(d => dayNumToIsoDate(d)).join(',') : 'pocket',
        sort_order: index + 1,
        lat: card.lat ?? '',
        lng: card.lng ?? ''
      };
    }

    async function fetchGasEndpoint(baseUrl, querySuffix = '') {
      const sep = baseUrl.includes('?') ? '&' : '?';
      const cacheBust = `_t=${Date.now()}`;
      const targetUrl = querySuffix ? `${baseUrl}${sep}${querySuffix}&${cacheBust}` : `${baseUrl}${sep}${cacheBust}`;
      const res = await fetch(targetUrl, { method: 'GET', redirect: 'follow', cache: 'no-store' });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        return null;
      }
    }

    async function pullFromGoogleSheets(showNotification = true) {
      if (!state.settings.gasUrl) {
        if (showNotification) showToast('請先點右上角齒輪填入 Google Apps Script 網址', 'amber');
        return;
      }
      const icon = document.getElementById('syncIcon');
      const label = document.getElementById('syncBtnLabel');
      icon.classList.add('fa-spin');
      label.textContent = '載入中...';
      setSyncPillStatus('syncing', '正在從試算表載入...');

      try {
        const candidateQueries = ['', 'sheet=Spots', 'action=getSpots', 'action=read&sheet=Spots'];
        let rows = [];

        for (const q of candidateQueries) {
          const json = await fetchGasEndpoint(state.settings.gasUrl, q);
          const extracted = extractRowsFromGasPayload(json).filter(r => r && (r.name || r.title));
          if (extracted.length > 0) {
            rows = extracted;
            break;
          }
        }

        if (rows.length > 0) {
          const mappedCards = rows
            .map((r, idx) => normalizeSheetRowToCard(r, idx))
            .filter(c => !state.deletedIds.includes(c.id));

          state.cards = mappedCards;

          ensureItineraryDays();
          const rebuilt = {};
          const totalDays = Number(state.settings.totalDays) || 6;
          for (let d = 1; d <= totalDays; d++) {
            rebuilt[d] = { startTime: state.itinerary[d]?.startTime || '09:00', items: [] };
          }

          mappedCards
            .slice()
            .sort((a, b) => a.sortOrder - b.sortOrder)
            .forEach(c => {
              const dayNums = resolveAssignedDayNumbers(c.assignedDayRaw);
              dayNums.forEach((dayNum, dIdx) => {
                if (rebuilt[dayNum]) {
                  rebuilt[dayNum].items.push({
                    uid: `it_${c.id}_${dayNum}`,
                    cardId: c.id,
                    customNote: c.businessHours || '',
                    isCheckout: c.category === '住宿' && dIdx > 0,
                    transitMode: 'transit',
                    transitMin: 0
                  });
                }
              });
            });

          const hasSheetSchedule = Object.values(rebuilt).some(d => d.items.length > 0);
          if (hasSheetSchedule) {
            state.itinerary = rebuilt;
          }

          persistState(false);
          populateRegionDropdowns();
          renderAll();
          const nowStr = new Date().toTimeString().slice(0, 5);
          setSyncPillStatus('ok', `已載入 ${mappedCards.length} 筆 (${nowStr})`);
          if (showNotification) {
            showToast(`已成功從 Google 試算表載入 ${mappedCards.length} 筆資料！`, 'emerald');
          }
        } else {
          setSyncPillStatus('warning', '試算表無資料列');
          if (showNotification) {
            showToast('試算表無資料列，請確認 GAS 腳本是否讀取「Spots」工作表', 'amber');
          }
        }
      } catch (err) {
        console.error('GAS GET Error:', err);
        setSyncPillStatus('warning', '讀取試算表失敗');
        if (showNotification) {
          showToast('讀取試算表失敗，請確認 GAS 部署權限為「所有人」', 'amber');
        }
      } finally {
        icon.classList.remove('fa-spin');
        label.textContent = '重新載入';
      }
    }

    async function pushAllToGoogleSheets(isSilentAuto = false, extraDeletedId = null) {
      persistState(false);
      if (!state.settings.gasUrl) {
        if (!isSilentAuto) showToast('已儲存至本機；如需寫入試算表請點齒輪設定 GAS 網址', 'blue');
        return;
      }

      const pushIcon = document.getElementById('pushIcon');
      if (pushIcon) pushIcon.classList.add('fa-bounce');
      setSyncPillStatus('syncing', '正在覆蓋寫入試算表...');

      try {
        const sheetRows = state.cards.map((c, idx) => serializeCardToSheetRow(c, idx));

        if (extraDeletedId) {
          try {
            await fetch(state.settings.gasUrl, {
              method: 'POST',
              redirect: 'follow',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'deleteSpot',
                sheet: 'Spots',
                id: extraDeletedId
              })
            });
          } catch (e) {}
        }

        const res = await fetch(state.settings.gasUrl, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'syncAll',
            mode: 'overwrite',
            clearRemaining: true,
            sheet: 'Spots',
            deletedIds: state.deletedIds,
            data: sheetRows,
            spots: sheetRows,
            cards: sheetRows,
            itinerary: state.itinerary
          })
        });
        const respText = await res.text();
        let respJson = null;
        try { respJson = JSON.parse(respText); } catch (e) {}

        if (respJson && respJson.status === 'error') {
          throw new Error(respJson.message || 'GAS 寫入回傳錯誤');
        }

        const nowStr = new Date().toTimeString().slice(0, 5);
        setSyncPillStatus('ok', `已寫入試算表 ${sheetRows.length} 筆 (${nowStr})`);
        if (!isSilentAuto) {
          showToast(`已將最新 ${sheetRows.length} 筆資料完整寫入 Google 試算表！`, 'emerald');
        }
      } catch (err) {
        console.error('GAS POST Error:', err);
        setSyncPillStatus('warning', '試算表寫入異常（請點齒輪檢查GAS）');
        if (!isSilentAuto) {
          showToast('寫入試算表異常，請點右上角齒輪檢查 GAS 覆蓋寫入程式碼', 'amber');
        }
      } finally {
        if (pushIcon) pushIcon.classList.remove('fa-bounce');
      }
    }

    function getCardScheduledDays(cardId) {
      const days = [];
      const total = Number(state.settings.totalDays) || 6;
      for (let d = 1; d <= total; d++) {
        const items = state.itinerary[d]?.items || [];
        if (items.some(it => it.cardId === cardId)) {

    function getFilteredAndSortedCards() {
      const kw = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const countryVal = document.getElementById('countryFilter')?.value || 'all';
      const cityVal = document.getElementById('cityFilter')?.value || 'all';
      const sortBy = document.getElementById('sortSelect')?.value || 'newest';

      let list = state.cards.filter(card => {
        const isDomestic = (card.country || '').includes('台') || (card.country || '').includes('臺');
        if (state.filters.scope === 'domestic' && !isDomestic) return false;
        if (state.filters.scope === 'international' && isDomestic) return false;

        if (countryVal !== 'all' && (card.country || '未分類') !== countryVal) return false;
        if (cityVal !== 'all' && (card.district || '未分類') !== cityVal) return false;
        if (state.filters.category !== 'all' && card.category !== state.filters.category) return false;

        const scheduledDays = getCardScheduledDays(card.id);
        if (state.filters.status === 'unscheduled' && scheduledDays.length > 0) return false;
        if (state.filters.status === 'scheduled' && scheduledDays.length === 0) return false;
        if (state.filters.status === 'starred' && !card.starred) return false;

        if (kw) {
          const hay = `${card.title} ${card.district} ${card.country} ${card.notes} ${card.mustBuy || ''} ${card.flightNo || ''} ${card.businessHours || ''} ${card.category}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      list = [...list];
      if (sortBy === 'newest') {
        list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else if (sortBy === 'unscheduled') {
        list.sort((a, b) => {
          const sa = getCardScheduledDays(a.id).length;
          const sb = getCardScheduledDays(b.id).length;
          if (sa !== sb) return sa - sb;
          return (b.createdAt || 0) - (a.createdAt || 0);
        });
      } else if (sortBy === 'district') {
        list.sort((a, b) => (a.district || 'zzz').localeCompare(b.district || 'zzz', 'zh-Hant'));
      }
      return list;
    }

    // 7. 地理編碼與座標反查
    function parseNominatimAddress(addr = {}) {
      let country = addr.country || '日本';
      if (country.includes('臺灣') || country.includes('台灣') || addr.country_code === 'tw') country = '台灣';
      if (addr.country_code === 'jp' || country.includes('日本')) country = '日本';

      const pref = addr.state || addr.province || addr.county || '';
      const city = addr.city || addr.town || addr.village || addr.municipality || addr.suburb || '';
      const district = [pref, city].filter(Boolean).join('・') || country;
      return { country, district };
    }

    async function geocodePlaceName(query, countryHint = '') {
      const cleaned = String(query).replace(/[\(（][^\)）]*[\)）]/g, '').trim();
      const queriesToTry = [
        countryHint ? `${countryHint} ${cleaned}` : cleaned,
        cleaned,
        query
      ].filter((v, i, arr) => v && arr.indexOf(v) === i);

      for (const q of queriesToTry) {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=${encodeURIComponent(q)}`;
          const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW,ja,en' } });
          const data = await res.json();
          if (data && data.length > 0) {
            const item = data[0];
            const { country, district } = parseNominatimAddress(item.address);
            return { lat: parseFloat(item.lat), lng: parseFloat(item.lon), country, district };
          }
        } catch (e) {}
      }
      return null;
    }

    async function reverseGeocodeCoords(lat, lng) {
      if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return null;
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lng}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW,ja,en' } });
        const data = await res.json();
        if (data && data.address) {
          return parseNominatimAddress(data.address);
        }
      } catch (e) {}
      return null;
    }

    function extractCoordsFromText(text) {
      if (!text) return null;
      const atMatch = text.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
      if (atMatch) return { lat: parseFloat(atMatch[1]), lng: parseFloat(atMatch[2]) };

      const d34Match = text.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
      if (d34Match) return { lat: parseFloat(d34Match[1]), lng: parseFloat(d34Match[2]) };

      const pairMatch = text.match(/(-?\d{1,3}\.\d{3,})\s*[,，\s]\s*(-?\d{1,3}\.\d{3,})/);
      if (pairMatch) return { lat: parseFloat(pairMatch[1]), lng: parseFloat(pairMatch[2]) };

      return null;
    }

    function extractTitleFromInputLine(line) {
      let clean = line.trim();
      if (!clean) return '';
      if (clean.startsWith('http')) {
        try {
          const u = new URL(clean);
          const q = u.searchParams.get('q') || u.searchParams.get('query');
          if (q && !/^-?\d+\.\d+,/.test(q)) return decodeURIComponent(q).replace(/\+/g, ' ');
          const placeMatch = u.pathname.match(/\/place\/([^/]+)/);
          if (placeMatch && placeMatch[1]) {
            return decodeURIComponent(placeMatch[1]).replace(/\+/g, ' ');
          }
        } catch (e) {}
      }
      return clean;
    }

    async function handleBatchImport() {
      const raw = document.getElementById('batchInputText').value;
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) {
        showToast('請先輸入地點名稱或貼上 Google Maps 網址（一行一筆）', 'amber');
        return;
      }

      const btn = document.getElementById('btnBatchImport');
      const defaultCat = document.getElementById('batchDefaultCategory').value;
      const autoGeo = document.getElementById('batchAutoGeocode').checked;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>定位入庫中 (${lines.length})...</span>`;

      let addedCount = 0;
      const nowBase = Date.now();

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const isUrl = line.startsWith('http');
        const urlCoords = extractCoordsFromText(line);
        const title = extractTitleFromInputLine(line);
        let geo = null;

        if (urlCoords) {
          const rev = await reverseGeocodeCoords(urlCoords.lat, urlCoords.lng);
          geo = {
            lat: urlCoords.lat,
            lng: urlCoords.lng,
            country: rev ? rev.country : '日本',
            district: rev ? rev.district : '沖繩縣・待確認行政區'
          };
        } else if (autoGeo && title && !title.startsWith('http')) {
          geo = await geocodePlaceName(title);
        }

        const newCard = {
          id: 'spot_' + (nowBase + i),
          title,
          category: defaultCat,
          country: geo ? geo.country : '日本',
          district: geo ? geo.district : '沖繩縣・待確認行政區',
          duration: defaultCat === '購物' ? 90 : 60,
          lat: geo ? geo.lat : null,
          lng: geo ? geo.lng : null,
          mapUrl: isUrl ? line : '',
          notes: '',
          mustBuy: '',
          businessHours: '',
          parkingInfo: '',
          departTime: '',
          arriveTime: '',
          flightNo: '',
          checkInOut: '',
          bookingRef: '',
          starred: false,
          createdAt: nowBase + (lines.length - i),
          isNew: true
        };

        state.cards.unshift(newCard);
        addedCount++;
      }

      document.getElementById('batchInputText').value = '';
      document.getElementById('sortSelect').value = 'newest';
      persistState(true);
      populateRegionDropdowns();
      renderAll();
      document.getElementById('databaseCardsContainer').scrollTop = 0;

      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-magnifying-glass-location"></i> <span>批次定位並置頂入庫</span>`;
      showToast(`已成功新增 ${addedCount} 筆卡片並自動同步至試算表！`, 'emerald');
    }

    async function batchUpdateAllDistricts() {
      const targets = state.cards.filter(c => (!c.district || c.district.includes('待確認') || c.district === '未分類'));
      if (targets.length === 0) {
        showToast('所有卡片皆已有行政區資訊！', 'blue');
        return;
      }
      showToast(`正在為 ${targets.length} 筆卡片依座標／名稱補齊行政區...`, 'blue');
      for (const card of targets) {
        if (Number.isFinite(Number(card.lat)) && Number.isFinite(Number(card.lng)) && Number(card.lat) !== 0) {
          const rev = await reverseGeocodeCoords(card.lat, card.lng);
          if (rev) {
            card.country = rev.country;
            card.district = rev.district;
            continue;
          }
        }
        if (card.title) {
          const geo = await geocodePlaceName(card.title, card.country);
          if (geo) {
            card.lat = card.lat || geo.lat;
            card.lng = card.lng || geo.lng;
            card.country = geo.country;
            card.district = geo.district;
          }
        }
      }
      persistState(true);
      populateRegionDropdowns();
      renderAll();
      showToast('行政區與座標補齊完成，已自動寫入試算表！', 'emerald');
    }
