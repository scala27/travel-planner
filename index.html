<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2B4C7E" />
  <title>沖繩旅圖｜個人卡片式旅遊規劃 PWA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS (流暢支援手機觸控與電腦拖曳) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <!-- Leaflet CSS & JS (互動地圖與多層次路網繪製) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 日式極簡「清透韌性」配色
            'washi-bg': '#F6F7F9',
            'washi-card': '#FFFFFF',
            'ai-indigo': '#2B4C7E',
            'ai-slate': '#567EBB',
            'moss-green': '#4A7C59',
            'sand-ochre': '#D98A3C',
            'ink-dark': '#1E293B',
            'ink-muted': '#64748B'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: #F6F7F9;
      color: #1E293B;
    }
    ::-webkit-scrollbar { width: 7px; height: 9px; }
    ::-webkit-scrollbar-track { background: #E2E8F0; border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748B; }
    
    .sortable-ghost { opacity: 0.45; background: #E2E8F0 !important; border: 2px dashed #567EBB !important; }
    .sortable-drag { transform: rotate(2deg); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .resizer-active { background-color: #2B4C7E !important; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none sm:select-auto">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2 flex items-center justify-between shrink-0 z-20 shadow-xs gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-ai-indigo text-white flex items-center justify-center shadow-xs shrink-0">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <div class="min-w-0">
        <h1 id="header-trip-title" class="font-bold text-sm sm:text-base text-ink-dark leading-tight truncate">2027沖繩首發自由行</h1>
        <p id="header-trip-dates" class="text-[11px] text-ink-muted truncate">2027-02-17 ~ 2027-02-22 (6天5夜)</p>
      </div>
    </div>

    <!-- 版面檢視控制列 -->
    <div class="hidden lg:flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200/80">
      <button onclick="toggleLeftPanel()" id="btn-toggle-left"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-ai-indigo shadow-2xs transition"
        title="顯示或隱藏左側口袋資料庫">
        <i data-lucide="panel-left-close" class="w-3.5 h-3.5"></i>
        <span>隱藏資料庫</span>
      </button>
      <button onclick="toggleRightPanel()" id="btn-toggle-right"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white text-ai-indigo shadow-2xs transition"
        title="顯示或隱藏右側地圖">
        <i data-lucide="panel-right-close" class="w-3.5 h-3.5"></i>
        <span>隱藏地圖</span>
      </button>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <span id="sync-status-badge" class="hidden xl:inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
        <span class="w-2 h-2 rounded-full bg-amber-500" id="sync-dot"></span>
        <span id="sync-text">本機模式</span>
      </span>
      <button onclick="openModal('modal-settings')" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition" title="系統與後端設定">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
      <button onclick="syncFromCloud()" id="btn-sync-cloud" class="flex items-center gap-1.5 bg-ai-indigo hover:bg-slate-800 text-white text-xs sm:text-sm font-medium px-3 py-2 rounded-lg transition shadow-xs">
        <span id="sync-icon-wrap" class="inline-flex items-center">
          <i data-lucide="cloud" class="w-4 h-4"></i>
        </span>
        <span class="hidden sm:inline" id="sync-btn-label">同步資料</span>
      </button>
    </div>
  </header>

  <!-- 手機版分頁切換器 -->
  <div class="flex lg:hidden bg-white border-b border-slate-200 text-sm font-medium shrink-0">
    <button onclick="switchMobileTab('pocket')" id="tab-pocket" class="flex-1 py-2.5 text-center border-b-2 border-ai-indigo text-ai-indigo">
      景點資料庫 (<span id="mobile-pocket-count">0</span>)
    </button>
    <button onclick="switchMobileTab('itinerary')" id="tab-itinerary" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500">
      每日行程看板
    </button>
    <button onclick="switchMobileTab('map')" id="tab-map" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500">
      互動地圖
    </button>
  </div>

  <!-- 主工作區：三欄式可調整佈局 -->
  <main class="flex-1 flex overflow-hidden relative" id="main-workspace">

    <!-- ==================== 左欄：永久口袋資料庫與免金鑰快速建卡區 ==================== -->
    <section id="panel-pocket" class="w-full lg:w-[345px] xl:w-[370px] bg-white border-r border-slate-200 flex flex-col shrink-0 h-full transition-all duration-200">
      <div class="p-3 bg-slate-50 border-b border-slate-200 space-y-2 shrink-0">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-ai-indigo flex items-center gap-1">
            <i data-lucide="database" class="w-3.5 h-3.5"></i> 口袋資料庫建卡
          </span>
          <div class="flex items-center gap-1.5">
            <button onclick="openNewCardModal()" class="text-xs bg-white border border-slate-300 text-slate-700 hover:border-ai-indigo hover:text-ai-indigo font-medium flex items-center gap-0.5 px-2 py-0.5 rounded-md shadow-2xs">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 詳細新增
            </button>
            <button onclick="toggleInboxDrawer()" id="btn-toggle-inbox" class="text-slate-400 hover:text-slate-700 p-0.5 rounded" title="收合/展開輸入框">
              <i data-lucide="chevron-up" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div id="inbox-collapsible-body" class="space-y-2">
          <div class="grid grid-cols-2 gap-1.5">
            <select id="quick-category" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 text-slate-700">
              <option value="景點">🏞️ 類別：景點</option>
              <option value="美食">🍜 類別：美食</option>
              <option value="購物">🛍️ 類別：購物</option>
              <option value="住宿">🏨 類別：住宿</option>
              <option value="交通">🚉 類別：交通</option>
            </select>
            <select id="quick-area" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 text-slate-700">
              <option value="那霸市區">📍 區域：那霸市區</option>
              <option value="中部">📍 區域：中部</option>
              <option value="北部">📍 區域：北部</option>
              <option value="南部">📍 區域：南部</option>
            </select>
          </div>

          <textarea id="quick-batch-input" rows="2"
            placeholder="貼上 Google Maps 連結，或一次輸入多行地點（一行一筆，自動定位入庫）..." 
            class="w-full text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-ai-indigo resize-none leading-relaxed"></textarea>

          <button onclick="handleQuickBatchAdd()" id="btn-quick-add"
            class="w-full bg-ai-indigo hover:bg-slate-800 text-white text-xs font-medium px-3 py-1.5 rounded-lg flex items-center justify-center gap-1.5 transition shadow-2xs">
            <i data-lucide="map-pin-plus" class="w-3.5 h-3.5"></i>
            <span>批次自動定位並加入資料庫</span>
          </button>
        </div>
      </div>

      <!-- 篩選列 -->
      <div class="px-3 py-2 border-b border-slate-100 space-y-1.5 shrink-0">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5"></i>
          <input type="text" id="search-input" oninput="renderAll()" placeholder="搜尋資料庫景點、車站、飯店、必買..." 
            class="w-full text-xs bg-slate-100 rounded-lg pl-8 pr-3 py-1.5 focus:outline-none focus:bg-white focus:ring-1 focus:ring-ai-indigo" />
        </div>

        <div class="flex gap-1 overflow-x-auto pb-0.5" id="category-filters">
          <button onclick="setFilterCategory('全部')" class="cat-btn active px-2 py-0.5 rounded-full text-[11px] font-medium bg-ai-indigo text-white shrink-0">全部</button>
          <button onclick="setFilterCategory('景點')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🏞️ 景點</button>
          <button onclick="setFilterCategory('美食')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🍜 美食</button>
          <button onclick="setFilterCategory('購物')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🛍️ 購物</button>
          <button onclick="setFilterCategory('住宿')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🏨 住宿</button>
          <button onclick="setFilterCategory('交通')" class="cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">🚉 交通</button>
        </div>

        <div class="flex items-center justify-between gap-1 text-[11px]" id="status-filters">
          <div class="flex gap-1 overflow-x-auto">
            <button onclick="setFilterDbStatus('all')" class="db-status-btn px-2 py-0.5 rounded bg-slate-800 text-white font-medium shrink-0">全部資料庫</button>
            <button onclick="setFilterDbStatus('unscheduled')" class="db-status-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">未排入</button>
            <button onclick="setFilterDbStatus('scheduled')" class="db-status-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">✅ 已納入</button>
            <button onclick="setFilterDbStatus('revisit')" class="db-status-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">⭐ 值得二訪</button>
          </div>
        </div>

        <div class="flex gap-1 overflow-x-auto text-[11px]" id="area-filters">
          <button onclick="setFilterArea('全部')" class="area-btn px-2 py-0.5 rounded bg-slate-200 text-slate-800 font-medium shrink-0">全沖繩</button>
          <button onclick="setFilterArea('那霸市區')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">那霸市區</button>
          <button onclick="setFilterArea('中部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">中部</button>
          <button onclick="setFilterArea('北部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">北部</button>
          <button onclick="setFilterArea('南部')" class="area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0">南部</button>
        </div>
      </div>

      <!-- 永久資料庫卡片列表區 -->
      <div class="flex-1 overflow-y-auto p-2.5 space-y-2.5 bg-slate-50/50" id="pocket-dropzone" data-day="pocket"></div>
    </section>

    <!-- ==================== 中欄：每日行程看板 (Kanban) ==================== -->
    <section id="panel-itinerary" class="hidden lg:flex flex-1 min-w-[320px] flex-col bg-washi-bg overflow-hidden h-full">
      <div class="px-3 py-2 bg-white border-b border-slate-200 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-1 overflow-x-auto py-0.5" id="kanban-day-nav-bar"></div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="toggleBoardCompactMode()" id="btn-board-density"
            class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium flex items-center gap-1 transition"
            title="切換行程卡片為精簡列表或完整圖文模式">
            <i data-lucide="list" class="w-3.5 h-3.5 text-ai-indigo"></i>
            <span>精簡檢視</span>
          </button>

          <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
            <button onclick="scrollKanbanBy(-300)" class="p-1.5 text-slate-600 hover:bg-slate-200 transition" title="向左捲動檢視前幾天">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button onclick="scrollKanbanBy(300)" class="p-1.5 text-slate-600 hover:bg-slate-200 border-l border-slate-200 transition" title="向右捲動檢視後面幾天">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <button onclick="saveBoardOrderToCloud()" class="text-xs bg-moss-green hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg font-medium flex items-center gap-1 transition shadow-xs">
            <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">儲存排程</span>
          </button>
        </div>
      </div>

      <div id="days-kanban-container" class="flex-1 flex gap-3 p-3.5 overflow-x-auto overflow-y-hidden items-start scroll-smooth"></div>
    </section>

    <!-- ==================== 可拖曳寬度調整分隔線 (中欄 <-> 右欄) ==================== -->
    <div id="mid-right-resizer"
      class="hidden lg:flex w-2 bg-slate-200/80 hover:bg-ai-slate cursor-col-resize items-center justify-center shrink-0 transition-colors z-20 group"
      title="左右拖曳調整行程看板與地圖寬度比例">
      <div class="w-0.5 h-8 bg-slate-400 group-hover:bg-white rounded-full"></div>
    </div>

    <!-- ==================== 右欄：多層次交通路網互動地圖 ==================== -->
    <section id="panel-map" style="width: 410px;" class="hidden lg:flex w-full bg-white flex-col shrink-0 h-full">
      <div class="p-2.5 border-b border-slate-200 bg-slate-50 shrink-0 space-y-2">
        <div class="flex items-center justify-between gap-1.5">
          <select id="map-day-selector" onchange="updateMapMarkers()" class="flex-1 text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5 font-medium text-ink-dark focus:outline-none">
            <option value="all">顯示全部資料庫地點</option>
            <option value="scheduled_all">僅顯示已納入行程地點</option>
          </select>

          <select id="map-travel-mode" onchange="handleGlobalModeChange()" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5 font-medium text-ai-indigo focus:outline-none" title="切換當日預設交通策略（下方各路段仍可單獨微調）">
            <option value="hybrid">🔀 多層次混搭 (推薦)</option>
            <option value="transit">🚝 大眾運輸優先</option>
            <option value="driving">🚗 全程自駕</option>
            <option value="walking">🚶 全程步行</option>
          </select>
        </div>

        <div id="map-route-summary" class="hidden flex-col bg-white border border-slate-200 rounded-lg px-2.5 py-2 text-[11px] space-y-1.5 shadow-2xs">
          <div class="flex items-center justify-between gap-2">
            <span id="map-route-metrics" class="text-slate-800 font-bold truncate">計算多層次路網中...</span>
            <button type="button" onclick="resetDaySegmentOverrides()" id="btn-reset-leg-modes" class="hidden text-[10px] text-slate-500 hover:text-ai-indigo underline shrink-0">
              重設分段
            </button>
          </div>
          <div id="map-segment-breakdown" class="max-h-36 overflow-y-auto space-y-1.5 pt-1 border-t border-slate-100 text-[10px] text-slate-700"></div>
        </div>
      </div>

      <div class="px-3 py-1.5 bg-white border-b border-slate-100 flex items-center justify-between text-[11px] text-slate-600 shrink-0">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#10B981;"></span>景點</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#F59E0B;"></span>美食</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#6366F1;"></span>購物</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#7E22CE;"></span>住宿</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#0284C7;"></span>交通</span>
      </div>

      <div id="okinawa-map" class="flex-1 w-full z-10"></div>
    </section>

  </main>

  <!-- ==================== 視窗 1：卡片詳細資訊與編輯 Modal ==================== -->
  <div id="modal-card-detail" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-base text-ink-dark" id="modal-card-title">資料庫卡片詳情</h3>
        <button onclick="closeModal('modal-card-detail')" class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="card-form" onsubmit="handleSaveCard(event)" class="p-5 overflow-y-auto space-y-3.5 text-sm">
        <input type="hidden" id="field-id" />
        
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-xs font-medium text-slate-600 mb-1">地點 / 店家 / 飯店 / 車站名稱 *</label>
            <input type="text" id="field-name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:border-ai-indigo focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">分類</label>
            <select id="field-category" onchange="toggleMultiDayStayUI()" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="景點">🏞️ 景點</option>
              <option value="美食">🍜 美食</option>
              <option value="購物">🛍️ 購物</option>
              <option value="住宿">🏨 住宿</option>
              <option value="交通">🚉 交通</option>
            </select>
          </div>
        </div>

        <label class="flex items-center justify-between bg-amber-50/80 border border-amber-200 rounded-xl px-3.5 py-2.5 cursor-pointer select-none">
          <div class="flex items-center gap-2">
            <span class="text-base">⭐</span>
            <div>
              <div class="text-xs font-bold text-amber-950">標記為「值得二訪 / 精選推薦」</div>
              <div class="text-[11px] text-amber-800/80">玩過覺得很棒或下次沖繩旅遊想再次安排的口袋愛店</div>
            </div>
          </div>
          <input type="checkbox" id="field-revisit" class="w-4 h-4 accent-amber-500 rounded" />
        </label>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">沖繩區域</label>
            <select id="field-area" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">
              <option value="那霸市區">那霸市區</option>
              <option value="中部">中部(浦添/北谷)</option>
              <option value="北部">北部(本部/名護)</option>
              <option value="南部">南部(糸滿/南城)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">預計停留(分)</label>
            <input type="number" id="field-duration" value="60" min="0" step="5" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <div id="single-day-select-wrap">
            <label class="block text-xs font-medium text-slate-600 mb-1">納入本次行程</label>
            <select id="field-day" class="w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white">

    function initResizer() {
      const resizer = document.getElementById('mid-right-resizer');
      const mapPanel = document.getElementById('panel-map');
      const workspace = document.getElementById('main-workspace');
      if (!resizer || !mapPanel) return;

      let isResizing = false;

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('resizer-active');
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const rect = workspace.getBoundingClientRect();
        const newMapWidth = rect.right - e.clientX;
        const minMapWidth = 270;
        const maxMapWidth = rect.width * 0.65;

        if (newMapWidth >= minMapWidth && newMapWidth <= maxMapWidth) {
          uiState.mapWidthPx = newMapWidth;
          mapPanel.style.width = `${newMapWidth}px`;
          if (mapInstance) mapInstance.invalidateSize();
        }
      });

      window.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('resizer-active');
          document.body.style.cursor = '';
          if (mapInstance) mapInstance.invalidateSize();
        }
      });
    }

    // ==================== 多時段排程解析與輔助工具（支援同一天多次出現，如飯店出發＋返回飯店） ====================
    function isSpotRevisit(spot) {
      return String(spot.status || '').includes('revisit');
    }

    /**
     * 解析卡片的所有排程出現紀錄：
     * 例如 assigned_day = "2027-02-17,2027-02-18,2027-02-18" 且 sort_order = "1,1,6"
     * 回傳 [{ dateStr: '2027-02-17', order: 1 }, { dateStr: '2027-02-18', order: 1 }, { dateStr: '2027-02-18', order: 6 }]
     */
    function getSpotOccurrences(spot) {
      const rawDays = String(spot.assigned_day || 'pocket').trim();
      if (!rawDays || rawDays === 'pocket') return [];
      const daysArr = rawDays.split(',').map(d => d.trim()).filter(Boolean);
      const rawOrders = String(spot.sort_order || '99').split(',').map(o => Number(o.trim()) || 99);
      return daysArr.map((dateStr, idx) => ({
        dateStr,
        order: rawOrders[idx] !== undefined ? rawOrders[idx] : (rawOrders[0] || 99)
      }));
    }

    function getSpotAssignedDays(spot) {
      return getSpotOccurrences(spot).map(o => o.dateStr);
    }

    function getSpotUniqueDays(spot) {
      return [...new Set(getSpotAssignedDays(spot))];
    }

    /**
     * 取得指定日期的所有行程項目（含同一天出現多次的卡片，依 sort_order 排序）
     */
    function getDayItems(dateStr) {
      const items = [];
      spots.forEach(spot => {
        const occs = getSpotOccurrences(spot);
        let dayOccCounter = 0;
        occs.forEach((occ, globalOccIdx) => {
          if (occ.dateStr === dateStr) {
            dayOccCounter++;
            items.push({
              spot,
              order: occ.order,
              globalOccIdx,
              dayOccNum: dayOccCounter // 1 = 當日第1次出現（如出發）, 2 = 當日第2次出現（如回程）
            });
          }
        });
      });
      items.sort((a, b) => a.order - b.order);
      // 標記同一天內總共出現幾次
      const countBySpot = {};
      items.forEach(it => { countBySpot[it.spot.id] = (countBySpot[it.spot.id] || 0) + 1; });
      items.forEach(it => { it.totalDayOccs = countBySpot[it.spot.id]; });
      return items;
    }

    function getDateRangeArray(startStr, endStr) {
      const list = [];
      let curr = new Date(startStr + 'T00:00:00');
      const end = new Date(endStr + 'T00:00:00');
      const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
      let idx = 1;
      while (curr <= end && idx <= 14) {
        const yyyy = curr.getFullYear();
        const mm = String(curr.getMonth() + 1).padStart(2, '0');
        const dd = String(curr.getDate()).padStart(2, '0');
        list.push({
          dateStr: `${yyyy}-${mm}-${dd}`,
          label: `Day ${idx}`,
          shortDate: `${mm}/${dd} (週${weekNames[curr.getDay()]})`
        });
        curr.setDate(curr.getDate() + 1);
        idx++;
      }
      return list;
    }

    // ==================== 一鍵匯入沖繩單軌與主要轉運站 ====================
    async function importOkinawaPresetStations() {
      const existingNames = new Set(spots.map(s => s.name.trim()));
      const toAdd = PRESET_OKINAWA_STATIONS.filter(st => !existingNames.has(st.name.trim())).map((st, idx) => ({
        ...st,
        id: 'spot_hub_' + Date.now() + '_' + idx,
        parking_info: '',
        source_url: '',
        photo_url: '',
        status: 'pocket',
        assigned_day: 'pocket',
        sort_order: String(10 + idx)
      }));

      if (toAdd.length === 0) {
        showToast('沖繩單軌與主要轉運站已全數在資料庫中！');
        return;
      }

      toAdd.reverse().forEach(s => spots.unshift(s));
      saveLocalState();
      renderAll();
      showToast(`🚉 已匯入 ${toAdd.length} 個沖繩單軌/公車轉運站至資料庫！`);

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'import_preset_spots', spots: toAdd })
        }).catch(err => console.error('車站背景同步失敗', err));
      }
    }

    function toggleSpotRevisit(spotId) {
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;

      const currentlyRevisit = isSpotRevisit(spot);
      const assigned = getSpotAssignedDays(spot);
      const base = assigned.length > 0 ? 'scheduled' : 'pocket';
      spot.status = !currentlyRevisit ? `${base}|revisit` : base;

      saveLocalState();
      renderAll();
      showToast(!currentlyRevisit ? `⭐ 已將「${spot.name}」標記為值得二訪！` : `已取消「${spot.name}」的二訪標記`);

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'update_spot', spot })
        }).catch(err => console.error('二訪狀態同步失敗', err));
      }
    }

    /**
     * 從某一天移除指定那一筆出現紀錄（若同一天有排「出發」與「回程」，只會移除點選的那一筆）
     */
    function removeSpotOccurrenceFromDay(spotId, targetDateStr, globalOccIdx) {
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;

      const occs = getSpotOccurrences(spot);
      if (globalOccIdx !== undefined && occs[globalOccIdx] && occs[globalOccIdx].dateStr === targetDateStr) {
        occs.splice(globalOccIdx, 1);
      } else {
        const idx = occs.findIndex(o => o.dateStr === targetDateStr);
        if (idx > -1) occs.splice(idx, 1);
      }

      const rev = isSpotRevisit(spot);
      spot.assigned_day = occs.length > 0 ? occs.map(o => o.dateStr).join(',') : 'pocket';
      spot.sort_order = occs.length > 0 ? occs.map(o => o.order).join(',') : '99';
      spot.status = occs.length > 0 ? (rev ? 'scheduled|revisit' : 'scheduled') : (rev ? 'pocket|revisit' : 'pocket');

      saveLocalState();
      renderAll();
      showToast(`已將「${spot.name}」移出該時段（仍保留於左側資料庫）`);

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'sync_board',
            updates: [{ id: spot.id, assigned_day: spot.assigned_day, sort_order: spot.sort_order, is_revisit: rev }]
          })
        }).catch(err => console.error('背景同步失敗', err));
      }
    }

    /**
     * 一鍵將飯店或交通站加入「當日回程終點」（排在當日最後一筆）
     */
    function appendReturnStopToDay(spotId, dateStr) {
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;

      const dayItems = getDayItems(dateStr);
      const maxOrder = dayItems.reduce((m, it) => Math.max(m, it.order), 0);
      const occs = getSpotOccurrences(spot);
      occs.push({ dateStr, order: maxOrder + 1 });
      occs.sort((a, b) => a.dateStr.localeCompare(b.dateStr) || a.order - b.order);

      const rev = isSpotRevisit(spot);
      spot.assigned_day = occs.map(o => o.dateStr).join(',');
      spot.sort_order = occs.map(o => o.order).join(',');
      spot.status = rev ? 'scheduled|revisit' : 'scheduled';

      saveLocalState();
      renderAll();
      showToast(`↩️ 已將「${spot.name}」加入當日最後一站（返回飯店/車站）！`);

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'sync_board',
            updates: [{ id: spot.id, assigned_day: spot.assigned_day, sort_order: spot.sort_order, is_revisit: rev }]
          })
        }).catch(err => console.error('背景同步失敗', err));
      }
    }

    // ==================== 免 AI 金鑰快速批次建卡 ====================
    async function handleQuickBatchAdd() {
      const inputEl = document.getElementById('quick-batch-input');
      const rawText = inputEl.value.trim();
      const category = document.getElementById('quick-category').value;
      const area = document.getElementById('quick-area').value;

      if (!rawText) {
        showToast('請輸入地點名稱（可一次輸入多行）或貼上 Google Maps 連結！');
        return;
      }

      if (!appConfig.gasUrl) {
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        lines.reverse().forEach((line, idx) => {
          const isTransport = /空港|機場|車站|單軌|港口|碼頭|租車|駅/i.test(line);
          const resolvedCat = isTransport ? '交通' : category;
          spots.unshift({
            id: 'spot_' + Date.now() + '_' + idx,
            name: line,
            category: resolvedCat,
            area: area,
            description: '',
            must_buy: '',
            business_hours: resolvedCat === '住宿' ? '15:00入住 / 11:00退房' : '',
            estimated_duration: resolvedCat === '購物' ? 120 : (resolvedCat === '住宿' ? 0 : (resolvedCat === '交通' ? 15 : 60)),
            parking_info: '',
            source_url: line.startsWith('http') ? line : '',
            photo_url: '',
            status: 'pocket',
            assigned_day: 'pocket',
            sort_order: '1',
            lat: /^那霸(空港|機場)/.test(line) ? 26.2064 : (/PARCO\s*CITY/i.test(line) ? 26.261754 : 26.2124),
            lng: /^那霸(空港|機場)/.test(line) ? 127.6522 : (/PARCO\s*CITY/i.test(line) ? 127.698180 : 127.6809)
          });
        });
        saveLocalState();
        renderAll();
        inputEl.value = '';
        showToast(`✅ 已加入 ${lines.length} 張卡片至資料庫！`);
        return;
      }

      const btn = document.getElementById('btn-quick-add');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span>自動定位入庫中...</span>`;
      lucide.createIcons();

      try {
        const res = await fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'quick_batch_add',
            input: rawText,
            category: category,
            area: area
          })
        });
        const data = await res.json();
        if (data.status === 'success' && data.spots && data.spots.length > 0) {
          data.spots.reverse().forEach(s => spots.unshift(s));
          saveLocalState();
          renderAll();
          inputEl.value = '';
          const names = data.spots.map(s => s.name).join('、');
          showToast(`✅ 已定位並加入 ${data.spots.length} 張卡片至資料庫：${names}`);
        } else {
          throw new Error(data.message || '建卡失敗');
        }
      } catch (err) {
        showToast('⚠️ 建卡失敗：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="map-pin-plus" class="w-3.5 h-3.5"></i> <span>批次自動定位並加入資料庫</span>`;
        lucide.createIcons();
      }
    }

    function renderPocketList(daysList) {
      const container = document.getElementById('pocket-dropzone');
      const keyword = document.getElementById('search-input').value.trim().toLowerCase();
      const dayLabelMap = {};
      (daysList || []).forEach(d => { dayLabelMap[d.dateStr] = d.label; });

      const dbSpots = spots
        .filter(s => currentCategoryFilter === '全部' || s.category === currentCategoryFilter)
        .filter(s => currentAreaFilter === '全部' || s.area === currentAreaFilter)
        .filter(s => {
          const assigned = getSpotAssignedDays(s);
          if (currentDbStatusFilter === 'unscheduled') return assigned.length === 0;
          if (currentDbStatusFilter === 'scheduled') return assigned.length > 0;
          if (currentDbStatusFilter === 'revisit') return isSpotRevisit(s);
          return true;
        })
        .filter(s => !keyword || 
          (s.name && s.name.toLowerCase().includes(keyword)) ||
          (s.must_buy && s.must_buy.toLowerCase().includes(keyword)) ||
          (s.description && s.description.toLowerCase().includes(keyword))

            </div>
          ` : ''}
          <div class="p-2.5">
            ${(!spot.photo_url && (isIncluded || isRevisit)) ? `
              <div class="flex flex-wrap items-center gap-1 mb-1.5">
                ${isIncluded ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">✅ 已納入行程 (${dayNamesText})</span>` : ''}
                ${isRevisit ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">⭐ 值得二訪</span>` : ''}
              </div>
            ` : (spot.photo_url && isRevisit ? `
              <div class="mb-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">⭐ 值得二訪</span>
              </div>
            ` : '')}

            <div class="flex items-start justify-between gap-1.5 mb-1">
              <h4 class="font-bold text-xs sm:text-sm text-ink-dark leading-snug">${spot.name}</h4>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" onclick="event.stopPropagation(); toggleSpotRevisit('${spot.id}')"
                  class="p-1 rounded hover:bg-amber-50 transition ${isRevisit ? 'text-amber-500' : 'text-slate-300 hover:text-amber-400'}"
                  title="${isRevisit ? '取消值得二訪標記' : '標記為值得二訪'}">

                </button>
                <span class="text-[10px] px-1.5 py-0.5 rounded-md border font-medium ${theme.badge}">${spot.category}</span>
              </div>
            </div>

            ${spot.description ? `<p class="text-[11px] text-slate-500 line-clamp-2 mb-1.5">${spot.description}</p>` : ''}

            ${spot.must_buy ? `
              <div class="${isHotel ? 'bg-purple-50 border-purple-200 text-purple-950' : (isTransport ? 'bg-sky-50 border-sky-200 text-sky-900' : 'bg-amber-50/70 border-amber-100 text-amber-900')} border rounded-lg px-2 py-1 mb-1.5 text-[11px]">

            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1.5 border-t border-slate-100">
              <span class="flex items-center gap-1">

                  ? `<i data-lucide="bed-double" class="w-3 h-3 text-purple-600"></i> 住宿飯店 (可重複拖入)` 
                  : (isTransport
                      ? `<i data-lucide="train" class="w-3 h-3 text-sky-600"></i> 交通樞紐`
                      : `<i data-lucide="clock" class="w-3 h-3"></i> ${spot.estimated_duration || 60}分`)

            </div>
          </div>
        </div>
      `;
    }

    // ==================== 多層次交通策略與單日分段耗時計算 ====================
    function getLegKey(dateStr, itemA, itemB) {
      return `${dateStr}|${itemA.spot.id}#${itemA.dayOccNum}|${itemB.spot.id}#${itemB.dayOccNum}`;
    }

    function resolveLegMode(dateStr, itemA, itemB, globalMode) {
      const key = getLegKey(dateStr, itemA, itemB);
      if (legModeOverrides[key]) return legModeOverrides[key];

      if (globalMode === 'driving') return 'driving';
      if (globalMode === 'walking') return 'walking';

      const spotA = itemA.spot;
      const spotB = itemB.spot;
      const latA = parseFloat(spotA.lat), lngA = parseFloat(spotA.lng);
      const latB = parseFloat(spotB.lat), lngB = parseFloat(spotB.lng);
      const km = haversineKm(latA, lngA, latB, lngB);
      const stA = findNearestYuiRailStation(latA, lngA);
      const stB = findNearestYuiRailStation(latB, lngB);

      if (stA.distKm <= 1.2 && stB.distKm <= 1.2 && stA.index !== stB.index) {
        return 'monorail';
      }
      if (km <= 0.75) {
        return 'walking';
      }
      if (globalMode === 'hybrid' && km > 0.75 && km <= 3.2 && (stA.distKm > 1.2 || stB.distKm > 1.2)) {
        return 'taxi';
      }
      return 'bus';
    }

    function estimateSingleLegQuick(dateStr, itemA, itemB, globalMode) {
      const spotA = itemA.spot, spotB = itemB.spot;
      if (!spotA.lat || !spotA.lng || !spotB.lat || !spotB.lng) return { mins: 0, km: 0, mode: 'bus' };
      const latA = parseFloat(spotA.lat), lngA = parseFloat(spotA.lng);
      const latB = parseFloat(spotB.lat), lngB = parseFloat(spotB.lng);
      const km = haversineKm(latA, lngA, latB, lngB);
      const mode = resolveLegMode(dateStr, itemA, itemB, globalMode);

      if (mode === 'monorail') {
        const stA = findNearestYuiRailStation(latA, lngA);
        const stB = findNearestYuiRailStation(latB, lngB);
        const hops = Math.abs(stA.index - stB.index);
        const walkMins = Math.round(((stA.distKm + stB.distKm) * 1.25 / 4.2) * 60);
        return { mins: Math.round(hops * 2.2 + 4 + walkMins), km: km * 1.2, mode };
      }
      if (mode === 'walking') {
        return { mins: Math.max(3, Math.round((km * 1.25 / 4.2) * 60)), km: km * 1.25, mode };
      }
      if (mode === 'taxi') {
        return { mins: Math.max(4, Math.round((km * 1.35 / 30) * 60 + 2)), km: km * 1.35, mode };
      }
      if (mode === 'driving') {
        return { mins: Math.max(3, Math.round((km * 1.3 / 34) * 60)), km: km * 1.3, mode };
      }
      return { mins: Math.max(8, Math.round((km * 1.3 / 24) * 60 + 8)), km: km * 1.3, mode: 'bus' };
    }

    function estimateDayTransitMinutes(dateStr, dayItems) {
      if (!dayItems || dayItems.length < 2) return 0;
      const globalMode = document.getElementById('map-travel-mode')?.value || 'hybrid';
      let total = 0;
      for (let i = 0; i < dayItems.length - 1; i++) {
        total += estimateSingleLegQuick(dateStr, dayItems[i], dayItems[i + 1], globalMode).mins;
      }
      return total;
    }

    function extendHotelToDay(spotId, nextDateStr, nextDayLabel) {
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;
      const occs = getSpotOccurrences(spot);
      if (!occs.some(o => o.dateStr === nextDateStr)) {
        occs.push({ dateStr: nextDateStr, order: 1 });
        occs.sort((a, b) => a.dateStr.localeCompare(b.dateStr) || a.order - b.order);
        spot.assigned_day = occs.map(o => o.dateStr).join(',');
        spot.sort_order = occs.map(o => o.order).join(',');
        const rev = isSpotRevisit(spot);
        spot.status = rev ? 'scheduled|revisit' : 'scheduled';
        saveLocalState();
        renderAll();
        scrollToDayColumn(nextDateStr);
        showToast(`🏨 已將「${spot.name}」連住排入 ${nextDayLabel}！`);

        if (appConfig.gasUrl) {
          fetch(appConfig.gasUrl, {
            method: 'POST',
            body: JSON.stringify({
              action: 'sync_board',
              updates: [{ id: spot.id, assigned_day: spot.assigned_day, sort_order: spot.sort_order, is_revisit: rev }]
            })
          }).catch(err => console.error('背景同步失敗', err));
        }
      }
    }

    function initSortableDragAndDrop() {
      const pocketEl = document.getElementById('pocket-dropzone');
      if (pocketEl) {
        new Sortable(pocketEl, {
          group: { name: 'okinawa-cards', pull: 'clone', put: false },
          sort: false,
          animation: 180,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag'
        });
      }

      document.querySelectorAll('.day-dropzone').forEach(zone => {
        new Sortable(zone, {
          group: 'okinawa-cards',
          animation: 180,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag',
          onAdd: handleDragEnd,
          onUpdate: handleDragEnd,
          onRemove: handleDragEnd
        });
      });
    }

    function handleDragEnd() {
      const cardOccMap = {};
      spots.forEach(s => { cardOccMap[s.id] = []; });

      // 依序掃描所有每日看板欄位，完整記錄每一張卡片出現的日期與順序（允許同日多次出現）
      document.querySelectorAll('.day-dropzone').forEach(zone => {
        const dayStr = zone.dataset.day;
        zone.querySelectorAll('.spot-card').forEach((card, idx) => {
          const id = card.dataset.id;
          if (!cardOccMap[id]) cardOccMap[id] = [];
          cardOccMap[id].push({ dateStr: dayStr, order: idx + 1 });
        });
      });

      const updates = [];
      spots.forEach(spot => {
        const occs = cardOccMap[spot.id] || [];
        const newAssigned = occs.length > 0 ? occs.map(o => o.dateStr).join(',') : 'pocket';
        const newOrder = occs.length > 0 ? occs.map(o => o.order).join(',') : (String(spot.sort_order).split(',')[0] || '99');
        const rev = isSpotRevisit(spot);
        spot.assigned_day = newAssigned;
        spot.status = newAssigned === 'pocket'
          ? (rev ? 'pocket|revisit' : 'pocket')
          : (rev ? 'scheduled|revisit' : 'scheduled');
        spot.sort_order = newOrder;
        updates.push({ id: spot.id, assigned_day: newAssigned, sort_order: newOrder, is_revisit: rev });
      });

      saveLocalState();
      renderAll();
      showToast('已更新行程排程與順序！');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'sync_board', updates })
        }).catch(err => console.error('背景同步失敗', err));
      }
    }

    // ==================== 空間距離與單軌軌道切片工具 ====================
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function findNearestYuiRailStation(lat, lng) {
      let bestIdx = 0;
      let minDist = Infinity;
      YUI_RAIL_STATIONS.forEach((st, idx) => {
        const d = haversineKm(parseFloat(lat), parseFloat(lng), st.lat, st.lng);
        if (d < minDist) {
          minDist = d;
          bestIdx = idx;
        }
      });
      return { station: YUI_RAIL_STATIONS[bestIdx], index: bestIdx, distKm: minDist };
    }

    function getYuiRailTrackSlice(stA, stB) {
      const startTrack = stA.station.trackIdx;
      const endTrack = stB.station.trackIdx;
      const step = startTrack <= endTrack ? 1 : -1;
      const coords = [];
      for (let i = startTrack; i !== endTrack + step; i += step) {
        coords.push([YUI_RAIL_TRACK[i].lat, YUI_RAIL_TRACK[i].lng]);
      }
      return coords;
    }

    async function fetchOsrmSegment(profile, latA, lngA, latB, lngB) {
      try {
        const url = `https://router.project-osrm.org/route/v1/${profile}/${lngA},${latA};${lngB},${latB}?overview=full&geometries=geojson`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
          return {
            coords: data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]),
            distKm: data.routes[0].distance / 1000,
            durMins: Math.max(1, Math.round(data.routes[0].duration / 60))
          };
        }
      } catch (e) {}
      const fallbackKm = haversineKm(latA, lngA, latB, lngB) * 1.25;
      const speed = profile === 'foot' ? 4.2 : 30;
      return {
        coords: [[latA, lngA], [latB, lngB]],
        distKm: fallbackKm,
        durMins: Math.max(1, Math.round((fallbackKm / speed) * 60))
      };
    }

    function buildPointToPointGmapsUrl(latA, lngA, latB, lngB, legMode) {
      const gMode = legMode === 'walking' ? 'walking' : ((legMode === 'driving' || legMode === 'taxi') ? 'driving' : 'transit');
      const params = new URLSearchParams({
        api: '1',
        origin: `${latA},${lngA}`,
        destination: `${latB},${lngB}`,
        travelmode: gMode
      });
      return `https://www.google.com/maps/dir/?${params.toString()}`;
    }

    function setLegModeOverride(legKey, newMode) {
      legModeOverrides[legKey] = newMode;
      saveLocalState();
      renderAll();
    }

    function resetDaySegmentOverrides() {
      const filterDay = document.getElementById('map-day-selector').value;
      Object.keys(legModeOverrides).forEach(k => {
        if (k.startsWith(filterDay + '|')) delete legModeOverrides[k];
      });
      saveLocalState();
      renderAll();

    async function updateMapMarkers() {
      if (!mapInstance || !mapLayerGroup) return;
      mapLayerGroup.clearLayers();

      const filterDay = document.getElementById('map-day-selector').value;
      const globalMode = document.getElementById('map-travel-mode').value;
      const summaryBox = document.getElementById('map-route-summary');
      const metricsEl = document.getElementById('map-route-metrics');
      const breakdownEl = document.getElementById('map-segment-breakdown');
      const resetBtn = document.getElementById('btn-reset-leg-modes');

      const isSingleDayRoute = filterDay !== 'all' && filterDay !== 'scheduled_all';
      let dayRouteItems = [];

      if (isSingleDayRoute) {
        dayRouteItems = getDayItems(filterDay).filter(it => it.spot.lat && it.spot.lng);
      } else {
        let baseSpots = spots.filter(s => s.lat && s.lng);
        if (filterDay === 'scheduled_all') {
          baseSpots = baseSpots.filter(s => getSpotAssignedDays(s).length > 0);
        }
        dayRouteItems = baseSpots.map(s => ({ spot: s, dayOccNum: 1, totalDayOccs: 1 }));
      }

      const latLngs = [];
      const renderedSpotIds = new Set();

      dayRouteItems.forEach((item, index) => {
        const spot = item.spot;
        const lat = parseFloat(spot.lat);
        const lng = parseFloat(spot.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        latLngs.push([lat, lng]);
        // 若同一天出現多次（如飯店出發與返回飯店），地圖上避免兩個完全重疊圖釘遮擋，合併顯示為「宿·往返」
        if (isSingleDayRoute && renderedSpotIds.has(spot.id)) return;
        renderedSpotIds.add(spot.id);

        const isHotel = spot.category === '住宿';
        const isTransport = spot.category === '交通';
        const theme = CATEGORY_THEME[spot.category] || { hex: '#2B4C7E' };
        const isRoundTrip = isSingleDayRoute && item.totalDayOccs > 1;

        let markerHtml = '';
        if (isHotel) {
          markerHtml = `<div style="background:${theme.hex};color:#fff;width:${isRoundTrip ? 32 : 26}px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:10px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);">${isRoundTrip ? '宿↺' : '宿'}</div>`;
        } else if (isTransport) {
          markerHtml = `<div style="background:${theme.hex};color:#fff;width:${isRoundTrip ? 32 : 26}px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:10px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);">${isRoundTrip ? '行↺' : '行'}</div>`;
        } else if (isSingleDayRoute) {
          markerHtml = `<div style="background:${theme.hex};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);">${index + 1}</div>`;
        } else {
          markerHtml = `<div style="background:${theme.hex};width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>`;
        }

        const customIcon = L.divIcon({ html: markerHtml, className: '', iconSize: [28, 26], iconAnchor: [14, 13] });
        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(mapLayerGroup);
        marker.bindPopup(`
          <div class="text-xs">
            <strong class="text-sm text-slate-800">${spot.name}</strong>${isRoundTrip ? ' <span class="text-purple-700 font-bold">(當日出發＋回程)</span>' : ''}<br/>
            <span style="color:${theme.hex};font-weight:bold;">● ${spot.category}</span> · <span class="text-slate-500">${spot.area}</span><br/>
            ${spot.must_buy ? `<span class="text-slate-700">${isHotel ? '備註' : '重點'}：${spot.must_buy}</span>` : ''}
          </div>
        `);
      });

      // ==================== 單日多層次逐段路線計算與地圖繪製 ====================
      if (isSingleDayRoute && dayRouteItems.length > 1) {
        summaryBox.classList.remove('hidden');
        summaryBox.classList.add('flex');
        metricsEl.textContent = '正在計算多層次路網與轉乘時間...';
        breakdownEl.innerHTML = '';

        const hasOverrides = Object.keys(legModeOverrides).some(k => k.startsWith(filterDay + '|'));
        if (hasOverrides) resetBtn.classList.remove('hidden');
        else resetBtn.classList.add('hidden');

        const currentToken = ++routeRequestToken;
        let totalMins = 0;
        let totalDistKm = 0;
        const allBoundsPts = [];
        const segmentCards = [];

        for (let i = 0; i < dayRouteItems.length - 1; i++) {
          const itemA = dayRouteItems[i];
          const itemB = dayRouteItems[i + 1];
          const pA = itemA.spot;
          const pB = itemB.spot;
          const latA = parseFloat(pA.lat), lngA = parseFloat(pA.lng);
          const latB = parseFloat(pB.lat), lngB = parseFloat(pB.lng);

          const legKey = getLegKey(filterDay, itemA, itemB);
          const legMode = resolveLegMode(filterDay, itemA, itemB, globalMode);
          const gmapsLegUrl = buildPointToPointGmapsUrl(latA, lngA, latB, lngB, legMode);

          let legMins = 0;
          let legDistKm = 0;
          let detailNote = '';

          if (legMode === 'monorail') {
            const stA = findNearestYuiRailStation(latA, lngA);
            const stB = findNearestYuiRailStation(latB, lngB);
            const railCoords = getYuiRailTrackSlice(stA, stB);

            L.polyline(railCoords, { color: '#0284C7', weight: 5, opacity: 0.92 }).addTo(mapLayerGroup);
            allBoundsPts.push(...railCoords);

            let walkMinsA = 0, walkMinsB = 0;
            if (stA.distKm > 0.08) {
              const walkA = await fetchOsrmSegment('foot', latA, lngA, stA.station.lat, stA.station.lng);
              if (currentToken !== routeRequestToken) return;
              L.polyline(walkA.coords, { color: '#059669', weight: 3.5, dashArray: '4, 6', opacity: 0.9 }).addTo(mapLayerGroup);
              allBoundsPts.push(...walkA.coords);
              walkMinsA = walkA.durMins;
            }
            if (stB.distKm > 0.08) {
              const walkB = await fetchOsrmSegment('foot', stB.station.lat, stB.station.lng, latB, lngB);
              if (currentToken !== routeRequestToken) return;
              L.polyline(walkB.coords, { color: '#059669', weight: 3.5, dashArray: '4, 6', opacity: 0.9 }).addTo(mapLayerGroup);
              allBoundsPts.push(...walkB.coords);
              walkMinsB = walkB.durMins;
            }

            const hops = Math.abs(stA.index - stB.index);
            const railRideMins = Math.max(2, Math.round(hops * 2.2 + 4));
            legMins = railRideMins + walkMinsA + walkMinsB;
            legDistKm = haversineKm(latA, lngA, latB, lngB) * 1.25;
            detailNote = `單軌(${stA.station.name.replace('站','')}→${stB.station.name.replace('站','')}) ${(walkMinsA + walkMinsB) > 0 ? `+ 步行${walkMinsA + walkMinsB}分` : ''}`;

          } else if (legMode === 'bus') {
            const road = await fetchOsrmSegment('driving', latA, lngA, latB, lngB);
            if (currentToken !== routeRequestToken) return;
            L.polyline(road.coords, { color: '#0284C7', weight: 4.5, dashArray: '8, 6', opacity: 0.88 }).addTo(mapLayerGroup);
            allBoundsPts.push(...road.coords);
            legDistKm = road.distKm;
            legMins = Math.max(8, Math.round(road.durMins * 1.55 + 8));
            detailNote = `沿線公車/客運 + 站牌步行 (${legDistKm.toFixed(1)} km)`;

          } else if (legMode === 'taxi') {
            const road = await fetchOsrmSegment('driving', latA, lngA, latB, lngB);
            if (currentToken !== routeRequestToken) return;
            L.polyline(road.coords, { color: '#D97706', weight: 4.5, opacity: 0.9 }).addTo(mapLayerGroup);
            allBoundsPts.push(...road.coords);
            legDistKm = road.distKm;
            legMins = Math.max(4, road.durMins + 2);
            const estYen = Math.round((600 + Math.max(0, legDistKm - 1.75) * 280) / 10) * 10;
            detailNote = `點對點計程車 (${legDistKm.toFixed(1)} km · 預估 ¥${estYen})`;

          } else if (legMode === 'walking') {
            const walk = await fetchOsrmSegment('foot', latA, lngA, latB, lngB);
            if (currentToken !== routeRequestToken) return;
            L.polyline(walk.coords, { color: '#059669', weight: 4, dashArray: '4, 6', opacity: 0.9 }).addTo(mapLayerGroup);
            allBoundsPts.push(...walk.coords);
            legDistKm = walk.distKm;
            legMins = walk.durMins;
            detailNote = `街道步行 (${legDistKm.toFixed(1)} km)`;

          } else {
            const drive = await fetchOsrmSegment('driving', latA, lngA, latB, lngB);
            if (currentToken !== routeRequestToken) return;
            L.polyline(drive.coords, { color: '#2B4C7E', weight: 4.5, opacity: 0.9 }).addTo(mapLayerGroup);
            allBoundsPts.push(...drive.coords);
            legDistKm = drive.distKm;
            legMins = drive.durMins;
            detailNote = `自駕行駛 (${legDistKm.toFixed(1)} km)`;
          }

          totalMins += legMins;
          totalDistKm += legDistKm;

          const nameBDisplay = (itemB.totalDayOccs > 1 && itemB.dayOccNum > 1) ? `${pB.name} (回程)` : pB.name;

          segmentCards.push(`
            <div class="bg-slate-50 border border-slate-200/80 rounded-lg p-1.5 space-y-1">
              <div class="flex items-center justify-between gap-1">
                <span class="font-bold text-slate-800 truncate">
                  ${i + 1}→${i + 2} ${pA.name} → ${nameBDisplay}
                </span>
                <span class="font-bold text-ai-indigo shrink-0">約 ${legMins} 分</span>
              </div>
              <div class="flex items-center justify-between gap-1.5">
                <select onchange="setLegModeOverride('${legKey}', this.value)"
                  class="text-[10px] bg-white border border-slate-300 rounded px-1.5 py-0.5 font-medium text-slate-700 focus:outline-none">
                  <option value="monorail" ${legMode === 'monorail' ? 'selected' : ''}>🚝 單軌+步行</option>
                  <option value="bus" ${legMode === 'bus' ? 'selected' : ''}>🚌 公車+步行</option>
                  <option value="taxi" ${legMode === 'taxi' ? 'selected' : ''}>🚕 計程車接駁</option>
                  <option value="walking" ${legMode === 'walking' ? 'selected' : ''}>🚶 純步行</option>
                  <option value="driving" ${legMode === 'driving' ? 'selected' : ''}>🚗 自駕</option>
                </select>
                <span class="text-slate-500 truncate flex-1">${detailNote}</span>
                <a href="${gmapsLegUrl}" target="_blank" class="text-ai-indigo hover:underline font-bold flex items-center gap-0.5 shrink-0" title="開啟 Google Maps 檢視此段實際時刻與路線">
                  <span>Google</span>
                  <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                </a>
              </div>
            </div>
          `);
        }

        metricsEl.textContent = `🧭 當日移動總計：約 ${totalMins} 分 (${totalDistKm.toFixed(1)} km)`;
        breakdownEl.innerHTML = segmentCards.join('');
        lucide.createIcons();

        if (allBoundsPts.length > 0) {
          mapInstance.fitBounds(L.latLngBounds(allBoundsPts), { padding: [40, 40], maxZoom: 15 });
        }
        return;
      } else {
        summaryBox.classList.add('hidden');
        summaryBox.classList.remove('flex');
      }

      if (latLngs.length > 0) {
        mapInstance.fitBounds(L.latLngBounds(latLngs), { padding: [40, 40], maxZoom: 14 });
      }
    }

    async function handleSaveCard(e) {
      e.preventDefault();
      const id = document.getElementById('field-id').value;
      const category = document.getElementById('field-category').value;
      const isRevisit = document.getElementById('field-revisit').checked;
      const existingSpot = id ? spots.find(s => s.id === id) : null;

      let assignedDay = 'pocket';
      let sortOrderStr = existingSpot ? String(existingSpot.sort_order || '99') : '99';

      if (category === '住宿') {
        const checkedDays = [...document.querySelectorAll('input[name="stay_days"]:checked')].map(cb => cb.value);
        if (checkedDays.length === 0) {
          assignedDay = 'pocket';
          sortOrderStr = '99';
        } else {
          // 保留原有同日多筆（如出發＋回程）結構，僅增刪被勾選/取消的日期
          const prevOccs = existingSpot ? getSpotOccurrences(existingSpot) : [];
          const nextOccs = [];
          checkedDays.sort().forEach(dStr => {
            const matched = prevOccs.filter(o => o.dateStr === dStr);
            if (matched.length > 0) {
              nextOccs.push(...matched);
            } else {
              nextOccs.push({ dateStr: dStr, order: 1 });
            }
          });
          assignedDay = nextOccs.map(o => o.dateStr).join(',');
          sortOrderStr = nextOccs.map(o => o.order).join(',');
        }
      } else {
        const selDay = document.getElementById('field-day').value;
        assignedDay = selDay;
        if (selDay === 'pocket') {
          sortOrderStr = '99';
        } else if (existingSpot && getSpotUniqueDays(existingSpot).includes(selDay)) {
          // 保留原本在該日的排程
          const prevOccs = getSpotOccurrences(existingSpot).filter(o => o.dateStr === selDay);
          assignedDay = prevOccs.map(o => o.dateStr).join(',');
          sortOrderStr = prevOccs.map(o => o.order).join(',');
        }
      }

      const baseStatus = assignedDay === 'pocket' ? 'pocket' : 'scheduled';
      const finalStatus = isRevisit ? `${baseStatus}|revisit` : baseStatus;

      const cardObj = {
        id: id || ('spot_' + Date.now()),
        name: document.getElementById('field-name').value.trim(),
        category: category,
        area: document.getElementById('field-area').value,
        estimated_duration: Number(document.getElementById('field-duration').value) || 0,
        assigned_day: assignedDay,
        sort_order: sortOrderStr,
        status: finalStatus,
        description: document.getElementById('field-description').value.trim(),
        must_buy: document.getElementById('field-must-buy').value.trim(),
        business_hours: document.getElementById('field-hours').value.trim(),
        parking_info: document.getElementById('field-parking').value.trim(),
        source_url: document.getElementById('field-source-url').value.trim(),
        photo_url: document.getElementById('field-photo-url').value.trim(),
        lat: document.getElementById('field-lat').value.trim(),
        lng: document.getElementById('field-lng').value.trim()
      };

      if (id) {
        const idx = spots.findIndex(s => s.id === id);
        if (idx > -1) spots[idx] = { ...spots[idx], ...cardObj };
      } else {
        spots.unshift(cardObj);
      }

      saveLocalState();
      renderAll();
      closeModal('modal-card-detail');
      showToast('資料庫卡片已儲存！');

      if (appConfig.gasUrl) {
        try {
          const res = await fetch(appConfig.gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: id ? 'update_spot' : 'add_spot', spot: cardObj })
          });
          const data = await res.json();
          if (data.status === 'success' && data.spot) {
            const idx = spots.findIndex(s => s.id === data.spot.id);
            if (idx > -1) spots[idx] = data.spot;
            saveLocalState();
            renderAll();
          }
        } catch (err) {
          console.error('同步失敗', err);
        }
      }
    }

    async function handleDeleteCard() {
      const id = document.getElementById('field-id').value;
      if (!id || !confirm('確定要從資料庫永久刪除這張卡片嗎？')) return;

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete_spot', id })
        });
      }
    }

    // ==================== 雲端雙向同步 ====================
    async function syncFromCloud() {
      if (!appConfig.gasUrl) {
        openModal('modal-settings');
        showToast('請先設定 Google Apps Script 網址');
        return;
      }

      const btn = document.getElementById('btn-sync-cloud');
      btn.disabled = true;
      setSyncButtonState('syncing');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const res = await fetch(appConfig.gasUrl, {
          method: 'GET',
          redirect: 'follow',
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const contentType = res.headers.get('content-type') || '';
        const rawText = await res.text();

        if (!contentType.includes('application/json') && rawText.trim().startsWith('<')) {
          throw new Error('GAS 回傳了網頁而非 JSON，請確認部署權限「誰可以存取」已設為「所有人 (Anyone)」。');
        }

        const data = JSON.parse(rawText);
        if (data.status === 'success') {
          spots = data.spots || [];
          if (data.config) {
            if (data.config.trip_title) appConfig.tripTitle = data.config.trip_title;
            if (data.config.start_date) appConfig.startDate = String(data.config.start_date).slice(0, 10);
            if (data.config.end_date) appConfig.endDate = String(data.config.end_date).slice(0, 10);
          }
          saveLocalState();
          updateHeaderUI();
          updateSyncBadge('Google 試算表已連線', 'bg-emerald-500');
          renderAll();
          setSyncButtonState('synced');
          showToast(`✅ 同步完成！資料庫共 ${spots.length} 張卡片`);
        } else {
          throw new Error(data.message || '後端回傳錯誤');
        }
      } catch (err) {
        clearTimeout(timeoutId);
        updateSyncBadge('連線異常 (點擊重試)', 'bg-red-500');
        setSyncButtonState('error');
        const errMsg = err.name === 'AbortError'
          ? '連線逾時（超過15秒），請檢查網路或 GAS 部署狀態。'
          : err.message;
        showToast('⚠️ ' + errMsg);
        console.error('Sync Error:', err);
      } finally {
        btn.disabled = false;
      }
    }

    function saveBoardOrderToCloud() {
      handleDragEnd();
      if (!appConfig.gasUrl) {
        showToast('已儲存於本機瀏覽器');
      } else {
        setSyncButtonState('synced');
        showToast('已將最新排程順序同步至雲端試算表！');
      }
    }

    // ==================== 篩選、設定與響應式切換 ====================
    function setFilterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = btn.textContent.includes(cat)
          ? 'cat-btn active px-2 py-0.5 rounded-full text-[11px] font-medium bg-ai-indigo text-white shrink-0'
          : 'cat-btn px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0';
      });
      renderAll();
    }

    function setFilterDbStatus(st) {
      currentDbStatusFilter = st;
      const mapLabel = { all: '全部資料庫', unscheduled: '未排入', scheduled: '已納入', revisit: '值得二訪' };
      document.querySelectorAll('.db-status-btn').forEach(btn => {
        const active = btn.textContent.includes(mapLabel[st]);
        btn.className = active
          ? 'db-status-btn px-2 py-0.5 rounded bg-slate-800 text-white font-medium shrink-0'
          : 'db-status-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0';
      });
      renderAll();
    }

    function setFilterArea(area) {
      currentAreaFilter = area;
      document.querySelectorAll('.area-btn').forEach(btn => {
        const match = (area === '全部' && btn.textContent === '全沖繩') || btn.textContent.includes(area);
        btn.className = match
          ? 'area-btn px-2 py-0.5 rounded bg-slate-200 text-slate-800 font-medium shrink-0'
          : 'area-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 shrink-0';
      });
      renderAll();
    }

    function saveSettings() {
      appConfig.gasUrl = document.getElementById('setting-gas-url').value.trim();
      appConfig.tripTitle = document.getElementById('setting-trip-title').value.trim() || '2027沖繩首發自由行';
      appConfig.startDate = document.getElementById('setting-start-date').value;
      appConfig.endDate = document.getElementById('setting-end-date').value;

      saveLocalState();
      updateHeaderUI();
      updateSyncBadge();
      renderAll();
      closeModal('modal-settings');

      if (appConfig.gasUrl) {
        fetch(appConfig.gasUrl, {
          method: 'POST',
          body: JSON.stringify({
            action: 'update_config',
            config: {
              trip_title: appConfig.tripTitle,
              start_date: appConfig.startDate,
              end_date: appConfig.endDate
            }
          })
        });
        syncFromCloud();
      } else {
        showToast('設定已儲存！');
      }
    }

    function switchMobileTab(tab) {
      if (window.innerWidth >= 1024) return;
      const panels = {
        pocket: document.getElementById('panel-pocket'),
        itinerary: document.getElementById('panel-itinerary'),
        map: document.getElementById('panel-map')
      };
      Object.keys(panels).forEach(k => {
        if (k === tab) {
          panels[k].classList.remove('hidden');
          panels[k].classList.add('flex');
        } else {
          panels[k].classList.add('hidden');
          panels[k].classList.remove('flex');
        }
        const btn = document.getElementById(`tab-${k}`);
        btn.className = k === tab
          ? 'flex-1 py-2.5 text-center border-b-2 border-ai-indigo text-ai-indigo'
          : 'flex-1 py-2.5 text-center border-b-2 border-transparent text-slate-500';
      });
      if (tab === 'map' && mapInstance) {
        setTimeout(() => mapInstance.invalidateSize(), 150);
      }
    }

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 4000);
    }

    function registerInlinePWA() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => {
            if (e.request.method !== 'GET') return;
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      }
    }
  </script>
</body>
</html>
